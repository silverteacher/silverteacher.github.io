<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Défi Beatles - Lettre Débloquée</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/9/9f/Beatles_ad_1965_just_the_beatles_crop.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            filter: grayscale(30%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .trophy {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: bold;
            line-height: 1.2;
        }

        .letter {
            display: inline-block;
            font-size: 120px;
            font-weight: bold;
            color: #764ba2;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 30px 0;
            padding: 20px;
            border: 5px solid #667eea;
            border-radius: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .message {
            font-size: 1.4em;
            color: #333;
            line-height: 1.6;
            margin-top: 20px;
        }

        .highlight {
            color: #764ba2;
            font-weight: bold;
        }

        .note {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-radius: 15px;
            font-size: 1.1em;
            color: #555;
            font-style: italic;
            line-height: 1.5;
        }

        /* Tablettes */
        @media screen and (max-width: 768px) {
            body { padding: 15px; }
            .container { padding: 40px 30px; border-radius: 25px; }
            .trophy { font-size: 60px; margin-bottom: 15px; }
            h1 { font-size: 2em; margin-bottom: 15px; }
            .letter { font-size: 100px; padding: 15px; margin: 20px 0; border-width: 4px; }
            .message { font-size: 1.2em; margin-top: 15px; }
            .note { margin-top: 25px; padding: 15px; font-size: 1em; }
        }

        /* Mobiles */
        @media screen and (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 30px 20px; border-radius: 20px; }
            .trophy { font-size: 50px; margin-bottom: 10px; }
            h1 { font-size: 1.6em; margin-bottom: 12px; }
            .letter { font-size: 80px; padding: 12px; margin: 15px 0; border-width: 3px; }
            .message { font-size: 1.1em; margin-top: 12px; }
            .note { margin-top: 20px; padding: 12px; font-size: 0.95em; }
        }

        /* Petits mobiles */
        @media screen and (max-width: 360px) {
            .container { padding: 25px 15px; }
            .trophy { font-size: 45px; }
            h1 { font-size: 1.4em; }
            .letter { font-size: 70px; padding: 10px; }
            .message { font-size: 1em; }
            .note { font-size: 0.9em; }
        }

        /* Mode paysage mobile */
        @media screen and (max-height: 600px) and (orientation: landscape) {
            body { padding: 10px; }
            .container { padding: 20px; max-width: 500px; }
            .trophy { font-size: 40px; margin-bottom: 10px; }
            h1 { font-size: 1.5em; margin-bottom: 10px; }
            .letter { font-size: 60px; padding: 10px; margin: 10px 0; }
            .message { font-size: 1em; margin-top: 10px; }
            .note { margin-top: 15px; padding: 10px; font-size: 0.85em; }
        }
    </style>
</head>
<body>
    <div class="background-image"></div>
    
    <div class="container">
        <div class="trophy">🏆</div>
        <h1>Bravo équipe Beatles !</h1>
        
        <div class="message">
            Vous avez débloqué la lettre
        </div>
        
        <div class="letter">A</div>
        
        <div class="note">
            <strong class="highlight">Gardez-la précieusement</strong> pour le grand rassemblement final !
        </div>
    </div>
</body>
</html>
