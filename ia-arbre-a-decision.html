<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbre de Décision - Résistance aux IA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #3498db;
            margin-bottom: 20px;
        }
        #question {
            font-size: 18px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        #critere {
            font-size: 14px;
            color: #7f8c8d;
            font-style: italic;
            margin-bottom: 20px;
        }
        .btn-container {
            display: flex;
            gap: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-yes {
            background-color: #2ecc71;
            color: white;
        }
        .btn-no {
            background-color: #e74c3c;
            color: white;
        }
        #resultat {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
        #summary {
            background-color: #f1f3f4;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
            display: none;
        }
        #restart {
            display: none;
            background-color: #3498db;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Résistance à l'IA : évaluez votre tâche</h1>
        <p id="question">La tâche nécessite-t-elle une expérience personnelle ou subjective ?</p>
        <p id="critere">Critère : expérience unique qui ne peut pas être générée par une IA</p>
        <div class="btn-container">
            <button class="btn-yes" onclick="repondre(true)">Oui</button>
            <button class="btn-no" onclick="repondre(false)">Non</button>
        </div>
        <p id="resultat"></p>
        <div id="summary"></div>
        <button id="restart" onclick="recommencer()">Recommencer</button>
    </div>

    <script>
        const questions = [
            {
                question: "La tâche nécessite-t-elle une expérience personnelle unique ou subjective ?",
                critere: "Critère : expérience unique qui ne peut pas être générée par une IA",
                explication: "Les tâches basées sur des expériences personnelles sont difficiles à reproduire par les IA."
            },
            {
                question: "Intègre-t-elle une phase en présentiel supervisée ?",
                critere: "Critère : contrôle direct et supervision en temps réel par l'enseignant",
                explication: "La présence physique limite l'utilisation des IA et garantit l'authenticité du travail."
            },
            {
                question: "Évalue-t-elle le processus (brouillons, étapes intermédiaires) ?",
                critere: "Critère : suivi de la progression et de la démarche",
                explication: "Suivre l'évolution du travail des élèves permet de vérifier l'implication personnelle."
            },
            {
                question: "Implique-t-elle un travail collaboratif en classe ?",
                critere: "Critère : interactions et dynamique de groupe",
                explication: "Le travail collaboratif nécessite des interactions en temps réel difficiles à simuler."
            },
            {
                question: "Mobilise-t-elle plusieurs compétences (écrit + oral/expression artistique) ?",
                critere: "Critère : compétences multidimensionnelles",
                explication: "Les tâches complexes qui combinent différentes compétences sont plus difficiles à réaliser par IA."
            },
            {
                question: "Est-elle ancrée dans l'environnement local ou l'actualité récente ?",
                critere: "Critère : contextualisation locale et actualité",
                explication: "Les sujets très récents ou spécifiques nécessitent une connaissance immédiate du contexte."
            },
            {
                question: "Limitez-vous explicitement les ressources autorisées ?",
                critere: "Critère : restriction des sources et des outils",
                explication: "Limiter les ressources réduit les possibilités de contournement par IA."
            },
            {
                question: "Demandez-vous une restitution manuscrite ou orale improvisée ?",
                critere: "Critère : production originale et spontanée",
                explication: "Les productions manuscrites ou orales improvisées sont uniques et non reproductibles."
            },
            {
                question: "Inclut-elle une réflexion critique sur l'usage des IA ?",
                critere:"Critère : méta-réflexion sur la technologie",
                explication: "Intégrer une analyse critique de l'IA incite à une approche réflexive et personnelle."
            },
            {
                question: "Prévoyez-vous des feedbacks intermédiaires personnalisés ?",
                critere: "Critère : acccompagnement et suivi personnalisé",
                explication: "Des retours personnalisés en utilisant des capsules sonores (via le dictaphone de l'ENT par exemple) encouragent une démarche individuelle et adaptative."
            }
        ];

        let index = 0;
        let score = 0;
        let criteresSatisfaits = [];
        let criteresNonSatisfaits = [];

        function repondre(oui) {
            if (oui) {
                score++;
                criteresSatisfaits.push(questions[index].explication);
            } else {
                criteresNonSatisfaits.push(questions[index].explication);
            }

            index++;
            if (index < questions.length) {
                document.getElementById("question").textContent = questions[index].question;
                document.getElementById("critere").textContent = questions[index].critere;
            } else {
                afficherResultat();
            }
        }

        function afficherResultat() {
            const resultat = document.getElementById("resultat");
            const summary = document.getElementById("summary");
            const boutonOui = document.querySelector(".btn-yes");
            const boutonNon = document.querySelector(".btn-no");
            const boutonRecommencer = document.getElementById("restart");

            if (score >= 3) {
                resultat.innerHTML = "✅ La tâche est robuste contre les IA !";
                resultat.style.color = "green";
            } else {
                resultat.innerHTML = "⚠️ Intégrez au moins 3 critères supplémentaires !";
                resultat.style.color = "red";
            }

            summary.innerHTML = `
                <h3>Détail de l'analyse :</h3>
                <p><strong>Score : ${score} / ${questions.length}</strong></p>
                
                <h4>Critères satisfaits :</h4>
                <ul>${criteresSatisfaits.map(c => `<li>${c}</li>`).join('')}</ul>
                
                <h4>Critères à améliorer :</h4>
                <ul>${criteresNonSatisfaits.map(c => `<li>${c}</li>`).join('')}</ul>
            `;

            document.getElementById("question").textContent = "Fin du questionnaire.";
            document.getElementById("critere").textContent = "Découvrez les détails de votre analyse !";
            
            boutonOui.style.display = "none";
            boutonNon.style.display = "none";
            summary.style.display = "block";
            boutonRecommencer.style.display = "block";
        }

        function recommencer() {
            index = 0;
            score = 0;
            criteresSatisfaits = [];
            criteresNonSatisfaits = [];

            document.getElementById("question").textContent = questions[0].question;
            document.getElementById("critere").textContent = questions[0].critere;
            document.getElementById("resultat").textContent = "";
            document.getElementById("summary").innerHTML = "";
            document.getElementById("summary").style.display = "none";
            
            const boutonOui = document.querySelector(".btn-yes");
            const boutonNon = document.querySelector(".btn-no");
            const boutonRecommencer = document.getElementById("restart");

            boutonOui.style.display = "block";
            boutonNon.style.display = "block";
            boutonRecommencer.style.display = "none";
        }
    </script>
</body>
</html>
