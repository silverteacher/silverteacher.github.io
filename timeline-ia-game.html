<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline IA - Jeu Numérique</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #4a5568;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #718096;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #4299e1, #3182ce);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(66, 153, 225, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(66, 153, 225, 0.4);
        }

        .btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #38b2ac, #319795);
            box-shadow: 0 4px 15px rgba(56, 178, 172, 0.3);
        }

        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(56, 178, 172, 0.4);
        }

        .game-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border: 2px solid rgba(79, 172, 254, 0.2);
        }

        .info-label {
            font-size: 0.9em;
            color: #718096;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .info-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #4a5568;
        }

        .timeline-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 15px;
            text-align: center;
            padding: 10px;
            background: rgba(79, 172, 254, 0.1);
            border-radius: 10px;
        }

        .timeline {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            min-height: 120px;
            padding: 20px;
            background: rgba(247, 250, 252, 0.8);
            border-radius: 15px;
            border: 2px dashed rgba(79, 172, 254, 0.3);
        }

        .hand-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            min-height: 120px;
            padding: 20px;
        }

        .card {
            background: linear-gradient(145deg, #ffffff, #f7fafc);
            border: 2px solid rgba(79, 172, 254, 0.2);
            border-radius: 15px;
            padding: 20px;
            width: 280px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-color: rgba(79, 172, 254, 0.5);
        }

        .card.selected {
            border-color: #4299e1;
            background: linear-gradient(145deg, #ebf8ff, #bee3f8);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(66, 153, 225, 0.3);
        }

        .card.placed {
            cursor: default;
            background: linear-gradient(145deg, #f0fff4, #c6f6d5);
            border-color: #48bb78;
        }

        .card.placed:hover {
            transform: none;
        }

        .card-date {
            font-size: 1.3em;
            font-weight: bold;
            color: #4299e1;
            margin-bottom: 8px;
        }

        .card-hidden-date {
            color: #a0aec0;
            font-style: italic;
        }

        .card-event {
            font-size: 1.1em;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .card-detail {
            font-size: 0.9em;
            color: #718096;
            line-height: 1.4;
        }

        .placement-buttons {
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .placement-btn {
            background: linear-gradient(135deg, #ed8936, #dd6b20);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(237, 137, 54, 0.3);
        }

        .placement-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(237, 137, 54, 0.4);
        }

        .game-message {
            background: #4299e1;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            font-weight: 600;
            display: none;
            box-shadow: 0 5px 15px rgba(66, 153, 225, 0.3);
        }

        .game-message.success {
            background: linear-gradient(135deg, #48bb78, #38a169);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.3);
        }

        .game-message.error-msg {
            background: linear-gradient(135deg, #f56565, #e53e3e);
            box-shadow: 0 5px 15px rgba(245, 101, 101, 0.3);
        }

        .game-message.info {
            background: linear-gradient(135deg, #4299e1, #3182ce);
            white-space: pre-line;
            max-height: 400px;
            overflow-y: auto;
        }

        .star-animation {
            color: #ffd700;
            font-size: 2em;
            animation: starPop 0.6s ease-out;
            position: absolute;
            top: -10px;
            right: -10px;
            z-index: 10;
        }

        @keyframes starPop {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.5) rotate(180deg); opacity: 1; }
            100% { transform: scale(1) rotate(360deg); opacity: 1; }
        }

        .correct-placement {
            position: relative;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff6b6b;
            animation: confetti-fall 5s linear infinite;
            z-index: 1000;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .error {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .stars-display {
            font-size: 2em;
            margin: 10px 0;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .game-container {
                padding: 20px;
                margin: 10px;
            }

            h1 {
                font-size: 2em;
            }

            .card {
                width: 100%;
                max-width: 280px;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 200px;
            }

            .game-info {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }

        @media (max-width: 480px) {
            .game-container {
                margin: 5px;
                padding: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            .card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <header class="header">
            <h1>🤖 Timeline IA</h1>
            <p class="subtitle">Découvrez l'histoire de l'Intelligence Artificielle</p>
            
            <div class="controls">
                <button id="new-game-btn" class="btn">🎮 Nouvelle Partie</button>
                <button id="rules-btn" class="btn btn-secondary">📖 Règles</button>
                <button id="reveal-btn" class="btn btn-secondary" disabled>🔍 Révéler Solution</button>
            </div>
        </header>

        <div class="game-info">
            <div class="info-card">
                <div class="info-label">Cartes restantes</div>
                <div class="info-value" id="cards-remaining">4</div>
            </div>
            <div class="info-card">
                <div class="info-label">Score</div>
                <div class="info-value" id="score">0/4</div>
                <div class="stars-display" id="stars">☆☆☆☆</div>
            </div>
            <div class="info-card">
                <div class="info-label">Précision</div>
                <div class="info-value" id="accuracy">0%</div>
            </div>
        </div>

        <div id="game-message" class="game-message"></div>

        <div class="timeline-section">
            <div class="section-title">📅 Timeline - Chronologie de l'IA</div>
            <div id="timeline" class="timeline">
                <p style="color: #666; text-align: center; width: 100%;">La timeline apparaîtra ici</p>
            </div>
        </div>

        <div id="placement-buttons" class="placement-buttons"></div>

        <div class="timeline-section">
            <div class="section-title">🎴 Vos cartes (dates cachées)</div>
            <div id="hand-cards" class="hand-cards"></div>
        </div>
    </div>

    <script>
        const cards = [
            { id: 1, year: 1842, event: "Premier algorithme", detail: "Ada Lovelace - Machine analytique" },
            { id: 2, year: 1920, event: "Terme 'Robot'", detail: "Karel Capek dans R.U.R." },
            { id: 3, year: 1943, event: "Premiers neurones artificiels", detail: "McCulloch et Pitts" },
            { id: 4, year: 1950, event: "Test de Turing", detail: "Alan Turing - Intelligence machine" },
            { id: 5, year: 1956, event: "Naissance de l'IA", detail: "Conférence de Dartmouth" },
            { id: 6, year: 1958, event: "Perceptron", detail: "Frank Rosenblatt - Premier réseau" },
            { id: 7, year: 1961, event: "Premier robot industriel", detail: "Unimate - General Motors" },
            { id: 8, year: 1966, event: "ELIZA", detail: "Joseph Weizenbaum - Premier chatbot" },
            { id: 9, year: 1969, event: "Shakey le robot", detail: "Premier robot mobile intelligent" },
            { id: 10, year: 1972, event: "MYCIN", detail: "Système expert médical" },
            { id: 11, year: 1979, event: "Premier véhicule autonome", detail: "Stanford Cart" },
            { id: 12, year: 1986, event: "Rétropropagation", detail: "Rumelhart - Apprentissage profond" },
            { id: 13, year: 1988, event: "Reconnaissance vocale", detail: "Dragon NaturallySpeaking" },
            { id: 14, year: 1997, event: "Deep Blue bat Kasparov", detail: "IBM - Échecs" },
            { id: 15, year: 2002, event: "Roomba", detail: "iRobot - Robot aspirateur" },
            { id: 16, year: 2005, event: "Stanley DARPA", detail: "Voiture autonome dans le désert" },
            { id: 17, year: 2011, event: "Watson gagne Jeopardy", detail: "IBM bat les champions" },
            { id: 18, year: 2011, event: "Siri", detail: "Apple - Assistant vocal" },
            { id: 19, year: 2012, event: "AlexNet", detail: "CNN révolutionne vision" },
            { id: 20, year: 2014, event: "Alexa", detail: "Amazon Echo" },
            { id: 21, year: 2016, event: "AlphaGo bat le champion", detail: "DeepMind - Jeu de Go" },
            { id: 22, year: 2017, event: "Transformers", detail: "Attention is All You Need" },
            { id: 23, year: 2018, event: "GPT-1", detail: "OpenAI - Génération de texte" },
            { id: 24, year: 2020, event: "GPT-3", detail: "175 milliards de paramètres" },
            { id: 25, year: 2022, event: "ChatGPT", detail: "IA conversationnelle grand public" },
            { id: 26, year: 2023, event: "GPT-4", detail: "IA multimodale" }
        ];

        const gameState = {
            timeline: [],
            playerHand: [],
            selectedCard: null,
            score: 0,
            totalAttempts: 0,
            gameStarted: false,
            allCards: []
        };

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            const shuffledCards = shuffleArray([...cards]);
            gameState.timeline = [shuffledCards[0]];
            gameState.playerHand = shuffledCards.slice(1, 5);
            gameState.allCards = [...gameState.timeline, ...gameState.playerHand];
            gameState.selectedCard = null;
            gameState.score = 0;
            gameState.totalAttempts = 0;
            gameState.gameStarted = true;

            document.getElementById('reveal-btn').disabled = false;
            updateDisplay();
            showMessage("Partie commencée ! Sélectionnez une carte et choisissez où la placer.", "info");
        }

        function createCardElement(card, showDate, isSelectable) {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.dataset.cardId = card.id;

            if (isSelectable) {
                cardEl.onclick = () => selectCard(card);
            }

            const dateText = showDate ? card.year : '????';
            const dateClass = showDate ? '' : 'card-hidden-date';

            cardEl.innerHTML = `
                <div class="card-date ${dateClass}">${dateText}</div>
                <div class="card-event">${card.event}</div>
                <div class="card-detail">${card.detail}</div>
            `;

            return cardEl;
        }

        function selectCard(card) {
            if (!gameState.gameStarted) return;
            
            gameState.selectedCard = card;
            updateHandDisplay();
            showPlacementButtons();
            showMessage("Carte sélectionnée ! Choisissez où la placer dans la timeline.", "info");
        }

        function showPlacementButtons() {
            const buttonsContainer = document.getElementById('placement-buttons');
            buttonsContainer.innerHTML = '';
            buttonsContainer.style.display = 'flex';

            const beforeBtn = document.createElement('button');
            beforeBtn.className = 'placement-btn';
            beforeBtn.textContent = 'Placer au début';
            beforeBtn.onclick = () => placeCard(0);
            buttonsContainer.appendChild(beforeBtn);

            gameState.timeline.forEach((card, index) => {
                const afterBtn = document.createElement('button');
                afterBtn.className = 'placement-btn';
                afterBtn.textContent = `Placer après ${card.year}`;
                afterBtn.onclick = () => placeCard(index + 1);
                buttonsContainer.appendChild(afterBtn);
            });
        }

        function createStar(cardElement) {
            const star = document.createElement('div');
            star.className = 'star-animation';
            star.textContent = '⭐';
            cardElement.style.position = 'relative';
            cardElement.appendChild(star);

            setTimeout(() => {
                if (star.parentNode) {
                    star.remove();
                }
            }, 600);
        }

        function createConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7', '#dda0dd', '#98fb98'];
            const confettiCount = 100;

            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 3 + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 8000);
            }
        }

        function updateStarsDisplay() {
            const starsEl = document.getElementById('stars');
            const filledStars = '★'.repeat(gameState.score);
            const emptyStars = '☆'.repeat(4 - gameState.score);
            starsEl.textContent = filledStars + emptyStars;
        }

        function placeCard(position) {
            if (!gameState.selectedCard) return;

            const card = gameState.selectedCard;
            const correctPosition = findCorrectPosition(card);
            gameState.totalAttempts++;

            if (position === correctPosition) {
                gameState.timeline.splice(position, 0, card);
                gameState.playerHand = gameState.playerHand.filter(c => c.id !== card.id);
                gameState.score++;

                showMessage("Excellent ! Carte bien placée ! ⭐", "success");

                setTimeout(() => {
                    const placedCard = document.querySelector(`[data-card-id="${card.id}"]`);
                    if (placedCard) {
                        placedCard.classList.add('correct-placement');
                        createStar(placedCard);
                    }
                }, 100);

                if (gameState.playerHand.length === 0) {
                    const accuracy = Math.round((gameState.score / gameState.totalAttempts) * 100);
                    showMessage(`🏆 Félicitations ! Vous avez terminé !\nScore: ${gameState.score}/4\nPrécision: ${accuracy}%\n\n🎉 Bravo pour votre connaissance de l'IA !`, "success");
                    gameState.gameStarted = false;
                    document.getElementById('reveal-btn').disabled = true;
                    
                    // Confetti seulement à la fin
                    setTimeout(() => {
                        createConfetti();
                    }, 500);
                }
            } else {
                showMessage(`❌ Incorrect ! Cette invention date de ${card.year}.\nEssayez de la replacer !`, "error-msg");
                const cardEl = document.querySelector(`[data-card-id="${card.id}"]`);
                if (cardEl) {
                    cardEl.classList.add('error');
                    setTimeout(() => cardEl.classList.remove('error'), 500);
                }
            }

            gameState.selectedCard = null;
            document.getElementById('placement-buttons').style.display = 'none';
            updateDisplay();
        }

        function findCorrectPosition(card) {
            for (let i = 0; i <= gameState.timeline.length; i++) {
                if (i === 0 && card.year <= gameState.timeline[0].year) return 0;
                if (i === gameState.timeline.length && card.year >= gameState.timeline[i-1].year) return i;
                if (i > 0 && card.year >= gameState.timeline[i-1].year && card.year <= gameState.timeline[i].year) return i;
            }
            return gameState.timeline.length;
        }

        function updateDisplay() {
            updateTimelineDisplay();
            updateHandDisplay();
            updateGameInfo();
        }

        function updateTimelineDisplay() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = gameState.timeline.length === 0 
                ? '<p style="color: #666; text-align: center; width: 100%;">La timeline apparaîtra ici</p>'
                : gameState.timeline.map(card => {
                    const cardEl = createCardElement(card, true, false);
                    cardEl.classList.add('placed');
                    return cardEl.outerHTML;
                }).join('');
        }

        function updateHandDisplay() {
            const handCards = document.getElementById('hand-cards');
            handCards.innerHTML = '';
            
            gameState.playerHand.forEach(card => {
                const cardEl = createCardElement(card, false, true);
                if (gameState.selectedCard?.id === card.id) {
                    cardEl.classList.add('selected');
                }
                handCards.appendChild(cardEl);
            });
        }

        function updateGameInfo() {
            document.getElementById('cards-remaining').textContent = gameState.playerHand.length;
            document.getElementById('score').textContent = `${gameState.score}/4`;
            updateStarsDisplay();
            const accuracy = gameState.totalAttempts > 0 
                ? Math.round((gameState.score / gameState.totalAttempts) * 100) 
                : 0;
            document.getElementById('accuracy').textContent = `${accuracy}%`;
        }

       function showMessage(message, type) {
            const messageEl = document.getElementById('game-message');
            messageEl.textContent = message;
            messageEl.className = `game-message ${type}`;
            messageEl.style.display = 'block';
            
            // Durées différentes selon le type de message
            let duration;
            switch(type) {
                case 'info':
                    duration = 12000; // 12 secondes pour les infos
                    break;
                case 'error-msg':
                    duration = 8000;  // 8 secondes pour les erreurs (au lieu de 5)
                    break;
                case 'success':
                    duration = 4000;  // 4 secondes pour les succès
                    break;
                default:
                    duration = 5000;  // 5 secondes par défaut
            }
            
            setTimeout(() => messageEl.style.display = 'none', duration);
        }
    

        function showRules() {
            const rulesText = `🎯 RÈGLES DU JEU TIMELINE IA

🎮 OBJECTIF
Placer vos 4 cartes dans l'ordre chronologique correct sur la timeline de l'Intelligence Artificielle

📝 DÉROULEMENT
1. Une carte repère est placée au centre avec sa date visible
2. Vous avez 4 cartes en main (dates cachées)
3. Sélectionnez une carte et choisissez où la placer
4. Si c'est correct : une étoile apparaît ! ⭐
5. Si c'est incorrect : réessayez de placer la même carte

🌟 SYSTÈME DE SCORE
• Une étoile par bonne réponse
• Score de précision calculé
• Confetti final si vous réussissez tout ! 🎉

🔧 FONCTIONNALITÉS
• Bouton "Révéler Solution" pour voir toutes les dates
• Interface responsive (mobile/desktop)
• Animations et effets visuels

🏆 VICTOIRE
Placez toutes vos cartes correctement pour déclencher la célébration finale !

💡 ASTUCE
Utilisez vos connaissances en histoire de l'IA et de l'informatique !
De Ada Lovelace (1842) à GPT-4 (2023), chaque innovation a sa place...`;
                
            showMessage(rulesText, "info");
        }

        // Event Listeners
        document.getElementById('new-game-btn').addEventListener('click', startGame);
        document.getElementById('rules-btn').addEventListener('click', showRules);
        document.getElementById('reveal-btn').addEventListener('click', () => {
            const sortedCards = [...gameState.allCards].sort((a, b) => a.year - b.year);
            const solutionText = sortedCards.map((card, i) => 
                `${i+1}. ${card.year} - ${card.event} ${
                    gameState.timeline.some(c => c.id === card.id) ? '✅' : 
                    gameState.playerHand.some(c => c.id === card.id) ? '🔄' : ''
                }`
            ).join('\n') + '\n\n✅ = Déjà placé correctement\n🔄 = Dans votre main';
            
            showMessage(`🔍 SOLUTION COMPLÈTE :\n\n${solutionText}`, "info");
        });

        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            startGame();
        });
    </script>
</body>
</html>
