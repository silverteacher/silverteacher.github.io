<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission IA Établissement 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1.727434032773e12-af3cd98375ba?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=2832') center/cover fixed;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .header {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .timer {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 1.3em;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .timer-label {
            opacity: 0.9;
        }

        .timer-value {
            background: rgba(255,255,255,0.3);
            padding: 8px 20px;
            border-radius: 8px;
            min-width: 80px;
            text-align: center;
        }

        .content {
            padding: 40px;
        }

        .score-board {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            box-shadow: 0 10px 30px rgba(74, 85, 104, 0.3);
        }

        .score-item {
            flex: 1;
        }

        .score-item .label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .score-item .value {
            font-size: 2em;
            font-weight: bold;
        }

        .question-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-card h2 {
            color: #2d3748;
            margin-bottom: 20px;
            font-size: 1.4em;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            background: #f7fafc;
            border: 2px solid #cbd5e0;
            padding: 18px 25px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 1em;
            font-weight: 500;
            color: #2d3748;
            position: relative;
            overflow: hidden;
        }

        .choice-btn:hover {
            transform: translateX(10px);
            border-color: #4a5568;
            background: #edf2f7;
            box-shadow: 0 4px 12px rgba(74, 85, 104, 0.15);
        }

        .choice-btn.correct {
            background: #c6f6d5;
            border-color: #38a169;
            animation: correctPulse 0.6s ease;
        }

        .choice-btn.incorrect {
            background: #fed7d7;
            border-color: #e53e3e;
            animation: shake 0.5s ease;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .feedback.correct {
            background: #c6f6d5;
            color: #22543d;
            border: 2px solid #38a169;
        }

        .feedback.incorrect {
            background: #fed7d7;
            color: #742a2a;
            border: 2px solid #e53e3e;
        }

        .next-btn {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(74, 85, 104, 0.3);
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 85, 104, 0.4);
        }

        .incident-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
            padding: 20px;
        }

        .incident-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
            animation: slideUp 0.5s ease;
            border-top: 8px solid #e53e3e;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .incident-card h2 {
            color: #e53e3e;
            margin-bottom: 25px;
            font-size: 1.8em;
            text-align: center;
        }

        .incident-card .incident-description {
            background: #fef5e7;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border-left: 5px solid #d69e2e;
            font-size: 1.1em;
            line-height: 1.6;
            color: #744210;
        }

        .incident-card .incident-question {
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 20px;
            font-size: 1.2em;
            padding: 15px;
            background: #edf2f7;
            border-radius: 10px;
        }

        .exchange-section {
            background: #e6f7ff;
            padding: 30px;
            border-radius: 15px;
            margin: 30px 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border: 2px solid #91caff;
        }

        .exchange-section h3 {
            color: #003a70;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .exchange-section p {
            color: #0050b3;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .exchange-section ul {
            text-align: left;
            margin: 20px 0;
            padding-left: 25px;
        }

        .exchange-section li {
            margin: 12px 0;
            line-height: 1.7;
            font-size: 1.05em;
            color: #002c8c;
        }

        .final-score {
            text-align: center;
            padding: 40px;
        }

        .final-score h2 {
            font-size: 2.5em;
            color: #4a5568;
            margin-bottom: 30px;
        }

        .final-score .score-display {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            color: white;
            padding: 40px;
            border-radius: 20px;
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(74, 85, 104, 0.3);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }

            .score-board {
                flex-direction: column;
                gap: 15px;
            }

            .header h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Mission IA Établissement 2025</h1>
            <p>Quiz interactif avec incidents critiques</p>
            <div class="timer">
                <span class="timer-label">⏱️ Temps restant:</span>
                <span class="timer-value" id="timerDisplay">20:00</span>
            </div>
        </div>

        <div class="content">
            <div class="score-board">
                <div class="score-item">
                    <div class="label">📊 Score</div>
                    <div class="value" id="scoreDisplay">0</div>
                </div>
                <div class="score-item">
                    <div class="label">✅ Bonnes réponses</div>
                    <div class="value" id="correctDisplay">0</div>
                </div>
                <div class="score-item">
                    <div class="label">❌ Erreurs</div>
                    <div class="value" id="incorrectDisplay">0</div>
                </div>
                <div class="score-item">
                    <div class="label">📝 Question</div>
                    <div class="value"><span id="currentDisplay">0</span>/<span id="totalDisplay">20</span></div>
                </div>
            </div>

            <div id="quizContainer"></div>
        </div>
    </div>

    <script>
        const questions = [
            {question: 'Quelle est la première règle d\'or du cadre d\'usage de l\'IA en établissement?', choices: ['Toujours utiliser l\'IA pour gagner du temps', 'Jamais de données personnelles dans les IA grand public', 'Former tous les élèves dès le CP', 'Utiliser uniquement ChatGPT'], correct: 1, points: 10, livret: 'Livret de mission - Protection des données'},
            {question: 'À partir de quel niveau les élèves peuvent-ils manipuler des IA génératives de manière encadrée?', choices: ['CP', '6ème', '4ème', 'Terminale'], correct: 2, points: 10, livret: 'Livret de mission - Usage pédagogique selon les niveaux'},
            {question: 'Que doit faire un enseignant qui utilise l\'IA pour préparer un support de cours?', choices: ['Le distribuer directement aux élèves', 'Signaler systématiquement l\'utilisation de l\'IA et vérifier le contenu', 'Ne rien dire pour garder le secret professionnel', 'Demander l\'autorisation au rectorat'], correct: 1, points: 10, livret: 'Livret de mission - Transparence et responsabilité'},
            {question: 'Pourquoi les détecteurs de contenu IA sont-ils déconseillés pour sanctionner les élèves?', choices: ['Ils sont trop chers', 'Ils ont un taux d\'erreur élevé avec de nombreux faux positifs', 'Ils sont interdits par la loi', 'Ils fonctionnent trop lentement'], correct: 1, points: 10, livret: 'Livret de mission - Devoirs et évaluation'},
            {question: 'Quelle est la consommation énergétique d\'une requête IA par rapport à une recherche web classique?', choices: ['Identique', '2 fois plus', '10 fois plus', '100 fois plus'], correct: 2, points: 10, livret: 'Livret de mission - Impact environnemental'},
            {question: 'Un enseignant peut-il demander à ses élèves de 4ème de créer un compte ChatGPT personnel?', choices: ['Oui, sans restriction', 'Oui, avec accord parental', 'Non, c\'est interdit (CGU imposent 13 ans minimum avec accord parental vérifiable)', 'Oui, si c\'est pour un projet pédagogique'], correct: 2, points: 10, livret: 'Livret de mission - Protection des mineurs'},
            {question: 'Que doit faire un CPE qui utilise ChatGPT pour rédiger une charte de vie scolaire?', choices: ['Le diffuser immédiatement', 'Vérifier, adapter, valider avec l\'équipe et mentionner l\'usage de l\'IA', 'Le garder secret', 'Demander à l\'IA de le vérifier'], correct: 1, points: 10, livret: 'Livret de mission - Transparence et responsabilité'},
            {question: 'Dans quel cas l\'usage de l\'IA est-il justifié selon le principe de frugalité?', choices: ['Pour chercher une définition simple', 'Pour créer 20 exercices différenciés sur 3 niveaux', 'Pour toutes les tâches quotidiennes', 'Jamais'], correct: 1, points: 10, livret: 'Livret de mission - Principe de frugalité'},
            {question: 'Que risque un établissement qui utilise ChatGPT pour prendre des décisions d\'orientation automatiques?', choices: ['Rien du tout', 'Une amende mineure', 'Violation du RGPD et responsabilité juridique', 'Des félicitations pour l\'innovation'], correct: 2, points: 10, livret: 'Livret de mission - Responsabilité juridique'},
            {question: 'Comment un enseignant de SVT doit-il utiliser ChatGPT pour préparer un cours sur la photosynthèse?', choices: ['Projeter directement la réponse de l\'IA sans vérification', 'Générer, vérifier avec manuels et ressources scientifiques, corriger, puis mentionner l\'usage', 'Ne jamais utiliser l\'IA en SVT', 'Demander aux élèves de vérifier'], correct: 1, points: 10, livret: 'Livret de mission - Vérification des contenus'},
            {question: 'Quel est l\'âge minimum requis par les CGU de ChatGPT?', choices: ['10 ans', '13 ans (avec consentement parental jusqu\'à 18 ans)', '16 ans', '18 ans'], correct: 1, points: 10, livret: 'Livret de mission - Protection des mineurs'},
            {question: 'Un chef d\'établissement peut-il utiliser l\'IA pour traduire des documents pour familles allophones?', choices: ['Non, c\'est interdit', 'Oui, si le document ne contient pas de données sensibles et est vérifié', 'Oui, sans restriction', 'Seulement avec Google Translate'], correct: 1, points: 10, livret: 'Livret de mission - Usage professionnel'},
            {question: 'Quelle est la bonne pratique si un élève est suspecté d\'avoir utilisé l\'IA pour un devoir?', choices: ['Le sanctionner immédiatement avec un 0/20', 'Utiliser un détecteur d\'IA comme preuve', 'Organiser un entretien pédagogique et une évaluation orale complémentaire', 'L\'exclure de l\'établissement'], correct: 2, points: 10, livret: 'Livret de mission - Devoirs et évaluation'},
            {question: 'Dans quel contexte un enseignant peut-il copier-coller des copies d\'élèves dans ChatGPT?', choices: ['Pour gagner du temps dans les corrections', 'Si les parents sont d\'accord', 'Jamais - c\'est une violation grave du RGPD', 'Uniquement pendant les vacances'], correct: 2, points: 10, livret: 'Livret de mission - Protection des données'},
            {question: 'Que doit faire un établissement qui découvre qu\'une charte rédigée par IA contient des erreurs juridiques?', choices: ['Minimiser l\'erreur', 'Retirer immédiatement, vérifier avec expert, corriger et re-présenter au CA', 'Accuser ChatGPT publiquement', 'Modifier discrètement'], correct: 1, points: 10, livret: 'Livret de mission - Responsabilité et vérification'},
            {question: 'À quelle fréquence la formation à l\'IA doit-elle être renouvelée?', choices: ['Une fois suffit', 'Tous les 5 ans', 'En continu car évolution constante', 'Jamais'], correct: 2, points: 10, livret: 'Livret de mission - Formation continue'},
            {question: 'Quelle plateforme est recommandée pour la formation obligatoire aux IA en 4ème?', choices: ['ChatGPT', 'Pix', 'Facebook', 'TikTok'], correct: 1, points: 10, livret: 'Livret de mission - Formation Pix IA'},
            {question: 'Un enseignant spécialisé ULIS peut-il utiliser l\'IA pour adapter un texte en FALC?', choices: ['Non, c\'est interdit', 'Oui, s\'il vérifie et ajuste selon les besoins spécifiques de ses élèves', 'Oui, sans vérification', 'Uniquement avec autorisation médicale'], correct: 1, points: 10, livret: 'Livret de mission - Adaptation pédagogique'},
            {question: 'Que doit faire un CPE qui découvre que des élèves utilisent ChatGPT comme confident psychologique?', choices: ['Les féliciter pour leur autonomie', 'Alerter sur les risques et orienter vers professionnels (infirmière, psy EN, AS)', 'Ne rien faire', 'Consulter leurs conversations'], correct: 1, points: 10, livret: 'Livret de mission - Risques psychologiques'},
            {question: 'Quelle est la meilleure approche pour une dissertation à la maison à l\'ère de l\'IA?', choices: ['Interdire l\'IA sans adapter l\'exercice', 'Autoriser l\'IA pour la recherche, demander un journal de bord et évaluer principalement à l\'oral', 'Faire confiance aux élèves', 'Utiliser un détecteur d\'IA'], correct: 1, points: 10, livret: 'Livret de mission - Adaptation des évaluations'}
        ];

        const discussions = [
            {
                after: 6,
                title: '💬 Temps d\'échange - L\'IA et les élèves',
                content: '<p><strong>Prenez 2 minutes pour échanger avec le groupe:</strong></p><ul><li>Comment sensibilisez-vous vos élèves à un usage critique et responsable de l\'IA?</li><li>Quelles activités pédagogiques avez-vous mises en place pour former les élèves?</li><li>Comment gérez-vous les cas d\'élèves utilisant l\'IA pour leurs devoirs?</li><li>Quelles ressources éducatives partagez-vous avec vos élèves sur l\'IA?</li></ul>'
            },
            {
                after: 12,
                title: '💬 Temps d\'échange - Gouvernance IA dans l\'établissement',
                content: '<p><strong>Prenez 2 minutes pour échanger avec le groupe:</strong></p><ul><li>Avez-vous élaboré une charte d\'usage de l\'IA dans votre établissement?</li><li>Comment organisez-vous la formation des équipes éducatives?</li><li>Qui est le référent IA dans votre structure? Quel est son rôle concret?</li><li>Comment impliquez-vous les parents et les élèves dans cette démarche?</li></ul>'
            }
        ];

        const incidents = [
            {
                title: '📚 BON USAGE - Enseignante de français créative',
                description: 'Marie, enseignante de français en 3ème, souhaite créer une grille d\'évaluation pour une rédaction argumentative sur les réseaux sociaux. Elle hésite entre copier-coller la copie de Lucas (avec son nom) pour obtenir une correction personnalisée, ou demander une grille générique à ChatGPT.',
                question: 'Quelle approche Marie doit-elle adopter?',
                choices: [
                    'Copier-coller la copie de Lucas avec son nom - c\'est plus efficace',
                    'Demander à ChatGPT: "Crée une grille d\'évaluation pour un texte argumentatif niveau 3e sur les réseaux sociaux avec critères de cohérence, argumentation et expression écrite"',
                    'Ne pas utiliser l\'IA du tout',
                    'Demander aux élèves de créer eux-mêmes la grille avec ChatGPT'
                ],
                correct: 1,
                points: 40,
                justification: '✅ Livret de mission - Protection des données: Marie adopte la BONNE pratique. Elle utilise ChatGPT avec des données génériques (niveau, type de texte, compétences) sans aucune donnée personnelle d\'élève. C\'est l\'exemple concret recommandé dans le livret pour un usage conforme et efficace de l\'IA.'
            },
            {
                title: '⚠️ MAUVAIS USAGE - CPE et document non vérifié',
                description: 'Thomas, CPE, a rédigé un projet de charte de vie scolaire avec ChatGPT. Il trouve le texte parfait et s\'apprête à le distribuer directement aux élèves et familles sans validation ni mention de l\'outil utilisé.',
                question: 'Que devrait faire Thomas?',
                choices: [
                    'Distribuer le texte immédiatement - il a l\'air bien rédigé',
                    'Demander à ChatGPT de vérifier lui-même le document',
                    'Ajouter en bas: "Document élaboré avec ChatGPT, revu et validé par l\'équipe de vie scolaire et présenté au CA" après vérification',
                    'Garder secret l\'usage de l\'IA'
                ],
                correct: 2,
                points: 45,
                justification: '❌ Livret de mission - Transparence: Thomas fait une ERREUR. Il doit obligatoirement: 1) Mentionner l\'usage de l\'IA 2) Faire vérifier et adapter par l\'équipe 3) Valider en CA. Distribuer un document généré par IA sans validation ni transparence viole le principe de responsabilité.'
            },
            {
                title: '🔴 INCIDENT CRITIQUE - Enseignant SVT et comptes mineurs',
                description: 'Vous êtes chef d\'établissement. Un enseignant de SVT a imposé à ses 28 élèves de 4ème (13-14 ans) de créer un compte ChatGPT individuel pour faire des "recherches personnalisées" sur l\'environnement. Les élèves ont fourni emails et données personnelles. Cinq parents furieux vous contactent.',
                question: 'Quelle action d\'urgence menez-vous?',
                choices: [
                    'Laisser faire - c\'est une décision pédagogique de l\'enseignant',
                    'Rassurer les parents: "C\'est pour le bien de leurs enfants"',
                    'Faire stopper immédiatement, informer que les CGU imposent 13 ans avec accord parental vérifiable, proposer alternative conforme (projection collective ou outil académique)',
                    'Attendre de voir si ça pose vraiment problème'
                ],
                correct: 2,
                points: 50,
                justification: '🔴 Livret de mission - Protection mineurs: C\'est STRICTEMENT INTERDIT sans accord parental explicite et vérifiable. Les CGU de ChatGPT imposent 13 ans minimum avec consentement parental jusqu\'à 18 ans. Violation du RGPD et protection des mineurs. Action immédiate obligatoire: arrêt, information direction, alternative conforme.'
            },
            {
                title: '✅ BON USAGE - Professeure d\'histoire et évaluation adaptée',
                description: 'Léa, enseignante d\'histoire-géo en Terminale, donne une dissertation sur Camus. Elle sait que les élèves peuvent utiliser l\'IA. Elle hésite entre simplement interdire l\'IA, ou autoriser l\'IA pour le plan à condition que les élèves reformulent, ajoutent leurs analyses personnelles et citent leurs sources.',
                question: 'Quelle approche Léa doit-elle privilégier?',
                choices: [
                    'Interdire totalement l\'IA sans adaptation',
                    'Laisser faire sans cadre - ils sont autonomes',
                    'Autoriser l\'IA pour générer un plan, exiger reformulation complète, analyses personnelles et citations de sources vérifiées',
                    'Utiliser un détecteur d\'IA pour surveiller'
                ],
                correct: 2,
                points: 40,
                justification: '✅ Livret de mission - Usage lycée et évaluation: Léa adopte la BONNE pratique pour le lycée. Elle définit un cadre explicite, autorise l\'IA pour une phase précise (plan), exige appropriation et travail personnel. C\'est l\'exemple concret recommandé dans le livret pour adapter les évaluations.'
            },
            {
                title: '🌍 BON USAGE - Chef d\'établissement et frugalité',
                description: 'Ahmed, chef d\'établissement, doit faire une synthèse d\'une réunion de direction de 2h30. Il hésite entre: 1) Utiliser un outil de transcription automatique puis demander à l\'IA de structurer les idées qu\'il vérifiera et complétera (sans données élèves identifiables), ou 2) Tout taper manuellement.',
                question: 'Quelle approche est conforme au principe de frugalité et d\'usage justifié?',
                choices: [
                    'Tout taper manuellement - ne jamais utiliser l\'IA',
                    'Utiliser la transcription automatique + IA pour structurer, puis vérifier et adapter (sans données sensibles)',
                    'Demander à l\'IA de tout faire automatiquement',
                    'Utiliser ChatGPT même avec des échanges sur situations individuelles d\'élèves'
                ],
                correct: 1,
                points: 45,
                justification: '✅ Livret de mission - Frugalité et usage professionnel: Ahmed fait un BON usage. Il y a une vraie plus-value (gain de temps important sur tâche administrative répétitive), il supervise humainement, vérifie et n\'inclut pas de données sensibles. C\'est l\'exemple concret recommandé pour les chefs d\'établissement.'
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let answered = false;
        let timeRemaining = 1200;
        let timerInterval;
        let incidentShown = [false, false, false, false, false];
        let discussionShown = [false, false];

        const quizContainer = document.getElementById('quizContainer');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const correctDisplay = document.getElementById('correctDisplay');
        const incorrectDisplay = document.getElementById('incorrectDisplay');
        const currentDisplay = document.getElementById('currentDisplay');
        const totalDisplay = document.getElementById('totalDisplay');
        const timerDisplay = document.getElementById('timerDisplay');

        totalDisplay.textContent = questions.length;

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    endQuiz();
                }
            }, 1000);
        }

        function showIncident(incidentIndex) {
            const incident = incidents[incidentIndex];
            incidentShown[incidentIndex] = true;

            const overlay = document.createElement('div');
            overlay.className = 'incident-overlay';
            overlay.innerHTML = `
                <div class="incident-card">
                    <h2>${incident.title}</h2>
                    <div class="incident-description">
                        ${incident.description}
                    </div>
                    <div class="incident-question">
                        ❓ ${incident.question}
                    </div>
                    <div class="choices">
                        ${incident.choices.map((choice, index) => `
                            <button class="choice-btn incident-choice" data-index="${index}">
                                ${choice}
                            </button>
                        `).join('')}
                    </div>
                    <div id="incidentFeedback"></div>
                </div>
            `;
            document.body.appendChild(overlay);

            const choiceButtons = overlay.querySelectorAll('.incident-choice');
            choiceButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const chosenIndex = parseInt(this.getAttribute('data-index'));
                    handleIncidentChoice(chosenIndex, incident.correct, incident.points, incident.justification, this);
                });
            });
        }

        function handleIncidentChoice(chosen, correct, points, justification, button) {
            const buttons = button.parentElement.querySelectorAll('.choice-btn');
            buttons.forEach((btn, index) => {
                btn.disabled = true;
                if (index === correct) {
                    btn.classList.add('correct');
                } else if (btn === button && chosen !== correct) {
                    btn.classList.add('incorrect');
                }
            });

            const feedbackDiv = document.getElementById('incidentFeedback');
            if (chosen === correct) {
                score += points;
                correctCount++;
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">
                        <h3>✅ Excellente décision!</h3>
                        <p><strong>+${points} points</strong></p>
                        <p>${justification}</p>
                        <button class="next-btn" id="continueBtn">Continuer le quiz</button>
                    </div>
                `;
            } else {
                incorrectCount++;
                feedbackDiv.innerHTML = `
                    <div class="feedback incorrect">
                        <h3>❌ Attention - Décision non conforme</h3>
                        <p><strong>0 point</strong></p>
                        <p>${justification}</p>
                        <button class="next-btn" id="continueBtn">Continuer le quiz</button>
                    </div>
                `;
            }

            document.getElementById('continueBtn').addEventListener('click', function() {
                const overlay = document.querySelector('.incident-overlay');
                if (overlay) {
                    overlay.remove();
                }
                showQuestion();
            });
            updateScoreBoard();
        }

        function showDiscussion(discussionIndex) {
            const disc = discussions[discussionIndex];
            discussionShown[discussionIndex] = true;

            const exchangeDiv = document.createElement('div');
            exchangeDiv.className = 'exchange-section';
            exchangeDiv.innerHTML = `
                <h3>${disc.title}</h3>
                ${disc.content}
                <button class="next-btn" id="exchangeBtn">Continuer</button>
            `;
            quizContainer.innerHTML = '';
            quizContainer.appendChild(exchangeDiv);

            document.getElementById('exchangeBtn').addEventListener('click', function() {
                showQuestion();
            });
        }

        function showQuestion() {
            if (currentQuestion >= questions.length) {
                endQuiz();
                return;
            }

            // Vérifier d'abord les discussions (après Q6 et Q12)
            if (currentQuestion === 6 && !discussionShown[0]) {
                showDiscussion(0);
                return;
            }
            if (currentQuestion === 12 && !discussionShown[1]) {
                showDiscussion(1);
                return;
            }

            // Puis vérifier les incidents (après Q3, Q6, Q9, Q12, Q15)
            if (currentQuestion === 3 && !incidentShown[0]) {
                showIncident(0);
                return;
            }
            if (currentQuestion === 6 && !incidentShown[1] && discussionShown[0]) {
                showIncident(1);
                return;
            }
            if (currentQuestion === 9 && !incidentShown[2]) {
                showIncident(2);
                return;
            }
            if (currentQuestion === 12 && !incidentShown[3] && discussionShown[1]) {
                showIncident(3);
                return;
            }
            if (currentQuestion === 15 && !incidentShown[4]) {
                showIncident(4);
                return;
            }

            answered = false;
            const q = questions[currentQuestion];
            currentDisplay.textContent = currentQuestion + 1;

            const questionCard = document.createElement('div');
            questionCard.className = 'question-card';
            questionCard.innerHTML = `
                <h2>Question ${currentQuestion + 1}: ${q.question}</h2>
                <div class="choices">
                    ${q.choices.map((choice, index) => `
                        <button class="choice-btn" onclick="checkAnswer(${index})" id="choice${index}">
                            ${choice}
                        </button>
                    `).join('')}
                </div>
                <div id="feedback"></div>
            `;

            quizContainer.innerHTML = '';
            quizContainer.appendChild(questionCard);
        }

        function checkAnswer(chosen) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.choice-btn');

            buttons.forEach((btn, index) => {
                btn.disabled = true;
                if (index === q.correct) {
                    btn.classList.add('correct');
                } else if (index === chosen) {
                    btn.classList.add('incorrect');
                }
            });

            const feedbackDiv = document.getElementById('feedback');
            if (chosen === q.correct) {
                score += q.points;
                correctCount++;
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">
                        <h3>✅ Bravo! Bonne réponse</h3>
                        <p><strong>+${q.points} points</strong></p>
                        <p><em>${q.livret}</em></p>
                        <button class="next-btn" onclick="nextQuestion()">Question suivante</button>
                    </div>
                `;
            } else {
                incorrectCount++;
                feedbackDiv.innerHTML = `
                    <div class="feedback incorrect">
                        <h3>❌ Incorrect</h3>
                        <p>La bonne réponse était: <strong>${q.choices[q.correct]}</strong></p>
                        <p><em>${q.livret}</em></p>
                        <button class="next-btn" onclick="nextQuestion()">Question suivante</button>
                    </div>
                `;
            }

            updateScoreBoard();
        }

        function nextQuestion() {
            currentQuestion++;
            showQuestion();
        }

        function updateScoreBoard() {
            scoreDisplay.textContent = score;
            correctDisplay.textContent = correctCount;
            incorrectDisplay.textContent = incorrectCount;
        }

        function endQuiz() {
            clearInterval(timerInterval);
            const totalPossible = questions.reduce((sum, q) => sum + q.points, 0) + incidents.reduce((sum, i) => sum + i.points, 0);
            const percentage = Math.round((score / totalPossible) * 100);

            let message = '';
            let emoji = '';
            if (percentage >= 90) {
                message = 'Expert certifié! Vous maîtrisez parfaitement le cadre d\'usage de l\'IA en établissement.';
                emoji = '🏆';
            } else if (percentage >= 75) {
                message = 'Très bon niveau! Vous avez une excellente compréhension des bonnes pratiques.';
                emoji = '⭐';
            } else if (percentage >= 60) {
                message = 'Bon niveau! Continuez à vous former sur les usages responsables de l\'IA.';
                emoji = '👍';
            } else {
                message = 'Niveau à améliorer. Nous vous recommandons de suivre une formation complémentaire.';
                emoji = '📚';
            }

            quizContainer.innerHTML = `
                <div class="final-score">
                    <h2>${emoji} Quiz terminé!</h2>
                    <div class="score-display">
                        ${score} / ${totalPossible} points
                        <div style="font-size: 0.5em; margin-top: 10px;">${percentage}%</div>
                    </div>
                    <div class="feedback correct" style="margin: 20px 0;">
                        <h3>${message}</h3>
                        <p><strong>Bonnes réponses:</strong> ${correctCount}</p>
                        <p><strong>Erreurs:</strong> ${incorrectCount}</p>
                    </div>
                    <button class="next-btn" onclick="location.reload()">Recommencer le quiz</button>
                </div>
            `;
        }

        startTimer();
        showQuestion();
    </script>
</body>
</html>
