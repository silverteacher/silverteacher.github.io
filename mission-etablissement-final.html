<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission IA Établissement 2025</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1.727434032773e+12-af3cd98375ba?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=2832') center/cover fixed;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2em; margin-bottom: 10px; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .timer { background: rgba(255,255,255,0.2); padding: 15px; border-radius: 10px; margin-top: 20px; font-size: 1.5em; font-weight: bold; transition: all 0.3s; }
        .timer.warning { background: #ff6b6b; animation: shake 0.5s infinite; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .question-timer { background: #ff6b6b; color: white; padding: 10px 20px; border-radius: 50px; font-size: 1.2em; font-weight: bold; display: inline-block; margin: 10px 0; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; padding: 20px; background: rgba(102, 126, 234, 0.1); }
        .stat { text-align: center; padding: 15px; background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .stat-label { font-size: 0.9em; color: #666; margin-bottom: 5px; }
        .stat-value { font-size: 2em; font-weight: bold; color: #667eea; }
        .content { padding: 30px; }
        .role-badge { display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 8px 20px; border-radius: 50px; font-size: 0.9em; font-weight: bold; margin-bottom: 15px; }
        .question { font-size: 1.3em; font-weight: 600; margin-bottom: 25px; color: #2c3e50; line-height: 1.6; }
        .choices { display: grid; gap: 15px; margin: 20px 0; }
        .choice {
            padding: 18px 25px;
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.05em;
            line-height: 1.5;
        }
        .choice:hover { transform: translateX(8px); border-color: #667eea; box-shadow: 0 5px 20px rgba(102,126,234,0.3); }
        .choice.selected { background: #667eea; color: white; border-color: #667eea; transform: translateX(8px); }
        .choice.correct { background: #4CAF50; color: white; border-color: #4CAF50; animation: correctPulse 0.5s; }
        .choice.incorrect { background: #f44336; color: white; border-color: #f44336; animation: shake 0.5s; }
        @keyframes correctPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .feedback {
            margin-top: 25px;
            padding: 25px;
            border-radius: 15px;
            font-size: 1.1em;
            line-height: 1.8;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .feedback.correct { background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%); border-left: 5px solid #4CAF50; color: #155724; }
        .feedback.incorrect { background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%); border-left: 5px solid #f44336; color: #721c24; }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(102,126,234,0.6); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; opacity: 0.6; }
        .hidden { display: none !important; }
        .welcome-screen { text-align: center; padding: 30px; }
        .welcome-screen h2 { color: #667eea; font-size: 2.5em; margin-bottom: 25px; }
        .welcome-screen p { font-size: 1.2em; line-height: 1.9; margin-bottom: 20px; color: #555; }
        .welcome-screen ul { text-align: left; max-width: 700px; margin: 25px auto; font-size: 1.15em; line-height: 2.2; }
        .welcome-screen li { margin-bottom: 15px; }
        .incident-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s;
            overflow-y: auto;
            padding: 20px;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .incident-overlay.show { display: flex; }
        .incident-popup {
            background: white;
            border-radius: 25px;
            padding: 45px;
            max-width: 750px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 70px rgba(0,0,0,0.6);
            animation: incidentPop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            margin: auto;
        }
        @keyframes incidentPop { from { transform: scale(0.7) rotate(-10deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
        .incident-popup h3 { color: #dc3545; font-size: 2.2em; margin-bottom: 25px; text-align: center; animation: pulse 1s infinite; }
        .incident-popup .description {
            background: #fff3cd;
            border-left: 6px solid #ffc107;
            padding: 25px;
            margin-bottom: 25px;
            font-size: 1.15em;
            line-height: 1.8;
            border-radius: 10px;
        }
        .incident-popup .question { font-size: 1.4em; font-weight: 600; margin-bottom: 25px; color: #2c3e50; }
        .completion-screen { text-align: center; padding: 50px 30px; }
        .completion-screen h2 { color: #4CAF50; font-size: 3em; margin-bottom: 30px; animation: pulse 2s infinite; }
        .final-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }
        .final-stat {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(102,126,234,0.4);
        }
        .final-stat-label { font-size: 1.1em; opacity: 0.95; margin-bottom: 15px; }
        .final-stat-value { font-size: 3em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Mission IA Établissement 2025</h1>
            <p style="font-size:1.1em">Formation interactive basée sur le Livret de Missions IA</p>
            <p style="font-size:0.95em;margin-top:10px;opacity:0.9">⚠️ Attention: Des incidents critiques peuvent survenir à tout moment!</p>
            <div class="timer" id="timer">⏱️ 30:00</div>
        </div>
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="scoreDisplay">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Question</div>
                <div class="stat-value" id="questionDisplay">0/15</div>
            </div>
            <div class="stat">
                <div class="stat-label">Incidents</div>
                <div class="stat-value" id="incidentDisplay">0</div>
            </div>
        </div>
        <div class="content" id="mainContent"></div>
    </div>
    <div class="incident-overlay" id="incidentOverlay">
        <div class="incident-popup" id="incidentPopup"></div>
    </div>
    <audio id="alertSound" src="data:audio/wav;base64,UklGRhYAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" preload="auto"></audio>
    <audio id="successSound" src="data:audio/wav;base64,UklGRhYAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" preload="auto"></audio>
    <script>
        const questions=[
            {role:'enseignant',question:'Vous êtes enseignant de français en 3ème et préparez une séquence sur l\'argumentation. Vous souhaitez utiliser ChatGPT pour créer une grille d\'évaluation. Quelle approche respecte le RGPD?',choices:['Copier copie de Lucas avec nom pour correction perso','Demander: "Crée une grille pour texte argumentatif 3ème avec critères cohérence et expression"','Créer compte ChatGPT pour chaque élève','Envoyer toutes copies avec noms'],correct:1,points:25,justification:'Livret Mission 1 : Protection des données. Seule la réponse 2 respecte le RGPD: critères génériques sans données élève. Les autres violent le RGPD en transmettant données nominatives.'},
            {role:'enseignant',question:'Vous enseignez les mathématiques en 6ème et créez des exercices différenciés sur les fractions pour 3 niveaux. Comment utiliser l\'IA de manière appropriée?',choices:['Copier liste élèves avec niveau dans ChatGPT','Demander aux élèves de créer un compte Mistral','Envoyer évaluations avec noms et notes','Mistral: "Crée 5 versions fractions: facile à difficile"'],correct:3,points:25,justification:'Livret Mission 1. Seule la réponse 4 est conforme. IA assistant avec niveaux génériques, attribution manuelle. Les autres violent le RGPD ou obligent des mineurs à créer des comptes.'},
            {role:'enseignant',question:'Un élève de 1ère remet un excellent devoir de philosophie. Le style est inhabituel, vous soupçonnez l\'utilisation de ChatGPT. Comment gérer cette situation professionnellement?',choices:['Utiliser un détecteur IA immédiatement, zéro si >80%','Utiliser plusieurs détecteurs et croiser les résultats','Confisquer les appareils et exiger une preuve','Organiser un entretien pédagogique, évaluation orale, analyser le style'],correct:3,points:30,justification:'Livret Mission 4 : Devoirs et évaluation. Les détecteurs sont peu fiables avec de nombreux faux positifs. Ne jamais sanctionner uniquement sur cette base. Bonne pratique: entretien individuel, évaluation orale, analyse du style.'},
            {role:'enseignant',question:'Vous préparez un cours de SVT sur l\'impact environnemental du numérique pour une classe de 2nde. Quelle ressource serait inappropriée selon le cadre du MEN?',choices:['Comparia pour mesurer l\'empreinte carbone','Impact écologique serveurs et datacenters','Comparaison empreinte requête IA vs recherche Google','"L\'IA est 100% virtuelle donc écologique"'],correct:3,points:25,justification:'Livret Mission 2 : Éduquer. Affirmer que l\'IA est écologique car virtuelle est faux et dangereux. Ignore consommation énergétique massive serveurs, datacenters, refroidissement.'},
            {role:'cpe',question:'Vous êtes CPE. 15 élèves de 3ème utilisent ChatGPT comme "confident" pour problèmes personnels, harcèlement, anxiété. Parents inquiets. Quelle intervention?',choices:['Féliciter initiative élèves autonomie émotionnelle','Ne rien faire, vie privée élèves','Alerter sur risques, orienter vers infirmière, psy EN, AS','Demander accès conversations pour évaluer gravité'],correct:2,points:30,justification:'Livret Mission 1 : Risque psychologique majeur. ChatGPT n\'a aucune formation, collecte données sensibles, peut donner conseils dangereux. Orienter vers professionnels: infirmière, psychologue EN, assistante sociale.'},
            {role:'cpe',question:'Enseignant impose aux élèves de 4ème (13-14 ans) de créer un compte ChatGPT pour faire des recherches. 28 élèves concernés. Parents vous contactent inquiets. Quelle action?',choices:['Laisser faire, décision pédagogique enseignant','Rassurer parents, surveiller usage','Attendre plainte formelle parents','Informer chef établissement, faire stopper, proposer alternative conforme'],correct:3,points:30,justification:'Livret Mission 1 : Strictement interdit. Violation RGPD, CGU ChatGPT imposent 18 ans, protection mineurs. Action immédiate: informer direction, stopper la pratique, alternative projection collective ou outils académiques.'},
            {role:'direction',question:'Vous êtes chef d\'établissement. Enseignant de mathématiques a copié 20 copies de 4ème avec noms, notes dans ChatGPT pour analyse. Données sur serveurs US. Parents menacent CNIL. Réaction?',choices:['Minimiser incident, "erreur isolée"','Sanctionner enseignant immédiatement','Attendre saisine CNIL avant agir','Arrêt immédiat, informer DPO, CNIL si requis, familles, formation urgente équipe'],correct:3,points:50,justification:'Livret Mission 1 : Violation grave RGPD. Protocole complet obligatoire: arrêt immédiat pratique, information DPO et CNIL si nécessaire, communication familles, formation urgente sur protection données.'},
            {role:'direction',question:'Vous élaborez une charte d\'usage de l\'IA pour votre établissement. Vous utilisez ChatGPT pour rédiger les aspects juridiques. Avant de présenter au CA, quelle étape est indispensable?',choices:['Présenter directement, ChatGPT est fiable','Corriger uniquement orthographe et grammaire','Demander avis collègues informellement','Vérification complète avec Code éducation, textes officiels, relecture juriste ou IEN'],correct:3,points:35,justification:'Livret Mission 5 : Hallucinations et fiabilité. Document juridique avec erreurs = conséquences graves. Vérification obligatoire: Code éducation, textes officiels, relecture par personnes compétentes (juriste, IEN, référent académique).'},
            {role:'direction',question:'Détecteur de contenu IA indique 97% IA sur devoir de Malik. Conseil de discipline prononce 0/20 + avertissement. Parents contestent avec avocat. Vous devez rectifier. Action?',choices:['Annuler sanction, organiser entretien pédagogique, proposer évaluation orale','Maintenir décision, jurisprudence détecteurs','Utiliser 3 autres détecteurs pour confirmer','Exiger que l\'élève prouve son innocence'],correct:0,points:50,justification:'Livret Mission 4 : Détecteurs IA. Peu fiables, faux positifs massifs (élèves francophones, handicaps). JAMAIS sanctionner uniquement sur cette base. Annuler, entretien, évaluation orale alternative.'},
            {role:'enseignant',question:'Vous créez une évaluation d\'histoire sur la Révolution française pour vos 4ème. Vous demandez à Copilot de générer le contenu. Quelle pratique est la plus rigoureuse?',choices:['Utiliser tel quel, Copilot est fiable','Croiser avec un autre IA (ChatGPT)','Vérifier seulement si élève signale erreur','Vérifier chaque date, événement, nom avec sources historiques fiables'],correct:3,points:25,justification:'Livret Mission 5 : Hallucinations IA. L\'IA peut inventer dates, événements, citations. Pour contenu pédagogique: vérification systématique avec sources fiables (manuels validés, sites académiques, ouvrages référence).'},
            {role:'cpe',question:'Lors d\'une campagne de prévention harcèlement, vous utilisez une IA pour générer des témoignages fictifs "réalistes". Un témoignage mentionne "Kevin, 14 ans, Marseille". Problème éthique?',choices:['Aucun, Kevin fictif','Acceptable si on précise "fictif"','Risque: élève réel peut être identifié, stigmatisé, rumeurs','Bon outil pédagogique immersion'],correct:2,points:30,justification:'Livret Mission 5 : Biais et éthique. Même fictif, prénom + âge + ville peut correspondre à élève réel. Risque identification, stigmatisation, rumeurs. Toujours utiliser cas génériques ou anonymisés (initiales, sans localisation).'},
            {role:'direction',question:'Vous préparez documents officiels pour Conseil d\'Administration avec ChatGPT (ordre du jour, compte-rendu). Un élu remarque 3 erreurs juridiques graves. Mesures correctives?',choices:['Minimiser, "détails mineurs"','Accuser ChatGPT publiquement','Retirer documents, vérifier conformité Code éducation, corriger, re-présenter avec mention vérification','Modifier discrètement sans informer'],correct:2,points:40,justification:'Livret Mission 5 : Responsabilité et hallucinations. Document officiel erroné = conséquences juridiques graves. Protocole: retrait immédiat, vérification complète conformité, correction, nouvelle présentation avec transparence sur vérification.'},
            {role:'enseignant',question:'Vous enseignez l\'anglais et souhaitez que vos 3ème utilisent ChatGPT pour s\'entraîner à la conversation orale. Quelle mise en œuvre respecte le cadre légal?',choices:['Demander création comptes individuels ChatGPT','Donner code compte ChatGPT perso','Projection collective en classe, vous contrôlez interactions','Laisser élèves s\'inscrire à domicile'],correct:2,points:30,justification:'Livret Mission 1 & 2 : Protection mineurs. Interdiction comptes individuels (<18 ans). Alternative conforme: projection collective, enseignant contrôle, pas de données élèves, ou outils académiques dédiés.'},
            {role:'cpe',question:'Vous organisez une formation IA pour délégués de classe. Objectif: développer esprit critique. Quelle activité est la plus pertinente selon le Livret de Missions?',choices:['Montrer uniquement les dangers de l\'IA','Laisser délégués découvrir seuls','Interdire totalement usage IA','Atelier pratique: tester prompts, identifier biais, vérifier sources, reconnaître limites'],correct:3,points:30,justification:'Livret Mission 3 : Former à l\'usage éthique. Approche pratique efficace: ateliers avec techniques de prompt, identification biais, vérification sources, reconnaissance limites. Développe autonomie et esprit critique.'}
        ];
        const incidents=[
            {title:'🚨 INCIDENT CRITIQUE - VIOLATION RGPD MAJEURE',description:'Un enseignant de mathématiques vient de copier-coller 20 copies d\'élèves de 4ème (avec noms complets, prénoms et notes) dans ChatGPT pour "gagner du temps dans les corrections". Les données sont maintenant sur des serveurs américains. Trois parents furieux vous contactent et menacent de saisir la CNIL.',question:'Quelle est votre réaction immédiate en tant que responsable d\'établissement?',choices:['Minimiser l\'incident: "C\'est une erreur isolée, ça n\'arrivera plus"','Attendre une éventuelle saisine de la CNIL avant d\'agir','Sanctionner immédiatement l\'enseignant sans autre démarche','Arrêt immédiat de la pratique + information DPO + CNIL si requis + familles concernées + formation urgente équipe'],correct:3,points:50,justification:'Livret Mission 1 - Protection des données: Il s\'agit d\'une violation grave du RGPD. Le protocole complet est obligatoire: arrêt immédiat de la pratique, information du DPO (Délégué à la Protection des Données), saisine CNIL si nécessaire, communication transparente aux familles, et formation urgente de toute l\'équipe sur la protection des données.'},
            {title:'🚨 INCIDENT CRITIQUE - COMPTES MINEURS ILLÉGAUX',description:'Vous découvrez qu\'un enseignant de SVT a imposé à ses 28 élèves de 4ème (âgés de 13-14 ans) de créer un compte ChatGPT individuel pour faire des "recherches personnalisées" sur l\'environnement. Les élèves ont fourni emails et données personnelles. Parents inquiets vous contactent.',question:'Quelle action d\'urgence menez-vous?',choices:['Laisser faire: c\'est une décision pédagogique de l\'enseignant','Attendre de voir si ça pose vraiment problème','Informer immédiatement le chef d\'établissement, faire stopper, proposer alternative conforme (projection collective ou outil académique)','Rassurer les parents: "C\'est pour leur bien"'],correct:2,points:45,justification:'Livret Mission 1 - Protection mineurs: C\'est strictement interdit. Les CGU de ChatGPT imposent un âge minimum de 18 ans (ou 13 ans avec accord parental explicite et vérifiable, rarement applicable en établissement). Violation du RGPD et de la protection des mineurs. Action immédiate obligatoire: informer la direction, faire stopper la pratique, proposer alternative conforme (projection collective contrôlée ou outils académiques validés).'},
            {title:'🚨 INCIDENT CRITIQUE - IA COMME CONFIDENT PSY',description:'Vous êtes CPE. Vous découvrez que 15 élèves de 2nde utilisent régulièrement ChatGPT comme "confident psychologique" pour des problèmes intimes: harcèlement, anxiété, pensées noires, conflits familiaux. Ils lui font totalement confiance et suivent ses conseils. L\'infirmière scolaire vous alerte.',question:'Comment gérez-vous cette situation délicate?',choices:['Féliciter les élèves pour leur initiative et autonomie émotionnelle','Alerter immédiatement sur les risques psychologiques + orienter vers professionnels (infirmière, psy EN, AS, CPE)','Ne rien faire: c\'est leur vie privée','Demander à voir les conversations pour évaluer la gravité'],correct:1,points:45,justification:'Livret Mission 1 - Risques psychologiques: C\'est un risque psychologique majeur. ChatGPT n\'a AUCUNE formation psychologique, collecte des données sensibles, et peut donner des conseils dangereux voire mortels (notamment sur des sujets comme le suicide). Il faut immédiatement alerter les élèves sur ces risques et les orienter vers les professionnels compétents: infirmière scolaire, psychologue de l\'Éducation Nationale, assistante sociale, CPE.'},
            {title:'🚨 INCIDENT CRITIQUE - DÉTECTEUR IA INJUSTE',description:'Un détecteur de contenu IA (GPTZero) indique "97% probabilité IA" sur le devoir de philosophie de Malik, élève sérieux de Terminale. Le conseil de discipline prononce un 0/20 + avertissement. Les parents contestent avec avocat: Malik est francophone non-natif, son style est naturellement "atypique". Vous devez rectifier d\'urgence.',question:'Quelle décision prenez-vous pour rectifier cette injustice?',choices:['Annuler la sanction + organiser entretien pédagogique + proposer évaluation orale de rattrapage','Maintenir la décision: le détecteur fait jurisprudence','Utiliser 3 autres détecteurs pour confirmer ou infirmer','Exiger que l\'élève prouve son innocence par lui-même'],correct:0,points:50,justification:'Livret Mission 4 - Détecteurs IA: Les détecteurs de contenu IA sont peu fiables avec de très nombreux faux positifs, notamment pour les élèves francophones non-natifs, élèves avec troubles dys, ou styles d\'écriture atypiques. Il ne faut JAMAIS sanctionner un élève uniquement sur la base d\'un détecteur. La bonne pratique: annuler immédiatement la sanction injuste, organiser un entretien pédagogique individuel, proposer une évaluation orale alternative, analyser le processus de travail.'},
            {title:'🚨 INCIDENT CRITIQUE - CHARTE NON VÉRIFIÉE',description:'Vous avez élaboré une charte d\'usage de ChatGPT pour votre établissement en utilisant... ChatGPT pour rédiger les aspects juridiques. Elle a été votée au Conseil d\'Administration. Un avocat parent d\'élève remarque 3 erreurs juridiques graves concernant le RGPD et la responsabilité de l\'établissement.',question:'Quelles mesures correctives d\'urgence prenez-vous?',choices:['Minimiser: "Ce sont des détails, ça ira"','Retirer immédiatement la charte + vérifier conformité Code éducation + corriger avec expert + re-présenter au CA','Accuser publiquement ChatGPT de l\'erreur','Modifier discrètement le document sans en informer personne'],correct:1,points:40,justification:'Livret Mission 5 - Hallucinations et responsabilité: Un document officiel juridiquement erroné peut avoir des conséquences graves (responsabilité établissement, nullité décisions, contentieux). Protocole obligatoire: retrait immédiat du document, vérification complète de la conformité avec le Code de l\'éducation et textes officiels, correction avec expert juridique ou IEN, nouvelle présentation transparente au CA avec mention de la vérification effectuée.'}
        ];

        let currentIndex=0,score=0,incidentCount=0,answered=false,totalTime=1800,remainingTime=1800,timerInterval,questionStartTime,questionTimerInterval;
        let questionsAnswered=0,incidentsTriggered=new Set(),availableIncidents=[0,1,2,3,4];

        function startTimer(){
            timerInterval=setInterval(()=>{
                remainingTime--;
                updateTimerDisplay();
                if(remainingTime<=300)document.getElementById('timer').classList.add('warning');
                if(remainingTime<=0){
                    clearInterval(timerInterval);
                    showCompletion();
                }
            },1000);
        }

        function pauseTimer(){
            if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
        }

        function resumeTimer(){
            if(!timerInterval&&remainingTime>0)startTimer();
        }

        function updateTimerDisplay(){
            const m=Math.floor(remainingTime/60),s=remainingTime%60;
            document.getElementById('timer').textContent=`⏱️ ${m}:${s.toString().padStart(2,'0')}`;
        }

        function startQuestionTimer(){
            questionStartTime=Date.now();
            const timerEl=document.createElement('div');
            timerEl.id='questionTimer';
            timerEl.className='question-timer';
            timerEl.textContent='⏱️ 0s';
            const questionEl=document.querySelector('.question');
            if(questionEl)questionEl.before(timerEl);
            questionTimerInterval=setInterval(()=>{
                const elapsed=Math.floor((Date.now()-questionStartTime)/1000);
                const el=document.getElementById('questionTimer');
                if(el)el.textContent=`⏱️ ${elapsed}s`;
            },1000);
        }

        function stopQuestionTimer(){
            if(questionTimerInterval){clearInterval(questionTimerInterval);questionTimerInterval=null;}
        }

        function updateStats(){
            document.getElementById('scoreDisplay').textContent=score;
            document.getElementById('questionDisplay').textContent=`${Math.min(currentIndex,questions.length)}/${questions.length}`;
            document.getElementById('incidentDisplay').textContent=incidentCount;
        }

        function playAlertSound(){document.getElementById('alertSound').play().catch(()=>{});}
        function playSuccessSound(){document.getElementById('successSound').play().catch(()=>{});}

        function showWelcome(){
            document.getElementById('mainContent').innerHTML=`
                <div class="welcome-screen">
                    <h2>🚀 Bienvenue dans votre Mission IA!</h2>
                    <p><strong>Objectif:</strong> Maîtriser les 5 missions essentielles du Livret officiel de l'IA pour piloter efficacement l'usage de l'intelligence artificielle dans votre établissement scolaire.</p>
                    <p><strong>Format de la formation:</strong> 15 questions de validation + 5 incidents critiques à gérer</p>
                    <p><strong>Durée totale:</strong> 30 minutes chronomètrées</p>
                    <ul>
                        <li>✅ Répondez aux 15 questions pour valider vos connaissances</li>
                        <li>🚨 5 incidents critiques apparaissent toutes les 3 questions: gérez-les comme dans la réalité</li>
                        <li>📚 Ressources: <a href="https://eduscol.education.fr/4188/les-intelligences-artificielles-et-leurs-usages-en-education" target="_blank" style="color:#667eea;font-weight:bold">Guide officiel Éduscol</a></li>
                    </ul>
                    <p style="margin-top:30px;font-weight:700;color:#dc3545;font-size:1.15em">⚠️ ATTENTION: Les incidents critiques apparaissent après chaque série de 3 questions. Restez vigilants!</p>
                    <button class="btn-primary" onclick="startFormation()">🎯 Démarrer la formation →</button>
                </div>
            `;
        }

        function startFormation(){
            startTimer();
            showNextContent();
        }

        function showNextContent(){
            if(questionsAnswered>0 && questionsAnswered%3===0 && availableIncidents.length>0 && !incidentsTriggered.has(questionsAnswered)){
                incidentsTriggered.add(questionsAnswered);
                const randomIdx=Math.floor(Math.random()*availableIncidents.length);
                const incidentIdx=availableIncidents[randomIdx];
                availableIncidents.splice(randomIdx,1);
                triggerIncident(incidentIdx);
                return;
            }
            if(currentIndex<questions.length){showQuestion(currentIndex);}
            else{showCompletion();}
        }

        function showQuestion(idx){
            answered=false;
            const q=questions[idx];
            document.getElementById('mainContent').innerHTML=`
                <div class="question-section">
                    <span class="role-badge">${q.role.toUpperCase()}</span>
                    <div class="question">${q.question}</div>
                    <div class="choices">
                        ${q.choices.map((c,i)=>`<div class="choice" onclick="selectChoice(${i})">${c}</div>`).join('')}
                    </div>
                    <div class="feedback hidden" id="feedback"></div>
                    <button class="btn-primary hidden" id="nextBtn" onclick="nextQuestion()">Question suivante →</button>
                </div>
            `;
            startQuestionTimer();
        }

        function selectChoice(choiceIdx){
            if(answered)return;
            answered=true;
            stopQuestionTimer();
            questionsAnswered++;
            const q=questions[currentIndex];
            const choices=document.querySelectorAll('.choice');
            const fb=document.getElementById('feedback');
            const btn=document.getElementById('nextBtn');
            choices[choiceIdx].classList.add(choiceIdx===q.correct?'correct':'incorrect');
            if(choiceIdx===q.correct){
                score+=q.points;
                fb.className='feedback correct';
                fb.innerHTML=`<strong>✅ Excellente réponse!</strong><br><br>${q.justification}`;
                playSuccessSound();
            }else{
                choices[q.correct].classList.add('correct');
                fb.className='feedback incorrect';
                fb.innerHTML=`<strong>❌ Réponse incorrecte.</strong><br><br>${q.justification}`;
            }
            fb.classList.remove('hidden');
            btn.classList.remove('hidden');
            updateStats();
        }

        function nextQuestion(){
            currentIndex++;
            showNextContent();
        }

        function triggerIncident(idx){
            pauseTimer();
            stopQuestionTimer();
            playAlertSound();
            incidentCount++;
            updateStats();
            const inc=incidents[idx];
            document.getElementById('incidentPopup').innerHTML=`
                <h3>${inc.title}</h3>
                <div class="description">${inc.description}</div>
                <div class="question">${inc.question}</div>
                <div class="choices">
                    ${inc.choices.map((c,i)=>`<div class="choice" onclick="selectIncidentChoice(${idx},${i})">${c}</div>`).join('')}
                </div>
                <div class="feedback hidden" id="incidentFeedback"></div>
                <button class="btn-primary hidden" id="continueIncidentBtn" onclick="continueAfterIncident()">Reprendre la formation →</button>
            `;
            document.getElementById('incidentOverlay').classList.add('show');
        }

        function selectIncidentChoice(incIdx,choiceIdx){
            const inc=incidents[incIdx];
            const choices=document.querySelectorAll('#incidentPopup .choice');
            const fb=document.getElementById('incidentFeedback');
            const btn=document.getElementById('continueIncidentBtn');
            choices.forEach(c=>c.style.pointerEvents='none');
            choices[choiceIdx].classList.add(choiceIdx===inc.correct?'correct':'incorrect');
            if(choiceIdx===inc.correct){
                score+=inc.points;
                fb.className='feedback correct';
                fb.innerHTML=`<strong>✅ Excellente gestion de crise!</strong><br><br>${inc.justification}`;
                playSuccessSound();
            }else{
                choices[inc.correct].classList.add('correct');
                fb.className='feedback incorrect';
                fb.innerHTML=`<strong>❌ Gestion inappropriée.</strong><br><br>${inc.justification}`;
            }
            fb.classList.remove('hidden');
            btn.classList.remove('hidden');
            updateStats();
        }

        function continueAfterIncident(){
            document.getElementById('incidentOverlay').classList.remove('show');
            resumeTimer();
            showNextContent();
        }

        function showCompletion(){
            pauseTimer();
            const dur=totalTime-remainingTime;
            const m=Math.floor(dur/60),s=dur%60;
            let perf='Satisfaisant';
            if(score>=450)perf='Exceptionnel 🌟';
            else if(score>=400)perf='Excellent';
            else if(score>=300)perf='Très bien';
            else if(score>=200)perf='Bien';
            document.getElementById('mainContent').innerHTML=`
                <div class="completion-screen">
                    <h2>🎉 Mission Accomplie!</h2>
                    <p style="font-size:1.3em;margin:25px 0;line-height:1.7">Félicitations! Vous avez terminé avec succès la formation complète sur le pilotage de l'intelligence artificielle dans l'établissement scolaire.</p>
                    <div class="final-stats">
                        <div class="final-stat">
                            <div class="final-stat-label">Score final</div>
                            <div class="final-stat-value">${score}</div>
                        </div>
                        <div class="final-stat">
                            <div class="final-stat-label">Temps écoulé</div>
                            <div class="final-stat-value">${m}:${s.toString().padStart(2,'0')}</div>
                        </div>
                        <div class="final-stat">
                            <div class="final-stat-label">Performance</div>
                            <div class="final-stat-value" style="font-size:2em">${perf}</div>
                        </div>
                    </div>
                    <div style="margin-top:50px;text-align:left;max-width:700px;margin-left:auto;margin-right:auto;background:rgba(102,126,234,0.1);padding:35px;border-radius:20px">
                        <h3 style="color:#667eea;margin-bottom:25px;font-size:1.6em">📚 Ressources officielles du Ministère:</h3>
                        <ul style="line-height:2.3;font-size:1.1em">
                            <li>📥 <a href="https://eduscol.education.fr/4188/les-intelligences-artificielles-et-leurs-usages-en-education" target="_blank" style="color:#667eea;font-weight:bold">Guide complet sur l'IA en éducation (Éduscol)</a></li>
                            <li>👥 Organisez un temps de formation collective avec vos équipes éducatives</li>
                            <li>📋 Élaborez votre charte d'usage de l'IA spécifique à votre établissement</li>
                            <li>🎯 Nommez un référent IA et mettez en place un comité de suivi régulier</li>
                            <li>🤝 Partagez vos pratiques et retours d'expérience avec les autres établissements</li>
                            <li>👨‍👩‍👧‍👦 Impliquez les parents et les élèves dans la démarche de gouvernance IA</li>
                        </ul>
                    </div>
                </div>
            `;
        }

        updateStats();
        showWelcome();
    </script>
</body>
</html>
