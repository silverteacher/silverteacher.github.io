<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline IA - Mode Prof</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #7e90f4 0%, #c18af0 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-bottom: 10px;
      text-shadow: 1px 1px 2px #000;
    }
    .instructions {
      text-align: center;
      margin-bottom: 20px;
      max-width: 700px;
    }
    .buttons {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card-container, .timeline {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 30px;
    }
    .card {
      background: #fff;
      color: #333;
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      cursor: grab;
      width: 160px;
      text-align: center;
      font-size: 0.9rem;
      transition: transform 0.2s;
    }
    .card.dragging {
      opacity: 0.5;
      transform: scale(1.05);
    }
    .card.placed {
      background: #d0f5e6;
      color: #2b7a4b;
      cursor: default;
    }
    .card.error {
      animation: shake 0.3s;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
      100% { transform: translateX(0); }
    }
    .timeline {
      min-height: 150px;
      border: 2px dashed #fff;
      border-radius: 12px;
      padding: 20px;
      background-color: rgba(255,255,255,0.1);
      width: 90%;
      max-width: 800px;
    }
    .message {
      margin-top: 10px;
      font-weight: bold;
    }
    .prof-form {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.15);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
    }
    .prof-form input, .prof-form button {
      padding: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
    }
    .prof-form input {
      background-color: #fff;
      color: #333;
    }
    .prof-form button {
      background-color: #2e7d32;
      color: #fff;
      cursor: pointer;
    }
    .prof-toggle {
      background: #333;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
    }
    .solution-btn {
      background: #f39c12;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
    }
    @media (max-width: 600px) {
      .card { width: 90%; }
    }
  </style>
</head>
<body>
  <h1>Jeu Timeline : Histoire de l'IA</h1>
  <p class="instructions">Replace les événements dans l’ordre chronologique. Tu peux ajouter des événements ou afficher la solution.</p>

  <div class="buttons">
    <button class="prof-toggle" onclick="toggleProf()">🧑‍🏫 Mode Prof</button>
    <button class="solution-btn" onclick="showSolution()">🎯 Donner la solution</button>
  </div>

  <div class="prof-form" id="profForm">
    <input type="number" id="newYear" placeholder="Année (ex: 2001)">
    <input type="text" id="newText" placeholder="Description de l’événement">
    <button onclick="addEvent()">Ajouter à la timeline</button>
  </div>

  <div class="card-container" id="cardContainer"></div>
  <div class="timeline" id="timeline"></div>
  <p class="message" id="message"></p>

  <script>
    const allEvents = [
      { year: 1950, text: "Turing publie son article sur l’intelligence des machines" },
      { year: 1956, text: "Conférence de Dartmouth : naissance officielle de l’IA" },
      { year: 1966, text: "Le chatbot ELIZA simule un psy" },
      { year: 1980, text: "Les systèmes experts gagnent du terrain en entreprise" },
      { year: 1997, text: "Deep Blue bat Kasparov aux échecs" },
      { year: 2006, text: "Naissance du deep learning moderne (Geoffrey Hinton)" },
      { year: 2012, text: "AlexNet pulvérise ImageNet avec un réseau de neurones profonds" },
      { year: 2016, text: "AlphaGo bat Lee Sedol au jeu de Go" },
      { year: 2022, text: "Lancement public de ChatGPT" },
      { year: 2023, text: "Explosion des générateurs d'images IA comme Midjourney" }
    ];

    const cardContainer = document.getElementById('cardContainer');
    const timeline = document.getElementById('timeline');
    const message = document.getElementById('message');
    const profForm = document.getElementById('profForm');

    let placedEvents = [];

    function createCard(event) {
      const card = document.createElement('div');
      card.className = 'card';
      card.draggable = true;
      card.textContent = event.text;
      card.dataset.year = event.year;

      card.addEventListener('dragstart', () => card.classList.add('dragging'));
      card.addEventListener('dragend', () => card.classList.remove('dragging'));

      cardContainer.appendChild(card);
    }

    function shuffleAndDisplay(events) {
      const shuffled = [...events].sort(() => Math.random() - 0.5);
      shuffled.forEach(createCard);
    }

    shuffleAndDisplay(allEvents);

    timeline.addEventListener('dragover', e => e.preventDefault());
    timeline.addEventListener('drop', e => {
      e.preventDefault();
      const draggingCard = document.querySelector('.dragging');
      if (!draggingCard) return;
      const year = parseInt(draggingCard.dataset.year, 10);
      const lastYear = placedEvents.length ? placedEvents[placedEvents.length - 1].year : -Infinity;
      if (year >= lastYear) {
        draggingCard.classList.add('placed');
        draggingCard.draggable = false;
        timeline.appendChild(draggingCard);
        placedEvents.push({ year, text: draggingCard.textContent });
        message.textContent = '';
      } else {
        draggingCard.classList.add('error');
        setTimeout(() => draggingCard.classList.remove('error'), 500);
        message.textContent = "Mauvais ordre ! Essaie encore.";
      }
    });

    function toggleProf() {
      profForm.style.display = profForm.style.display === 'none' ? 'flex' : 'none';
    }

    function addEvent() {
      const year = parseInt(document.getElementById('newYear').value, 10);
      const text = document.getElementById('newText').value;
      if (!year || !text) return alert("Merci de remplir les deux champs.");
      const event = { year, text };
      allEvents.push(event);
      createCard(event);
      document.getElementById('newYear').value = '';
      document.getElementById('newText').value = '';
    }

    function showSolution() {
      timeline.innerHTML = '';
      const sorted = [...allEvents].sort((a, b) => a.year - b.year);
      sorted.forEach(e => {
        const card = document.createElement('div');
        card.className = 'card placed';
        card.textContent = `${e.year} : ${e.text}`;
        card.draggable = false;
        timeline.appendChild(card);
      });
      placedEvents = sorted;
      message.textContent = 'Solution affichée.';
    }
  </script>
</body>
</html>
