<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte des Compétences Enseignantes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            color: #2d3748;
            font-size: 2.8em;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .subtitle {
            color: #718096;
            font-size: 1.2em;
        }

        .competences-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            margin: 60px 0;
            padding: 20px;
        }

        .competence-circle {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border: 4px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }

        .circle::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            border-radius: 50%;
        }

        .competence-circle:hover .circle {
            transform: scale(1.15);
            border-color: #667eea;
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .competence-circle:hover .circle::before {
            opacity: 0.15;
        }

        .competence-circle.positioned .circle {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
        }

        .competence-circle.positioned .circle::before {
            opacity: 0;
        }

        .competence-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #2d3748;
            line-height: 1.4;
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .competence-circle.positioned .competence-name {
            color: white;
        }

        .competence-icon {
            font-size: 2em;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .competence-circle:hover .competence-icon {
            transform: scale(1.2) rotate(5deg);
        }

        .position-marker {
            position: absolute;
            bottom: -15px;
            width: 12px;
            height: 12px;
            background: #667eea;
            border-radius: 50%;
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7);
            animation: pulse 2s infinite;
        }

        .competence-circle.positioned .position-marker {
            opacity: 1;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(102, 126, 234, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(102, 126, 234, 0);
            }
        }

        .instructions {
            background: linear-gradient(135deg, rgba(66, 153, 225, 0.1) 0%, rgba(49, 130, 206, 0.1) 100%);
            border-left: 5px solid #4299e1;
            padding: 25px 30px;
            border-radius: 15px;
            margin-bottom: 40px;
            color: #2c5282;
            font-size: 1.1em;
            line-height: 1.7;
        }

        .instructions strong {
            color: #2d3748;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 35px;
            border: 2px solid #667eea;
            border-radius: 50px;
            background: white;
            color: #667eea;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
        }

        .btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn.reset {
            border-color: #f56565;
            color: #f56565;
        }

        .btn.reset:hover {
            background: #f56565;
            color: white;
        }

        .stats {
            text-align: center;
            margin-top: 40px;
            padding: 25px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            border-radius: 20px;
        }

        .stats-value {
            font-size: 3em;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats-label {
            color: #718096;
            font-size: 1.1em;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .competences-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 25px;
            }

            .circle {
                width: 140px;
                height: 140px;
            }

            .competence-name {
                font-size: 0.9em;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .competence-circle {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .competence-circle:nth-child(1) { animation-delay: 0.1s; }
        .competence-circle:nth-child(2) { animation-delay: 0.2s; }
        .competence-circle:nth-child(3) { animation-delay: 0.3s; }
        .competence-circle:nth-child(4) { animation-delay: 0.4s; }
        .competence-circle:nth-child(5) { animation-delay: 0.5s; }
        .competence-circle:nth-child(6) { animation-delay: 0.6s; }
        .competence-circle:nth-child(7) { animation-delay: 0.7s; }
        .competence-circle:nth-child(8) { animation-delay: 0.8s; }
        .competence-circle:nth-child(9) { animation-delay: 0.9s; }
        .competence-circle:nth-child(10) { animation-delay: 1s; }
        .competence-circle:nth-child(11) { animation-delay: 1.1s; }
        .competence-circle:nth-child(12) { animation-delay: 1.2s; }

        .tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9em;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
            white-space: nowrap;
        }

        .tooltip.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="tooltip" id="tooltip"></div>
    
    <div class="container">
        <header>
            <h1>🎯 Mes Compétences Enseignantes</h1>
            <p class="subtitle">Positionnez-vous en cliquant sur chaque compétence</p>
        </header>

        <div class="instructions">
            💡 <strong>Mode d'emploi :</strong> Cliquez sur les cercles des compétences où vous vous sentez à l'aise. Les cercles sélectionnés changent de couleur. Vous pouvez cliquer à nouveau pour déselectionner.
        </div>

        <div class="competences-grid" id="competencesGrid">
            <!-- Les cercles seront générés ici -->
        </div>

        <div class="stats">
            <div class="stats-value" id="statsValue">0/10</div>
            <div class="stats-label">compétences positionnées</div>
        </div>

        <div class="controls">
            <button class="btn" onclick="captureScreen()">📸 Capturer l'écran</button>
            <button class="btn reset" onclick="resetAll()">🔄 Tout réinitialiser</button>
        </div>
    </div>

    <script>
        const competences = [
            { name: 'Créativité', icon: '💡' },
            { name: 'Planification', icon: '📅' },
            { name: 'Gestion de classe', icon: '👥' },
            { name: 'Évaluations', icon: '📝' },
            { name: 'Différenciation', icon: '🎯' },
            { name: 'Inclusion', icon: '🤝' },
            { name: 'Numérique', icon: '💻' },
            { name: 'Correction copies/cahiers', icon: '✍️' },
            { name: 'Suivi des élèves', icon: '📊' },
            { name: 'Empathie', icon: '❤️' },
            { name: 'Communication', icon: '💬' },
            { name: 'Adaptation', icon: '🔄' }
        ];

        let positionedCompetences = new Set();

        function initCompetences() {
            const grid = document.getElementById('competencesGrid');
            grid.innerHTML = '';

            competences.forEach((comp, index) => {
                const div = document.createElement('div');
                div.className = 'competence-circle';
                div.dataset.index = index;
                div.innerHTML = `
                    <div class="circle">
                        <div style="text-align: center;">
                            <div class="competence-icon">${comp.icon}</div>
                            <div class="competence-name">${comp.name}</div>
                        </div>
                    </div>
                    <div class="position-marker"></div>
                `;

                div.addEventListener('click', function() {
                    togglePosition(this, index);
                });

                div.addEventListener('mouseenter', function(e) {
                    showTooltip(e, comp.name);
                });

                div.addEventListener('mouseleave', function() {
                    hideTooltip();
                });

                grid.appendChild(div);
            });

            updateStats();
        }

        function togglePosition(element, index) {
            if (positionedCompetences.has(index)) {
                positionedCompetences.delete(index);
                element.classList.remove('positioned');
            } else {
                positionedCompetences.add(index);
                element.classList.add('positioned');
            }
            updateStats();
        }

        function updateStats() {
            const statsValue = document.getElementById('statsValue');
            statsValue.textContent = `${positionedCompetences.size}/12`;
        }

        function resetAll() {
            if (confirm('Voulez-vous vraiment réinitialiser tous les positionnements ?')) {
                positionedCompetences.clear();
                document.querySelectorAll('.competence-circle').forEach(el => {
                    el.classList.remove('positioned');
                });
                updateStats();
            }
        }

        function captureScreen() {
            alert('💡 Utilisez les outils de capture d\'écran de votre système :\n\n• Windows : Win + Shift + S\n• Mac : Cmd + Shift + 4\n• Chrome : Extension "Awesome Screenshot"');
        }

        function showTooltip(e, text) {
            const tooltip = document.getElementById('tooltip');
            tooltip.textContent = `Cliquer pour se positionner sur : ${text}`;
            tooltip.classList.add('visible');
            updateTooltipPosition(e);
        }

        function hideTooltip() {
            const tooltip = document.getElementById('tooltip');
            tooltip.classList.remove('visible');
        }

        function updateTooltipPosition(e) {
            const tooltip = document.getElementById('tooltip');
            tooltip.style.left = e.pageX + 15 + 'px';
            tooltip.style.top = e.pageY - 10 + 'px';
        }

        document.addEventListener('mousemove', function(e) {
            const tooltip = document.getElementById('tooltip');
            if (tooltip.classList.contains('visible')) {
                updateTooltipPosition(e);
            }
        });

        // Initialisation
        initCompetences();
    </script>
</body>
</html>
