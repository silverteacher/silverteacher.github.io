<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline IA - Jeu d'Équipes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-top: 10px;
        }
        .setup-screen {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }
        .team-setup {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .team-input {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
        }
        .team-input input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        .color-palette {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0 0 0;
        }
        .team-color {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid white;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .team-color:hover {
            transform: scale(1.1);
        }
        .team-color.selected {
            border-width: 4px;
            transform: scale(1.2);
        }
        .game-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
        }
        .btn-primary {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }
        .btn-secondary {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }
        .btn-danger {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .team-score {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            min-width: 200px;
            border: 3px solid transparent;
            transition: all 0.3s ease;
        }
        .team-score.active {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            transform: scale(1.05);
        }
        .team-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .score {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .streak {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .game-area {
            display: none;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .round-info {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }
        .round-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffd700;
        }
        .current-team {
            font-size: 1.2rem;
            margin-top: 10px;
        }
        .timer {
            font-size: 2rem;
            font-weight: 700;
            color: #ff6b6b;
            margin: 10px 0;
        }
        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            min-height: 120px;
        }
        .card {
            background: linear-gradient(135deg, #fff, #f8f9fa);
            color: #333;
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            cursor: pointer;
            min-width: 200px;
            max-width: 280px;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            font-weight: 500;
            user-select: none;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card.placed {
            background: linear-gradient(135deg, #4CAF50, #66BB6A);
            color: white;
            cursor: default;
            border-color: #2E7D32;
        }
        .message {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            transition: all 0.3s ease;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .message.success {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 2px solid #4CAF50;
        }
        .message.error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 2px solid #f44336;
        }
        .timeline {
            min-height: 180px;
            border: 3px dashed rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            margin-bottom: 20px;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        .timeline::before {
            content: "Cliquez sur les cartes pour les placer dans l'ordre chronologique";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.7;
            font-size: 1.1rem;
            pointer-events: none;
            text-align: center;
        }
        .timeline:not(:empty)::before {
            display: none;
        }
        .final-results {
            display: none;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .winner-announcement {
            font-size: 3rem;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .final-scores {
            font-size: 1.3rem;
            line-height: 2;
            margin: 20px 0;
        }
        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .card { min-width: 100%; max-width: 100%; }
            .scoreboard { flex-direction: column; align-items: center; }
            .team-setup { grid-template-columns: 1fr; }
            .winner-announcement { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Timeline IA Challenge</h1>
            <div class="subtitle">Jeu d'équipes - Qui connaît le mieux l'histoire de l'Intelligence Artificielle ?</div>
        </div>

        <div id="setupScreen" class="setup-screen">
            <h2>Configuration du Jeu</h2>
            <p>Créez vos équipes et choisissez vos couleurs !</p>
            
            <div id="teamSetup" class="team-setup">
                <div class="team-input">
                    <h3>Équipe 1</h3>
                    <input type="text" placeholder="Nom de l'équipe" maxlength="20">
                    <div class="color-palette">
                        <div class="team-color" data-team="1" data-color="#FF6B6B" style="background-color: #FF6B6B;"></div>
                        <div class="team-color" data-team="1" data-color="#4ECDC4" style="background-color: #4ECDC4;"></div>
                        <div class="team-color" data-team="1" data-color="#45B7D1" style="background-color: #45B7D1;"></div>
                        <div class="team-color" data-team="1" data-color="#96CEB4" style="background-color: #96CEB4;"></div>
                        <div class="team-color" data-team="1" data-color="#FECA57" style="background-color: #FECA57;"></div>
                        <div class="team-color" data-team="1" data-color="#FF9FF3" style="background-color: #FF9FF3;"></div>
                    </div>
                </div>
                <div class="team-input">
                    <h3>Équipe 2</h3>
                    <input type="text" placeholder="Nom de l'équipe" maxlength="20">
                    <div class="color-palette">
                        <div class="team-color" data-team="2" data-color="#FF6B6B" style="background-color: #FF6B6B;"></div>
                        <div class="team-color" data-team="2" data-color="#4ECDC4" style="background-color: #4ECDC4;"></div>
                        <div class="team-color" data-team="2" data-color="#45B7D1" style="background-color: #45B7D1;"></div>
                        <div class="team-color" data-team="2" data-color="#96CEB4" style="background-color: #96CEB4;"></div>
                        <div class="team-color" data-team="2" data-color="#FECA57" style="background-color: #FECA57;"></div>
                        <div class="team-color" data-team="2" data-color="#FF9FF3" style="background-color: #FF9FF3;"></div>
                    </div>
                </div>
            </div>
            
            <div class="game-controls">
                <button class="btn btn-secondary" onclick="addTeam()">➕ Ajouter une équipe</button>
                <button class="btn btn-primary" onclick="startGame()">🚀 Commencer le jeu</button>
            </div>
        </div>

        <div id="scoreboard" class="scoreboard" style="display: none;"></div>

        <div id="gameArea" class="game-area">
            <div class="round-info">
                <div id="roundNumber" class="round-number">Manche 1</div>
                <div id="currentTeam" class="current-team">Au tour de l'équipe 1</div>
                <div id="timer" class="timer">30</div>
            </div>

            <div id="cardContainer" class="card-container"></div>
            <div id="timeline" class="timeline"></div>

            <div id="message" class="message"></div>

            <div class="game-controls">
                <button class="btn btn-secondary" onclick="skipTurn()">⏭️ Passer le tour</button>
                <button class="btn btn-danger" onclick="resetGame()">🔄 Nouvelle partie</button>
            </div>
        </div>

        <div id="finalResults" class="final-results">
            <div id="winnerText" class="winner-announcement"></div>
            <div id="finalScores" class="final-scores"></div>
            <button class="btn btn-primary" onclick="resetGame()">🎮 Nouvelle partie</button>
        </div>
    </div>

    <script>
        const aiEvents = [
            { year: 1943, text: "Warren McCulloch et Walter Pitts créent le premier neurone artificiel" },
            { year: 1950, text: "Alan Turing publie « Computing Machinery and Intelligence »" },
            { year: 1956, text: "Conférence de Dartmouth, naissance officielle de l'IA" },
            { year: 1957, text: "Création du Perceptron par Frank Rosenblatt" },
            { year: 1966, text: "ELIZA, premier chatbot créé par Joseph Weizenbaum" },
            { year: 1986, text: "Réseaux de neurones avec rétropropagation" },
            { year: 1997, text: "Deep Blue bat Garry Kasparov aux échecs" },
            { year: 2006, text: "Geoffrey Hinton popularise le deep learning" },
            { year: 2011, text: "IBM Watson gagne à Jeopardy!" },
            { year: 2012, text: "Victoire d'AlexNet au concours ImageNet" },
            { year: 2016, text: "AlphaGo bat Lee Sedol au jeu de Go" },
            { year: 2017, text: "Publication de l'architecture Transformer" },
            { year: 2018, text: "BERT révolutionne la compréhension du langage" },
            { year: 2020, text: "GPT-3 démontre des capacités linguistiques impressionnantes" },
            { year: 2022, text: "Lancement public de ChatGPT" },
            { year: 2023, text: "GPT-4 et explosion de l'IA générative" }
        ];

        let teams = [];
        let currentTeamIndex = 0;
        let currentRound = 1;
        const maxRounds = 8;
        let placedEvents = [];
        let currentEvents = [];
        let timer = null;
        let timeLeft = 30;
        let gameInProgress = false;

        function setupColorSelection() {
            document.querySelectorAll('.team-color').forEach(color => {
                color.addEventListener('click', function() {
                    const teamNum = this.dataset.team;
                    document.querySelectorAll(`[data-team="${teamNum}"]`).forEach(c => c.classList.remove('selected'));
                    this.classList.add('selected');
                });
            });
        }

        function addTeam() {
            const teamSetup = document.getElementById('teamSetup');
            const teamCount = teamSetup.children.length + 1;
            if (teamCount > 6) {
                alert("Nombre maximum d'équipes atteint (6).");
                return;
            }
            const teamDiv = document.createElement('div');
            teamDiv.className = 'team-input';
            teamDiv.innerHTML = `
                <h3>Équipe ${teamCount}</h3>
                <input type="text" placeholder="Nom de l'équipe" maxlength="20">
                <div class="color-palette">
                    <div class="team-color" data-team="${teamCount}" data-color="#FF6B6B" style="background-color: #FF6B6B;"></div>
                    <div class="team-color" data-team="${teamCount}" data-color="#4ECDC4" style="background-color: #4ECDC4;"></div>
                    <div class="team-color" data-team="${teamCount}" data-color="#45B7D1" style="background-color: #45B7D1;"></div>
                    <div class="team-color" data-team="${teamCount}" data-color="#96CEB4" style="background-color: #96CEB4;"></div>
                    <div class="team-color" data-team="${teamCount}" data-color="#FECA57" style="background-color: #FECA57;"></div>
                    <div class="team-color" data-team="${teamCount}" data-color="#FF9FF3" style="background-color: #FF9FF3;"></div>
                </div>
            `;
            teamSetup.appendChild(teamDiv);
            setupColorSelection();
        }

        function startGame() {
            teams = [];
            const teamInputs = document.querySelectorAll('.team-input');
            for (const teamDiv of teamInputs) {
                const nameInput = teamDiv.querySelector('input');
                const selectedColor = teamDiv.querySelector('.team-color.selected');
                if (!nameInput.value.trim()) {
                    alert("Veuillez entrer un nom pour chaque équipe.");
                    return;
                }
                if (!selectedColor) {
                    alert("Veuillez sélectionner une couleur pour chaque équipe.");
                    return;
                }
                teams.push({
                    name: nameInput.value.trim(),
                    color: selectedColor.dataset.color,
                    score: 0,
                    streak: 0
                });
            }
            if (teams.length < 2) {
                alert("Il faut au moins 2 équipes pour jouer.");
                return;
            }
            
            // Validation des couleurs uniques
            const colors = teams.map(t => t.color);
            if (new Set(colors).size !== colors.length) {
                alert("Chaque équipe doit avoir une couleur différente.");
                return;
            }

            currentEvents = [...aiEvents];
            shuffleArray(currentEvents);
            placedEvents = [];
            currentTeamIndex = 0;
            currentRound = 1;
            gameInProgress = true;

            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('scoreboard').style.display = 'flex';
            document.getElementById('gameArea').style.display = 'block';
            document.getElementById('finalResults').style.display = 'none';

            updateScoreboard();
            nextTurn();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function updateScoreboard() {
            const scoreboard = document.getElementById('scoreboard');
            scoreboard.innerHTML = '';
            teams.forEach((team, index) => {
                const div = document.createElement('div');
                div.className = 'team-score' + (index === currentTeamIndex ? ' active' : '');
                div.style.borderColor = team.color;
                div.innerHTML = `
                    <div class="team-name">${team.name}</div>
                    <div class="score">${team.score}</div>
                    <div class="streak">Série: ${team.streak}</div>
                `;
                scoreboard.appendChild(div);
            });
        }

        function updateRoundInfo() {
            document.getElementById('roundNumber').textContent = `Manche ${currentRound}`;
            document.getElementById('currentTeam').textContent = `Au tour de ${teams[currentTeamIndex].name}`;
            document.getElementById('timer').textContent = timeLeft;
        }

        function nextTurn() {
            if (currentRound > maxRounds || currentEvents.length === 0) {
                endGame();
                return;
            }
            
            clearMessage();
            timeLeft = 30;
            updateRoundInfo();
            displayCard(currentEvents.pop());
            updateTimeline();
            startTimer();
        }

        function displayCard(event) {
            const cardContainer = document.getElementById('cardContainer');
            cardContainer.innerHTML = '';
            const card = document.createElement('div');
            card.className = 'card';
            card.textContent = event.text;
            card.dataset.year = event.year;
            cardContainer.appendChild(card);
        }

        function updateTimeline() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';
            placedEvents.forEach(event => {
                const timelineCard = document.createElement('div');
                timelineCard.className = 'card placed';
                timelineCard.textContent = `${event.text} (${event.year})`;
                timeline.appendChild(timelineCard);
            });
        }

        function startTimer() {
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    teams[currentTeamIndex].streak = 0;
                    showMessage("Temps écoulé !", "error");
                    setTimeout(nextTeam, 2000);
                }
            }, 1000);
        }

        function nextTeam() {
            currentTeamIndex = (currentTeamIndex + 1) % teams.length;
            if (currentTeamIndex === 0) {
                currentRound++;
            }
            setTimeout(() => {
                nextTurn();
            }, 1500);
        }

        function skipTurn() {
            if (!gameInProgress) return;
            clearInterval(timer);
            teams[currentTeamIndex].streak = 0;
            showMessage("Tour passé !", "error");
            nextTeam();
        }

        function resetGame() {
            gameInProgress = false;
            clearInterval(timer);
            teams = [];
            currentTeamIndex = 0;
            currentRound = 1;
            placedEvents = [];
            currentEvents = [];
            timeLeft = 30;

            document.getElementById('setupScreen').style.display = 'block';
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('scoreboard').style.display = 'none';
            document.getElementById('finalResults').style.display = 'none';

            const teamSetup = document.getElementById('teamSetup');
            teamSetup.innerHTML = `
                <div class="team-input">
                    <h3>Équipe 1</h3>
                    <input type="text" placeholder="Nom de l'équipe" maxlength="20">
                    <div class="color-palette">
                        <div class="team-color" data-team="1" data-color="#FF6B6B" style="background-color: #FF6B6B;"></div>
                        <div class="team-color" data-team="1" data-color="#4ECDC4" style="background-color: #4ECDC4;"></div>
                        <div class="team-color" data-team="1" data-color="#45B7D1" style="background-color: #45B7D1;"></div>
                        <div class="team-color" data-team="1" data-color="#96CEB4" style="background-color: #96CEB4;"></div>
                        <div class="team-color" data-team="1" data-color="#FECA57" style="background-color: #FECA57;"></div>
                        <div class="team-color" data-team="1" data-color="#FF9FF3" style="background-color: #FF9FF3;"></div>
                    </div>
                </div>
                <div class="team-input">
                    <h3>Équipe 2</h3>
                    <input type="text" placeholder="Nom de l'équipe" maxlength="20">
                    <div class="color-palette">
                        <div class="team-color" data-team="2" data-color="#FF6B6B" style="background-color: #FF6B6B;"></div>
                        <div class="team-color" data-team="2" data-color="#4ECDC4" style="background-color: #4ECDC4;"></div>
                        <div class="team-color" data-team="2" data-color="#45B7D1" style="background-color: #45B7D1;"></div>
                        <div class="team-color" data-team="2" data-color="#96CEB4" style="background-color: #96CEB4;"></div>
                        <div class="team-color" data-team="2" data-color="#FECA57" style="background-color: #FECA57;"></div>
                        <div class="team-color" data-team="2" data-color="#FF9FF3" style="background-color: #FF9FF3;"></div>
                    </div>
                </div>
            `;
            setupColorSelection();
            clearMessage();
        }

        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = 'message ' + (type === 'error' ? 'error' : 'success');
        }

        function clearMessage() {
            const message = document.getElementById('message');
            message.textContent = '';
            message.className = 'message';
        }

        // Gestion des clics sur les cartes
        document.getElementById('cardContainer').addEventListener('click', e => {
            if (!gameInProgress) return;
            if (!e.target.classList.contains('card')) return;

            const card = e.target;
            const year = parseInt(card.dataset.year);

            // Vérifier si c'est le bon placement chronologique
            if (placedEvents.length === 0 || year >= placedEvents[placedEvents.length - 1].year) {
                placedEvents.push({ year: year, text: card.textContent });
                card.classList.add('placed');
                card.style.cursor = 'default';
                clearInterval(timer);
                teams[currentTeamIndex].score += 10;
                teams[currentTeamIndex].streak++;
                showMessage(`Bonne réponse ! +10 points (${year})`, "success");
                updateScoreboard();
                updateTimeline();
                setTimeout(nextTeam, 2000);
            } else {
                teams[currentTeamIndex].streak = 0;
                showMessage(`Mauvais placement ! Cette innovation date de ${year}, mais il fallait ${placedEvents[placedEvents.length - 1].year} ou plus récent.`, "error");
                setTimeout(nextTeam, 3000);
            }
        });

        function endGame() {
            gameInProgress = false;
            clearInterval(timer);
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('scoreboard').style.display = 'none';
            document.getElementById('finalResults').style.display = 'block';

            const maxScore = Math.max(...teams.map(t => t.score));
            const winners = teams.filter(t => t.score === maxScore);

            const winnerText = winners.length === 1
                ? `🏆 L'équipe gagnante est ${winners[0].name} avec ${winners[0].score} points !`
                : `🏆 Égalité entre ${winners.map(t => t.name).join(' et ')} avec ${maxScore} points !`;

            document.getElementById('winnerText').textContent = winnerText;

            const finalScores = document.getElementById('finalScores');
            finalScores.innerHTML = teams
                .sort((a,b) => b.score - a.score)
                .map(t => `<div>${t.name} : ${t.score} points</div>`)
                .join('');
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            setupColorSelection();
        });
    </script>
</body>
</html>
