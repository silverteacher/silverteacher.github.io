<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Timeline IA - Jeu d'équipes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #0f0f23;
      --bg-secondary: #1a1a2e;
      --bg-card: #16213e;
      --bg-glass: rgba(255, 255, 255, 0.05);
      --border-glass: rgba(255, 255, 255, 0.1);
      --accent-primary: #00d2ff;
      --accent-secondary: #3a7bd5;
      --accent-success: #00ff88;
      --accent-warning: #ff6b35;
      --accent-danger: #ff3838;
      --text-primary: #ffffff;
      --text-secondary: #b8c5d6;
      --text-muted: #6b7894;
      --glow-primary: 0 0 20px rgba(0, 210, 255, 0.3);
      --glow-success: 0 0 20px rgba(0, 255, 136, 0.3);
      --glow-danger: 0 0 20px rgba(255, 56, 56, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(0, 210, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(58, 123, 213, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 40px 20px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      box-shadow: var(--glow-primary);
    }

    .header h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      text-shadow: 0 0 30px rgba(0, 210, 255, 0.5);
    }

    .subtitle {
      font-size: 1.2rem;
      color: var(--text-secondary);
      font-weight: 300;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .setup-screen, .game-area, .final-results {
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .setup-screen h2 {
      font-size: 2rem;
      margin-bottom: 30px;
      text-align: center;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .team-input {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
      position: relative;
    }

    .team-input:hover {
      transform: translateY(-2px);
      box-shadow: var(--glow-primary);
    }

    .team-input h3 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .remove-team-btn {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .remove-team-btn:hover {
      background: var(--accent-danger);
      transform: scale(1.1);
    }

    .team-input input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      background: var(--bg-glass);
      color: var(--text-primary);
      font-size: 1rem;
      margin-bottom: 16px;
      transition: all 0.3s ease;
    }

    .team-input input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: var(--glow-primary);
    }

    .team-input input::placeholder {
      color: var(--text-muted);
    }

    .color-palette {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .team-color {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.3s ease;
      position: relative;
    }

    .team-color:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px currentColor;
    }

    .team-color.selected {
      border-color: var(--text-primary);
      box-shadow: 0 0 20px currentColor;
      transform: scale(1.15);
    }

    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: white;
      box-shadow: var(--glow-primary);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 210, 255, 0.4);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-glass);
    }

    .btn-secondary:hover {
      background: var(--bg-glass);
      transform: translateY(-2px);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--accent-danger), #ff6b6b);
      color: white;
      box-shadow: var(--glow-danger);
    }

    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 56, 56, 0.4);
    }

    .game-controls {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .scoreboard {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .team-score {
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 2px solid var(--border-glass);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      min-width: 140px;
      transition: all 0.3s ease;
    }

    .team-score.active {
      transform: scale(1.05);
      box-shadow: var(--glow-primary);
    }

    .team-name {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .score {
      font-size: 2rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }

    .round-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .round-number, .current-team, .timer {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .timer {
      background: linear-gradient(135deg, var(--accent-warning), #ff8c42);
      color: white;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.3rem;
      box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
    }

    .card-container {
      margin-bottom: 40px;
    }

    .card-container h3 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      text-align: center;
      color: var(--accent-primary);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 2px solid var(--border-glass);
      border-radius: 12px;
      padding: 20px;
      cursor: grab;
      transition: all 0.3s ease;
      font-size: 0.95rem;
      line-height: 1.5;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
    }

    .card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: var(--glow-primary);
      border-color: var(--accent-primary);
    }

    .card.dragging {
      opacity: 0.7;
      transform: rotate(5deg) scale(1.05);
    }

    .card.placed {
      opacity: 0.5;
      transform: scale(0.95);
      filter: grayscale(50%);
    }

    .hint-button {
      background: linear-gradient(135deg, var(--accent-secondary), #667eea);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }

    .hint-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(58, 123, 213, 0.4);
    }

    .hint {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 20px;
      margin-top: 16px;
      line-height: 1.6;
      color: var(--text-secondary);
      display: none;
    }

    .timeline {
      background: var(--bg-card);
      border: 2px dashed var(--border-glass);
      border-radius: 16px;
      min-height: 200px;
      padding: 20px;
      margin-bottom: 30px;
      transition: all 0.3s ease;
      position: relative;
    }

    .timeline::before {
      content: '📅 Glissez les cartes ici dans l\'ordre chronologique';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--text-muted);
      font-weight: 500;
      pointer-events: none;
      opacity: 0.7;
      font-size: 1.1rem;
    }

    .timeline.drag-over {
      border-color: var(--accent-primary);
      background: var(--bg-glass);
      box-shadow: var(--glow-primary);
    }

    .timeline-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .timeline-card {
      background: linear-gradient(135deg, var(--accent-success), #00d084);
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: var(--glow-success);
      position: relative;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .timeline-card::before {
      content: attr(data-position);
      position: absolute;
      top: -8px;
      left: -8px;
      background: var(--accent-primary);
      color: white;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: bold;
      font-family: 'JetBrains Mono', monospace;
    }

    .message {
      text-align: center;
      padding: 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1.1rem;
      margin: 20px 0;
      animation: messageSlide 0.3s ease;
    }

    @keyframes messageSlide {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.success {
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 208, 132, 0.2));
      color: var(--accent-success);
      border: 1px solid var(--accent-success);
      box-shadow: var(--glow-success);
    }

    .message.error {
      background: linear-gradient(135deg, rgba(255, 56, 56, 0.2), rgba(255, 107, 107, 0.2));
      color: var(--accent-danger);
      border: 1px solid var(--accent-danger);
      box-shadow: var(--glow-danger);
    }

    .message.warning {
      background: linear-gradient(135deg, rgba(255, 107, 53, 0.2), rgba(255, 140, 66, 0.2));
      color: var(--accent-warning);
      border: 1px solid var(--accent-warning);
    }

    .final-results {
      text-align: center;
      display: none;
    }

    .winner-announcement {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 30px;
      background: linear-gradient(135deg, var(--accent-success), var(--accent-primary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: celebrate 1s ease infinite alternate;
    }

    @keyframes celebrate {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    #finalScores {
      font-size: 1.2rem;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }
      
      .header {
        padding: 30px 15px;
      }
      
      .setup-screen, .game-area, .final-results {
        padding: 25px;
      }
      
      .cards-grid {
        grid-template-columns: 1fr;
      }
      
      .round-info {
        grid-template-columns: 1fr;
      }
      
      .scoreboard {
        gap: 15px;
      }
      
      .team-score {
        min-width: 120px;
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 Timeline IA Challenge</h1>
      <p class="subtitle">Placez les événements de l'intelligence artificielle dans l'ordre chronologique !</p>
    </div>

    <div id="setupScreen" class="setup-screen">
      <h2>⚙️ Configuration du Jeu</h2>
      <div class="team-setup" id="teamSetup"></div>
      <div class="game-controls">
        <button class="btn btn-secondary" id="addTeamBtn">➕ Ajouter une équipe</button>
        <button class="btn btn-primary" id="startGameBtn">🚀 Commencer le jeu</button>
      </div>
    </div>

    <div id="scoreboard" class="scoreboard" style="display:none;"></div>

    <div id="gameArea" class="game-area" style="display:none;">
      <div class="round-info">
        <div class="round-number" id="roundNumber"></div>
        <div class="current-team" id="currentTeam"></div>
        <div class="timer" id="timer"></div>
      </div>
      <div class="card-container" id="cardContainer">
        <h3>📚 Cartes à placer :</h3>
        <div class="cards-grid" id="cardsGrid"></div>
        <div style="text-align: center; margin-top: 15px;">
          <button class="hint-button" id="hintBtn">💡 Besoin d'un indice ?</button>
          <div class="hint" id="hint"></div>
        </div>
      </div>
      <div class="timeline" id="timeline">
        <div class="timeline-cards" id="timelineCards"></div>
      </div>
      <div class="message" id="message"></div>
      <div class="game-controls">
        <button class="btn btn-secondary" id="skipTurnBtn">⏭️ Passer le tour</button>
        <button class="btn btn-danger" id="resetGameBtn">🔄 Nouvelle partie</button>
      </div>
    </div>

    <div id="finalResults" class="final-results">
      <div class="winner-announcement" id="winnerText"></div>
      <div id="finalScores"></div>
      <button class="btn btn-primary" id="resetGameBtn2">🔄 Nouvelle partie</button>
    </div>
  </div>

  <script>
    // Données des événements IA avec indices
    const aiEvents = [
      { year: 1943, text: "Warren McCulloch et Walter Pitts créent le premier neurone artificiel", hint: "Première modélisation mathématique d'un neurone, pendant la Seconde Guerre mondiale" },
      { year: 1950, text: "Alan Turing publie « Computing Machinery and Intelligence »", hint: "Introduction du célèbre 'Test de Turing' pour mesurer l'intelligence artificielle" },
      { year: 1956, text: "Conférence de Dartmouth, naissance officielle de l'IA", hint: "Événement fondateur où le terme 'Intelligence Artificielle' est créé" },
      { year: 1957, text: "Création du Perceptron par Frank Rosenblatt", hint: "Premier algorithme d'apprentissage automatique, ancêtre des réseaux de neurones" },
      { year: 1966, text: "ELIZA, premier chatbot créé par Joseph Weizenbaum", hint: "Premier programme capable de simuler une conversation, inspiré de la psychothérapie" },
      { year: 1986, text: "Réseaux de neurones avec rétropropagation", hint: "Révolution dans l'entraînement des réseaux de neurones multicouches" },
      { year: 1997, text: "Deep Blue bat Garry Kasparov aux échecs", hint: "Premier ordinateur à battre un champion du monde d'échecs en titre" },
      { year: 2006, text: "Geoffrey Hinton popularise le deep learning", hint: "Renaissance des réseaux de neurones profonds après des décennies d'oubli" },
      { year: 2011, text: "IBM Watson gagne à Jeopardy!", hint: "Démonstration de traitement du langage naturel dans un jeu télévisé populaire" },
      { year: 2012, text: "Victoire d'AlexNet au concours de reconnaissance d'images, ImageNet", hint: "Percée majeure en vision par ordinateur grâce au deep learning" },
      { year: 2016, text: "AlphaGo bat Lee Sedol au jeu de Go", hint: "Victoire historique dans un jeu considéré comme impossible à maîtriser pour une machine" },
      { year: 2017, text: "Publication de l'architecture Transformer", hint: "Architecture révolutionnaire qui donnera naissance à GPT, BERT et tous les grands modèles actuels" },
      { year: 2018, text: "BERT révolutionne la compréhension du langage des machines", hint: "Premier modèle à vraiment comprendre le contexte bidirectionnel dans les phrases" },
      { year: 2020, text: "GPT-3 démontre des capacités linguistiques impressionnantes", hint: "Modèle de 175 milliards de paramètres qui surprend par sa polyvalence" },
      { year: 2022, text: "Lancement public de ChatGPT", hint: "Démocratisation de l'IA conversationnelle auprès du grand public" },
      { year: 2023, text: "GPT-4 et explosion de l'IA générative", hint: "Nouvelle génération multimodale et avènement de l'IA générative mainstream" }
    ];

    const teamColors = ["#00d2ff", "#3a7bd5", "#00ff88", "#ff6b35", "#ff3838", "#667eea"];
    let teams = [];
    let currentTeamIndex = 0;
    let currentRound = 1;
    const maxRounds = 5;
    let timer = null;
    let timeLeft = 30;
    let roundCards = [];
    let timeline = [];
    let placementEnabled = true;

    function renderTeamsSetup() {
      const teamSetup = document.getElementById('teamSetup');
      teamSetup.innerHTML = '';
      teams.forEach((team, idx) => {
        const availableColors = teamColors.filter(c => !teams.some((t, i) => t.color === c && i !== idx));
        teamSetup.innerHTML += `
          <div class="team-input" data-team-idx="${idx}">
            <h3>Équipe ${idx + 1} ${teams.length > 2 ? `<button class="remove-team-btn" aria-label="Supprimer l'équipe" onclick="removeTeam(${idx})">❌</button>` : ''}</h3>
            <input type="text" placeholder="Nom de l'équipe" value="${team.name}" oninput="teams[${idx}].name=this.value" />
            <div class="color-palette">
              ${availableColors.map(color => `
                <div class="team-color${team.color === color ? ' selected' : ''}" style="background:${color}" onclick="selectColor(${idx}, '${color}')"></div>
              `).join('')}
            </div>
          </div>
        `;
      });
    }

    window.selectColor = function(idx, color) {
      teams[idx].color = color;
      renderTeamsSetup();
    };

    window.removeTeam = function(idx) {
      if (teams.length <= 2) {
        alert("Il doit y avoir au moins 2 équipes.");
        return;
      }
      teams.splice(idx, 1);
      renderTeamsSetup();
    };

    document.getElementById('addTeamBtn').onclick = function() {
      if (teams.length >= 6) {
        alert("Nombre maximum d'équipes atteint (6).");
        return;
      }
      const usedColors = teams.map(t => t.color);
      const newColor = teamColors.find(c => !usedColors.includes(c)) || "#000000";
      teams.push({ name: "", color: newColor, score: 0 });
      renderTeamsSetup();
    };

    document.getElementById('startGameBtn').onclick = function() {
      if (teams.length < 2 || teams.some(t => !t.name.trim())) {
        showMessage("Chaque équipe doit avoir un nom et il faut au moins 2 équipes.", "error");
        return;
      }
      startGame();
    };

    function startGame() {
      currentTeamIndex = 0;
      currentRound = 1;
      teams.forEach(t => t.score = 0);
      document.getElementById('setupScreen').style.display = 'none';
      document.getElementById('gameArea').style.display = '';
      document.getElementById('scoreboard').style.display = '';
      document.getElementById('finalResults').style.display = 'none';
      updateScoreboard();
      startRound();
    }

    function updateScoreboard() {
      const sb = document.getElementById('scoreboard');
      sb.innerHTML = teams.map((team, i) => `
        <div class="team-score${i === currentTeamIndex ? ' active' : ''}" style="border-color:${team.color}">
          <div class="team-name" style="color:${team.color}">${team.name}</div>
          <div class="score">${team.score}</div>
        </div>
      `).join('');
      sb.style.display = '';
    }

    function startRound() {
      roundCards = shuffle(aiEvents).slice(0, 5);
      timeline = [];
      placementEnabled = true;
      updateRoundInfo();
      renderCards();
      renderTimeline();
      hideMessage();
      startTimer();
    }

    function updateRoundInfo() {
      document.getElementById('roundNumber').textContent = `Manche ${currentRound} / ${maxRounds}`;
      document.getElementById('currentTeam').textContent = `À ${teams[currentTeamIndex].name} de jouer !`;
      document.getElementById('timer').textContent = `⏰ 30s`;
    }

    function startTimer() {
      clearInterval(timer);
      timeLeft = 30;
      document.getElementById('timer').textContent = `⏰ ${timeLeft}s`;
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = `⏰ ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          showMessage("⏱️ Temps écoulé !", "error");
          nextTurn();
        }
      }, 1000);
    }

    function renderCards() {
      const cardsGrid = document.getElementById('cardsGrid');
      cardsGrid.innerHTML = roundCards.map((card, i) => `
        <div class="card" draggable="true" data-idx="${i}">${card.text}</div>
      `).join('');
      cardsGrid.querySelectorAll('.card').forEach(card => {
        card.ondragstart = e => {
          e.dataTransfer.setData('text/plain', card.dataset.idx);
          card.classList.add('dragging');
        };
        card.ondragend = () => card.classList.remove('dragging');
      });
      setupTimelineDrop();
      // Indice bouton
      document.getElementById('hintBtn').onclick = function() {
        const hints = roundCards.map((c, i) => `<b>Carte ${i+1}</b> : ${c.hint}`).join('<br>');
        document.getElementById('hint').innerHTML = hints;
        document.getElementById('hint').style.display = 'block';
      };
      document.getElementById('hint').style.display = 'none';
    }

    function renderTimeline() {
      const t = document.getElementById('timelineCards');
      t.innerHTML = timeline.map((card, i) => `
        <div class="timeline-card" data-position="${i + 1}">${card.text}</div>
      `).join('');
    }

    function setupTimelineDrop() {
      const timelineDiv = document.getElementById('timeline');
      timelineDiv.ondragover = e => {
        e.preventDefault();
        timelineDiv.classList.add('drag-over');
      };
      timelineDiv.ondragleave = () => timelineDiv.classList.remove('drag-over');
      timelineDiv.ondrop = e => {
        e.preventDefault();
        timelineDiv.classList.remove('drag-over');
        if (!placementEnabled) return;
        const idx = e.dataTransfer.getData('text/plain');
        placeCard(idx);
      };
    }

    function placeCard(idx) {
      const card = roundCards[idx];
      if (!timeline.includes(card)) {
        timeline.push(card);
        renderTimeline();
        const cardEl = document.querySelector(`.card[data-idx="${idx}"]`);
        if (cardEl) cardEl.classList.add('placed');
        if (timeline.length === roundCards.length) {
          checkTimeline();
        }
      }
    }

    function checkTimeline() {
      placementEnabled = false;
      clearInterval(timer);
      const isCorrect = timeline.every((card, i, arr) => i === 0 || arr[i - 1].year <= card.year);
      if (isCorrect) {
        teams[currentTeamIndex].score++;
        showMessage("✅ Bravo, ordre correct !", "success");
      } else {
        showMessage("❌ Mauvais ordre !", "error");
      }
      updateScoreboard();
      setTimeout(nextTurn, 2000);
    }

    function nextTurn() {
      currentTeamIndex = (currentTeamIndex + 1) % teams.length;
      if (currentTeamIndex === 0) currentRound++;
      if (currentRound > maxRounds) {
        endGame();
      } else {
        startRound();
      }
    }

    function endGame() {
      document.getElementById('gameArea').style.display = 'none';
      document.getElementById('finalResults').style.display = '';
      const maxScore = Math.max(...teams.map(t => t.score));
      const winners = teams.filter(t => t.score === maxScore);
      document.getElementById('winnerText').textContent = winners.length > 1
        ? `Égalité ! Victoire des équipes : ${winners.map(t => t.name).join(', ')}`
        : `Victoire de ${winners[0].name} !`;
      document.getElementById('finalScores').innerHTML = teams.map(team => `
        <div style="margin:8px 0;">
          <span style="color:${team.color};font-weight:700;">${team.name}</span> : ${team.score} point${team.score > 1 ? 's' : ''}
        </div>
      `).join('');
    }

    function resetGame() {
      clearInterval(timer);
      teams = [
        { name: "", color: teamColors[0], score: 0 },
        { name: "", color: teamColors[1], score: 0 }
      ];
      currentTeamIndex = 0;
      currentRound = 1;
      timeline = [];
      roundCards = [];
      placementEnabled = true;
      document.getElementById('setupScreen').style.display = '';
      document.getElementById('gameArea').style.display = 'none';
      document.getElementById('scoreboard').style.display = 'none';
      document.getElementById('finalResults').style.display = 'none';
      renderTeamsSetup();
      hideMessage();
    }

    function skipTurn() {
      clearInterval(timer);
      showMessage("⏭️ Tour passé.", "warning");
      setTimeout(() => {
        hideMessage();
        nextTurn();
      }, 1500);
    }

    function showMessage(msg, type) {
      const m = document.getElementById('message');
      m.textContent = msg;
      m.className = `message ${type}`;
      m.style.display = 'block';
    }
    
    function hideMessage() {
      const m = document.getElementById('message');
      m.textContent = '';
      m.className = 'message';
      m.style.display = 'none';
    }

    function shuffle(arr) {
      return arr.slice().sort(() => Math.random() - 0.5);
    }

    document.getElementById('skipTurnBtn').onclick = skipTurn;
    document.getElementById('resetGameBtn').onclick = resetGame;
    document.getElementById('resetGameBtn2').onclick = resetGame;

    window.onload = function() {
      teams = [
        { name: "", color: teamColors[0], score: 0 },
        { name: "", color: teamColors[1], score: 0 }
      ];
      renderTeamsSetup();
    };
  </script>
</body>
</html>
