<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Timeline IA - Jeu d'équipes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Ton CSS d'origine, inchangé pour garder la belle apparence */
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #f1f5f9;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #1e293b;
      --text-light: #64748b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }
    /* ... (reprends tout le CSS du fichier paste.txt) ... */
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 Timeline IA Challenge</h1>
      <p class="subtitle">Placez les événements de l'intelligence artificielle dans l'ordre chronologique !</p>
    </div>

    <div id="setupScreen" class="setup-screen">
      <h2>⚙️ Configuration du Jeu</h2>
      <div class="team-setup" id="teamSetup"></div>
      <div class="game-controls">
        <button class="btn btn-secondary" id="addTeamBtn">➕ Ajouter une équipe</button>
        <button class="btn btn-primary" id="startGameBtn">🚀 Commencer le jeu</button>
      </div>
    </div>

    <div id="scoreboard" class="scoreboard" style="display:none;"></div>

    <div id="gameArea" class="game-area">
      <div class="round-info">
        <div class="round-number" id="roundNumber"></div>
        <div class="current-team" id="currentTeam"></div>
        <div class="timer" id="timer"></div>
      </div>
      <div class="card-container" id="cardContainer">
        <h3>📚 Cartes à placer :</h3>
        <div class="cards-grid" id="cardsGrid"></div>
        <div style="text-align: center; margin-top: 15px;">
          <button class="hint-button" id="hintBtn">💡 Besoin d'un indice ?</button>
          <div class="hint" id="hint"></div>
        </div>
      </div>
      <div class="timeline" id="timeline">
        <div class="timeline-cards" id="timelineCards"></div>
      </div>
      <div class="message" id="message"></div>
      <div class="game-controls">
        <button class="btn btn-secondary" id="skipTurnBtn">⏭️ Passer le tour</button>
        <button class="btn btn-danger" id="resetGameBtn">🔄 Nouvelle partie</button>
      </div>
    </div>

    <div id="finalResults" class="final-results">
      <div class="winner-announcement" id="winnerText"></div>
      <div id="finalScores"></div>
      <button class="btn btn-primary" id="resetGameBtn2">🔄 Nouvelle partie</button>
    </div>
  </div>

  <script>
    // Données des événements IA avec indices
    const aiEvents = [
      { year: 1943, text: "Warren McCulloch et Walter Pitts créent le premier neurone artificiel", hint: "Première modélisation mathématique d'un neurone, pendant la Seconde Guerre mondiale" },
      { year: 1950, text: "Alan Turing publie « Computing Machinery and Intelligence »", hint: "Introduction du célèbre 'Test de Turing' pour mesurer l'intelligence artificielle" },
      { year: 1956, text: "Conférence de Dartmouth, naissance officielle de l'IA", hint: "Événement fondateur où le terme 'Intelligence Artificielle' est créé" },
      { year: 1957, text: "Création du Perceptron par Frank Rosenblatt", hint: "Premier algorithme d'apprentissage automatique, ancêtre des réseaux de neurones" },
      { year: 1966, text: "ELIZA, premier chatbot créé par Joseph Weizenbaum", hint: "Premier programme capable de simuler une conversation, inspiré de la psychothérapie" },
      { year: 1986, text: "Réseaux de neurones avec rétropropagation", hint: "Révolution dans l'entraînement des réseaux de neurones multicouches" },
      { year: 1997, text: "Deep Blue bat Garry Kasparov aux échecs", hint: "Premier ordinateur à battre un champion du monde d'échecs en titre" },
      { year: 2006, text: "Geoffrey Hinton popularise le deep learning", hint: "Renaissance des réseaux de neurones profonds après des décennies d'oubli" },
      { year: 2011, text: "IBM Watson gagne à Jeopardy!", hint: "Démonstration de traitement du langage naturel dans un jeu télévisé populaire" },
      { year: 2012, text: "Victoire d'AlexNet au concours de reconnaissance d'images, ImageNet", hint: "Percée majeure en vision par ordinateur grâce au deep learning" },
      { year: 2016, text: "AlphaGo bat Lee Sedol au jeu de Go", hint: "Victoire historique dans un jeu considéré comme impossible à maîtriser pour une machine" },
      { year: 2017, text: "Publication de l'architecture Transformer", hint: "Architecture révolutionnaire qui donnera naissance à GPT, BERT et tous les grands modèles actuels" },
      { year: 2018, text: "BERT révolutionne la compréhension du langage des machines", hint: "Premier modèle à vraiment comprendre le contexte bidirectionnel dans les phrases" },
      { year: 2020, text: "GPT-3 démontre des capacités linguistiques impressionnantes", hint: "Modèle de 175 milliards de paramètres qui surprend par sa polyvalence" },
      { year: 2022, text: "Lancement public de ChatGPT", hint: "Démocratisation de l'IA conversationnelle auprès du grand public" },
      { year: 2023, text: "GPT-4 et explosion de l'IA générative", hint: "Nouvelle génération multimodale et avènement de l'IA générative mainstream" }
    ];

    const teamColors = ["#6366f1", "#8b5cf6", "#f59e0b", "#ef4444", "#10b981", "#3b82f6"];
    let teams = [];
    let currentTeamIndex = 0;
    let currentRound = 1;
    const maxRounds = 5;
    let timer = null;
    let timeLeft = 30;
    let roundCards = [];
    let timeline = [];
    let placementEnabled = true;

    function renderTeamsSetup() {
      const teamSetup = document.getElementById('teamSetup');
      teamSetup.innerHTML = '';
      teams.forEach((team, idx) => {
        const availableColors = teamColors.filter(c => !teams.some((t, i) => t.color === c && i !== idx));
        teamSetup.innerHTML += `
          <div class="team-input" data-team-idx="${idx}">
            <h3>Équipe ${idx + 1} ${teams.length > 2 ? `<button class="remove-team-btn" aria-label="Supprimer l'équipe" onclick="removeTeam(${idx})">❌</button>` : ''}</h3>
            <input type="text" placeholder="Nom de l'équipe" value="${team.name}" oninput="teams[${idx}].name=this.value" />
            <div class="color-palette">
              ${availableColors.map(color => `
                <div class="team-color${team.color === color ? ' selected' : ''}" style="background:${color}" onclick="selectColor(${idx}, '${color}')"></div>
              `).join('')}
            </div>
          </div>
        `;
      });
    }

    window.selectColor = function(idx, color) {
      teams[idx].color = color;
      renderTeamsSetup();
    };

    window.removeTeam = function(idx) {
      if (teams.length <= 2) {
        alert("Il doit y avoir au moins 2 équipes.");
        return;
      }
      teams.splice(idx, 1);
      renderTeamsSetup();
    };

    document.getElementById('addTeamBtn').onclick = function() {
      if (teams.length >= 6) {
        alert("Nombre maximum d'équipes atteint (6).");
        return;
      }
      const usedColors = teams.map(t => t.color);
      const newColor = teamColors.find(c => !usedColors.includes(c)) || "#000000";
      teams.push({ name: "", color: newColor, score: 0 });
      renderTeamsSetup();
    };

    document.getElementById('startGameBtn').onclick = function() {
      if (teams.length < 2 || teams.some(t => !t.name.trim())) {
        showMessage("Chaque équipe doit avoir un nom et il faut au moins 2 équipes.", "error");
        return;
      }
      startGame();
    };

    function startGame() {
      currentTeamIndex = 0;
      currentRound = 1;
      teams.forEach(t => t.score = 0);
      document.getElementById('setupScreen').style.display = 'none';
      document.getElementById('gameArea').style.display = '';
      document.getElementById('scoreboard').style.display = '';
      document.getElementById('finalResults').style.display = 'none';
      updateScoreboard();
      startRound();
    }

    function updateScoreboard() {
      const sb = document.getElementById('scoreboard');
      sb.innerHTML = teams.map((team, i) => `
        <div class="team-score${i === currentTeamIndex ? ' active' : ''}" style="border-color:${team.color}">
          <div class="team-name" style="color:${team.color}">${team.name}</div>
          <div class="score">${team.score}</div>
        </div>
      `).join('');
      sb.style.display = '';
    }

    function startRound() {
      roundCards = shuffle(aiEvents).slice(0, 5);
      timeline = [];
      placementEnabled = true;
      updateRoundInfo();
      renderCards();
      renderTimeline();
      hideMessage();
      startTimer();
    }

    function updateRoundInfo() {
      document.getElementById('roundNumber').textContent = `Manche ${currentRound} / ${maxRounds}`;
      document.getElementById('currentTeam').textContent = `À ${teams[currentTeamIndex].name} de jouer !`;
      document.getElementById('timer').textContent = `⏰ 30s`;
    }

    function startTimer() {
      clearInterval(timer);
      timeLeft = 30;
      document.getElementById('timer').textContent = `⏰ ${timeLeft}s`;
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = `⏰ ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          showMessage("⏱️ Temps écoulé !", "error");
          nextTurn();
        }
      }, 1000);
    }

    function renderCards() {
      const cardsGrid = document.getElementById('cardsGrid');
      cardsGrid.innerHTML = roundCards.map((card, i) => `
        <div class="card" draggable="true" data-idx="${i}">${card.text}</div>
      `).join('');
      cardsGrid.querySelectorAll('.card').forEach(card => {
        card.ondragstart = e => {
          e.dataTransfer.setData('text/plain', card.dataset.idx);
          card.classList.add('dragging');
        };
        card.ondragend = () => card.classList.remove('dragging');
      });
      setupTimelineDrop();
      // Indice bouton
      document.getElementById('hintBtn').onclick = function() {
        const hints = roundCards.map((c, i) => `<b>Carte ${i+1}</b> : ${c.hint}`).join('<br>');
        document.getElementById('hint').innerHTML = hints;
        document.getElementById('hint').style.display = 'block';
      };
      document.getElementById('hint').style.display = 'none';
    }

    function renderTimeline() {
      const t = document.getElementById('timelineCards');
      t.innerHTML = timeline.map((card, i) => `
        <div class="timeline-card" data-position="${i + 1}">${card.text}</div>
      `).join('');
    }

    function setupTimelineDrop() {
      const timelineDiv = document.getElementById('timeline');
      timelineDiv.ondragover = e => {
        e.preventDefault();
        timelineDiv.classList.add('drag-over');
      };
      timelineDiv.ondragleave = () => timelineDiv.classList.remove('drag-over');
      timelineDiv.ondrop = e => {
        e.preventDefault();
        timelineDiv.classList.remove('drag-over');
        if (!placementEnabled) return;
        const idx = e.dataTransfer.getData('text/plain');
        placeCard(idx);
      };
    }

    function placeCard(idx) {
      const card = roundCards[idx];
      if (!timeline.includes(card)) {
        timeline.push(card);
        renderTimeline();
        const cardEl = document.querySelector(`.card[data-idx="${idx}"]`);
        if (cardEl) cardEl.classList.add('placed');
        if (timeline.length === roundCards.length) {
          checkTimeline();
        }
      }
    }

    function checkTimeline() {
      placementEnabled = false;
      clearInterval(timer);
      const isCorrect = timeline.every((card, i, arr) => i === 0 || arr[i - 1].year <= card.year);
      if (isCorrect) {
        teams[currentTeamIndex].score++;
        showMessage("✅ Bravo, ordre correct !", "success");
      } else {
        showMessage("❌ Mauvais ordre !", "error");
      }
      updateScoreboard();
      setTimeout(nextTurn, 2000);
    }

    function nextTurn() {
      currentTeamIndex = (currentTeamIndex + 1) % teams.length;
      if (currentTeamIndex === 0) currentRound++;
      if (currentRound > maxRounds) {
        endGame();
      } else {
        startRound();
      }
    }

    function endGame() {
      document.getElementById('gameArea').style.display = 'none';
      document.getElementById('finalResults').style.display = '';
      const maxScore = Math.max(...teams.map(t => t.score));
      const winners = teams.filter(t => t.score === maxScore);
      document.getElementById('winnerText').textContent = winners.length > 1
        ? `Égalité ! Victoire des équipes : ${winners.map(t => t.name).join(', ')}`
        : `Victoire de ${winners[0].name} !`;
      document.getElementById('finalScores').innerHTML = teams.map(team => `
        <div style="margin:8px 0;">
          <span style="color:${team.color};font-weight:700;">${team.name}</span> : ${team.score} point${team.score > 1 ? 's' : ''}
        </div>
      `).join('');
    }

    function resetGame() {
      clearInterval(timer);
      teams = [
        { name: "", color: teamColors[0], score: 0 },
        { name: "", color: teamColors[1], score: 0 }
      ];
      currentTeamIndex = 0;
      currentRound = 1;
      timeline = [];
      roundCards = [];
      placementEnabled = true;
      document.getElementById('setupScreen').style.display = '';
      document.getElementById('gameArea').style.display = 'none';
      document.getElementById('scoreboard').style.display = 'none';
      document.getElementById('finalResults').style.display = 'none';
      renderTeamsSetup();
      hideMessage();
    }

    function skipTurn() {
      clearInterval(timer);
      showMessage("⏭️ Tour passé.", "warning");
      setTimeout(() => {
        hideMessage();
        nextTurn();
      }, 1500);
    }

    function showMessage(msg, type) {
      const m = document.getElementById('message');
      m.textContent = msg;
      m.className = `message ${type}`;
      m.style.display = 'block';
    }
    function hideMessage() {
      const m = document.getElementById('message');
      m.textContent = '';
      m.className = 'message';
      m.style.display = 'none';
    }

    function shuffle(arr) {
      return arr.slice().sort(() => Math.random() - 0.5);
    }

    document.getElementById('skipTurnBtn').onclick = skipTurn;
    document.getElementById('resetGameBtn').onclick = resetGame;
    document.getElementById('resetGameBtn2').onclick = resetGame;

    window.onload = function() {
      teams = [
        { name: "", color: teamColors[0], score: 0 },
        { name: "", color: teamColors[1], score: 0 }
      ];
      renderTeamsSetup();
    };
  </script>
</body>
</html>
