<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Timeline IA - Jeu d'équipes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ... (tout le CSS d'origine, inchangé) ... */
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 Timeline IA Challenge</h1>
      <p class="subtitle">Placez les événements de l'intelligence artificielle dans l'ordre chronologique !</p>
    </div>

    <div id="setupScreen" class="setup-screen">
      <h2>⚙️ Configuration du Jeu</h2>
      <div class="team-setup" id="teamSetup"></div>
      <div class="game-controls">
        <button class="btn btn-secondary" id="addTeamBtn">➕ Ajouter une équipe</button>
        <button class="btn btn-primary" id="startGameBtn">🚀 Commencer le jeu</button>
      </div>
    </div>

    <div id="scoreboard" class="scoreboard" style="display:none;"></div>

    <div id="gameArea" class="game-area" style="display:none;">
      <div class="round-info">
        <div class="round-number" id="roundNumber"></div>
        <div class="current-team" id="currentTeam"></div>
        <div class="timer" id="timer"></div>
      </div>
      <div class="card-container" id="cardContainer">
        <h3>📚 Cartes à placer :</h3>
        <div class="cards-grid" id="cardsGrid"></div>
        <div style="text-align: center; margin-top: 15px;">
          <button class="hint-button" id="hintBtn">💡 Besoin d'un indice ?</button>
          <div class="hint" id="hint"></div>
        </div>
      </div>
      <!-- Ajout de la suite demandée -->
      <div class="timeline" id="timeline">
        <div class="timeline-cards" id="timelineCards">
          <!-- Les cartes placées apparaîtront ici -->
        </div>
      </div>
      <div id="message" class="message" style="display:none;"></div>
      <div class="game-controls">
        <button class="btn btn-primary" id="validateBtn">✅ Valider l'ordre</button>
        <button class="btn btn-secondary" id="nextRoundBtn" style="display:none;">⏭️ Manche suivante</button>
        <button class="btn btn-danger" id="endGameBtn">🏁 Terminer la partie</button>
      </div>
    </div>

    <div id="finalResults" class="final-results">
      <div class="winner-announcement" id="winnerAnnouncement"></div>
      <div id="finalScores"></div>
      <button class="btn btn-primary" id="restartBtn">🔄 Rejouer</button>
    </div>
  </div>
  <script>
    // Ici, tu pourras ajouter la logique JS du jeu
  </script>
</body>
</html>
