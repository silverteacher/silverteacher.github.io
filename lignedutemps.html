<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Timeline IA - Jeu d'équipes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ... [Styles identiques à ta version, voir fichier source] ... */
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 Timeline IA Challenge</h1>
      <p class="subtitle">Placez les événements de l'intelligence artificielle dans l'ordre chronologique !</p>
    </div>
    <div id="setupScreen" class="setup-screen">
      <h2>⚙️ Configuration du Jeu</h2>
      <div class="team-setup" id="teamSetup">
        <!-- Les équipes seront générées dynamiquement -->
      </div>
      <div class="game-controls">
        <button class="btn btn-secondary" id="addTeamBtn">➕ Ajouter une équipe</button>
        <button class="btn btn-primary" id="startGameBtn">🚀 Commencer le jeu</button>
      </div>
    </div>
    <div id="scoreboard" class="scoreboard" style="display:none;"></div>
    <div id="gameArea" class="game-area">
      <div class="round-info">
        <div class="round-number" id="roundNumber"></div>
        <div class="current-team" id="currentTeam"></div>
        <div class="timer" id="timer"></div>
      </div>
      <div class="card-container" id="cardContainer"></div>
      <div class="timeline" id="timeline"></div>
      <div class="message" id="message"></div>
      <div class="game-controls">
        <button class="btn btn-secondary" id="skipTurnBtn">⏭️ Passer le tour</button>
        <button class="btn btn-danger" id="resetGameBtn">🔄 Nouvelle partie</button>
      </div>
    </div>
    <div id="finalResults" class="final-results">
      <div class="winner-announcement" id="winnerText"></div>
      <div id="finalScores"></div>
      <button class="btn btn-primary" id="resetGameBtn2">🔄 Nouvelle partie</button>
    </div>
  </div>
  <script>
    // --- Données des événements IA ---
    const aiEvents = [
      { year: 1943, text: "Warren McCulloch et Walter Pitts créent le premier neurone artificiel" },
      { year: 1950, text: "Alan Turing publie « Computing Machinery and Intelligence »" },
      { year: 1956, text: "Conférence de Dartmouth, naissance officielle de l'IA" },
      { year: 1957, text: "Création du Perceptron par Frank Rosenblatt" },
      { year: 1966, text: "ELIZA, premier chatbot créé par Joseph Weizenbaum" },
      { year: 1986, text: "Réseaux de neurones avec rétropropagation" },
      { year: 1997, text: "Deep Blue bat Garry Kasparov aux échecs" },
      { year: 2006, text: "Geoffrey Hinton popularise le deep learning" },
      { year: 2011, text: "IBM Watson gagne à Jeopardy!" },
      { year: 2012, text: "Victoire d'AlexNet au concours ImageNet" },
      { year: 2016, text: "AlphaGo bat Lee Sedol au jeu de Go" },
      { year: 2017, text: "Publication de l'architecture Transformer" },
      { year: 2018, text: "BERT révolutionne la compréhension du langage" },
      { year: 2020, text: "GPT-3 démontre des capacités linguistiques impressionnantes" },
      { year: 2022, text: "Lancement public de ChatGPT" },
      { year: 2023, text: "GPT-4 et explosion de l'IA générative" }
    ];

    // --- Variables globales ---
    let teams = [];
    let currentTeamIndex = 0;
    let currentRound = 1;
    const maxRounds = 5;
    let timer = null;
    let timeLeft = 30;
    let gameInProgress = false;
    let roundCards = [];
    let timeline = [];
    let placementEnabled = true;
    const maxTeams = 6;
    const teamColors = [
      "#6366f1", "#8b5cf6", "#f59e0b", "#ef4444", "#10b981", "#3b82f6", "#64748b", "#1e293b"
    ];

    // --- Génération dynamique des équipes ---
    function renderTeamInputs() {
      const teamSetup = document.getElementById('teamSetup');
      teamSetup.innerHTML = '';
      teams.forEach((team, idx) => {
        const colorsForTeam = teamColors.filter(color =>
          !teams.some((t, i) => t.color === color && i !== idx)
        );
        teamSetup.innerHTML += `
          <div class="team-input" data-team-idx="${idx}">
            <h3>Équipe ${idx + 1} <button onclick="removeTeam(${idx})" style="float:right;font-size:1.1em;" aria-label="Supprimer l'équipe">❌</button></h3>
            <input type="text" placeholder="Nom de l'équipe" value="${team.name || ''}" oninput="teams[${idx}].name=this.value">
            <div class="color-palette">
              ${colorsForTeam.map(color =>
                `<div class="team-color${team.color === color ? ' selected' : ''}" style="background:${color}" data-color="${color}" data-team="${idx}" tabindex="0" aria-label="Choisir la couleur ${color}" onclick="selectColor(${idx},'${color}')"></div>`
              ).join('')}
            </div>
          </div>
        `;
      });
    }

    // --- Sélection de la couleur ---
    window.selectColor = function(idx, color) {
      teams[idx].color = color;
      renderTeamInputs();
    };

    // --- Ajout et suppression d'équipe ---
    document.getElementById('addTeamBtn').onclick = function() {
      if (teams.length >= maxTeams) {
        alert("Nombre maximum d'équipes atteint (6).");
        return;
      }
      teams.push({ name: '', color: teamColors.find(c => !teams.some(t => t.color === c)), score: 0 });
      renderTeamInputs();
    };
    window.removeTeam = function(idx) {
      teams.splice(idx, 1);
      renderTeamInputs();
    };

    // --- Validation et démarrage du jeu ---
    document.getElementById('startGameBtn').onclick = function() {
      // Validation
      if (teams.length < 2) {
        showMessage("Ajoutez au moins 2 équipes.", "error");
        return;
      }
      for (const team of teams) {
        if (!team.name.trim()) {
          showMessage("Chaque équipe doit avoir un nom.", "error");
          return;
        }
        if (!team.color) {
          showMessage("Chaque équipe doit choisir une couleur.", "error");
          return;
        }
      }
      startGame();
    };

    // --- Initialisation de base ---
    function init() {
      teams = [
        { name: '', color: teamColors[0], score: 0 },
        { name: '', color: teamColors[4], score: 0 }
      ];
      renderTeamInputs();
      document.getElementById('setupScreen').style.display = '';
      document.getElementById('gameArea').style.display = 'none';
      document.getElementById('scoreboard').style.display = 'none';
      document.getElementById('finalResults').style.display = 'none';
      hideMessage();
    }

    // --- Démarrage du jeu ---
    function startGame() {
      gameInProgress = true;
      currentTeamIndex = 0;
      currentRound = 1;
      teams.forEach(t => t.score = 0);
      document.getElementById('setupScreen').style.display = 'none';
      document.getElementById('gameArea').style.display = '';
      document.getElementById('scoreboard').style.display = '';
      document.getElementById('finalResults').style.display = 'none';
      updateScoreboard();
      startRound();
    }

    // --- Round ---
    function startRound() {
      roundCards = shuffle(aiEvents).slice(0, Math.min(5, aiEvents.length));
      timeline = [];
      placementEnabled = true;
      updateRoundInfo();
      renderCards();
      renderTimeline();
      hideMessage();
      startTimer();
    }

    function updateRoundInfo() {
      document.getElementById('roundNumber').textContent = `Manche ${currentRound} / ${maxRounds}`;
      document.getElementById('currentTeam').textContent = `À ${teams[currentTeamIndex].name} de jouer !`;
      document.getElementById('timer').textContent = `⏰ 30s`;
    }

    // --- Timer ---
    function startTimer() {
      clearInterval(timer);
      timeLeft = 30;
      document.getElementById('timer').textContent = `⏰ ${timeLeft}s`;
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = `⏰ ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          showMessage("⏱️ Temps écoulé !", "error");
          nextTurn();
        }
      }, 1000);
    }

    // --- Scoreboard ---
    function updateScoreboard() {
      const sb = document.getElementById('scoreboard');
      sb.innerHTML = teams.map((team, i) =>
        `<div class="team-score${i === currentTeamIndex ? ' active' : ''}" style="border-color:${team.color}">
          <div class="team-name" style="color:${team.color}">${team.name}</div>
          <div class="score">${team.score}</div>
        </div>`
      ).join('');
    }

    // --- Cartes à placer ---
    function renderCards() {
      const cc = document.getElementById('cardContainer');
      cc.innerHTML = roundCards.map((card, i) =>
        `<div class="card" draggable="true" data-idx="${i}" tabindex="0">${card.text}</div>`
      ).join('');
      // Drag & drop
      cc.querySelectorAll('.card').forEach(card => {
        card.ondragstart = e => {
          e.dataTransfer.setData('text/plain', card.dataset.idx);
          card.classList.add('dragging');
        };
        card.ondragend = () => card.classList.remove('dragging');
      });
      setupTimelineDrop();
    }

    // --- Timeline (zone de dépôt) ---
    function renderTimeline() {
      const t = document.getElementById('timeline');
      t.innerHTML = timeline.map((card, i) =>
        `<div class="timeline-card" data-position="${i + 1}" style="background:${teams[currentTeamIndex].color}">${card.text}</div>`
      ).join('');
    }

    function setupTimelineDrop() {
      const timelineDiv = document.getElementById('timeline');
      timelineDiv.ondragover = e => { e.preventDefault(); timelineDiv.classList.add('drag-over'); };
      timelineDiv.ondragleave = () => timelineDiv.classList.remove('drag-over');
      timelineDiv.ondrop = e => {
        e.preventDefault();
        timelineDiv.classList.remove('drag-over');
        if (!placementEnabled) return;
        const idx = e.dataTransfer.getData('text/plain');
        placeCard(idx);
      };
    }

    function placeCard(idx) {
      const card = roundCards[idx];
      if (!timeline.some(c => c === card)) {
        timeline.push(card);
        renderTimeline();
        // Retirer la carte du container
        document.querySelector(`.card[data-idx="${idx}"]`).style.display = 'none';
        if (timeline.length === roundCards.length) {
          checkTimeline();
        }
      }
    }

    // --- Vérification de l'ordre ---
    function checkTimeline() {
      placementEnabled = false;
      clearInterval(timer);
      const isCorrect = timeline.every((card, i, arr) =>
        i === 0 || arr[i - 1].year <= card.year
      );
      if (isCorrect) {
        teams[currentTeamIndex].score += 1;
        showMessage("✅ Bravo, ordre correct !", "success");
      } else {
        showMessage("❌ Mauvais ordre !", "error");
      }
      updateScoreboard();
      setTimeout(nextTurn, 2000);
    }

    // --- Passage au tour suivant ---
    function nextTurn() {
      currentTeamIndex = (currentTeamIndex + 1) % teams.length;
      if (currentTeamIndex === 0) currentRound++;
      if (currentRound > maxRounds) {
        endGame();
      } else {
        startRound();
      }
    }

    // --- Fin de partie ---
    function endGame() {
      gameInProgress = false;
      document.getElementById('gameArea').style.display = 'none';
      document.getElementById('finalResults').style.display = '';
      const maxScore = Math.max(...teams.map(t => t.score));
      const winners = teams.filter(t => t.score === maxScore);
      document.getElementById('winnerText').textContent =
        winners.length > 1
          ? `Égalité ! Victoire des équipes : ${winners.map(t => t.name).join(', ')}`
          : `Victoire de ${winners[0].name} !`;
      document.getElementById('finalScores').innerHTML = teams.map(team =>
        `<div style="margin:8px 0;"><span style="color:${team.color};font-weight:700;">${team.name}</span> : ${team.score} point${team.score > 1 ? 's' : ''}</div>`
      ).join('');
    }

    // --- Réinitialisation ---
    function resetGame() {
      clearInterval(timer);
      init();
    }
    document.getElementById('resetGameBtn').onclick = resetGame;
    document.getElementById('resetGameBtn2').onclick = resetGame;
    document.getElementById('skipTurnBtn').onclick = nextTurn;

    // --- Messages utilisateur ---
    function showMessage(msg, type) {
      const m = document.getElementById('message');
      m.textContent = msg;
      m.className = `message ${type}`;
      m.style.display = '';
    }
    function hideMessage() {
      const m = document.getElementById('message');
      m.textContent = '';
      m.className = 'message';
      m.style.display = 'none';
    }

    // --- Utilitaires ---
    function shuffle(arr) {
      return arr.slice().sort(() => Math.random() - 0.5);
    }

    // --- Initialisation au chargement ---
    window.onload = init;
  </script>
</body>
</html>
