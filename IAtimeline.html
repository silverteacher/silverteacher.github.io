<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline IA - Jeu Numérique</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .title {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 15px 20px;
            border-radius: 15px;
            color: white;
        }
        
        .timeline {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            min-height: 120px;
            padding: 20px;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .card {
            width: 280px;
            height: 180px;
            background: white;
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        .card.selected {
            border-color: #ff6b6b;
            transform: scale(1.05);
        }
        
        .card.placed {
            border-color: #51cf66;
            cursor: default;
        }
        
        .card.correct-placement {
            animation: correctPlacement 0.8s ease-in-out;
        }
        
        .card.error {
            border-color: #ff6b6b;
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        @keyframes correctPlacement {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); border-color: #ffd700; }
            100% { transform: scale(1); border-color: #51cf66; }
        }
        
        .card-date {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .card-hidden-date {
            background: #ccc;
            color: #666;
            text-align: center;
        }
        
        .card-event {
            font-size: 1.1em;
            color: #333;
            line-height: 1.3;
            font-weight: 600;
            text-align: center;
            margin: 10px 0;
        }
        
        .card-detail {
            font-size: 0.85em;
            color: #777;
            font-style: italic;
            text-align: center;
            margin-top: 8px;
        }
        
        .player-hand {
            margin-bottom: 30px;
        }
        
        .player-hand h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.3em;
        }
        
        .hand-cards {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn.reveal-btn {
            background: linear-gradient(135deg, #ff9a56 0%, #ff6b6b 100%);
        }
        
        .placement-buttons {
            display: none;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .placement-btn {
            padding: 8px 16px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }
        
        .placement-btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }
        
        .game-message {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            display: none;
            white-space: pre-line;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error-msg {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            animation: confetti-fall 3s linear infinite;
            z-index: 1000;
            pointer-events: none;
        }
        
        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        @media (max-width: 768px) {
            .card {
                width: 260px;
                height: 160px;
                padding: 15px;
            }
            
            .title {
                font-size: 2em;
            }
            
            .game-info {
                flex-direction: column;
                gap: 10px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 class="title">Timeline IA</h1>
            <p class="subtitle">Histoire de l'Intelligence Artificielle</p>
        </div>
        
        <div class="game-info">
            <div>Cartes restantes: <span id="cards-remaining">4</span></div>
            <div>Score: <span id="score">0</span>/4</div>
            <div>Précision: <span id="accuracy">0%</span></div>
        </div>
        
        <div class="game-message" id="game-message"></div>
        
        <div class="timeline" id="timeline">
            <p style="color: #666; text-align: center; width: 100%;">La timeline apparaîtra ici</p>
        </div>
        
        <div class="placement-buttons" id="placement-buttons">
        </div>
        
        <div class="player-hand">
            <h3>Vos cartes</h3>
            <div class="hand-cards" id="hand-cards">
            </div>
        </div>
        
        <div class="controls">
            <button class="btn" id="new-game-btn">Nouvelle Partie</button>
            <button class="btn" id="rules-btn">Règles</button>
            <button class="btn reveal-btn" id="reveal-btn" disabled>Révéler Solution</button>
        </div>
    </div>

    <script>
        var cards = [
            { id: 1, year: 1842, event: "Premier algorithme", detail: "Ada Lovelace - Machine analytique" },
            { id: 2, year: 1920, event: "Terme 'Robot'", detail: "Karel Capek dans R.U.R." },
            { id: 3, year: 1943, event: "Premiers neurones artificiels", detail: "McCulloch et Pitts" },
            { id: 4, year: 1950, event: "Test de Turing", detail: "Alan Turing - Intelligence machine" },
            { id: 5, year: 1956, event: "Naissance de l'IA", detail: "Conférence de Dartmouth" },
            { id: 6, year: 1958, event: "Perceptron", detail: "Frank Rosenblatt - Premier réseau" },
            { id: 7, year: 1961, event: "Premier robot industriel", detail: "Unimate - General Motors" },
            { id: 8, year: 1966, event: "ELIZA", detail: "Joseph Weizenbaum - Premier chatbot" },
            { id: 9, year: 1969, event: "Shakey le robot", detail: "Premier robot mobile intelligent" },
            { id: 10, year: 1972, event: "MYCIN", detail: "Système expert médical" },
            { id: 11, year: 1979, event: "Premier véhicule autonome", detail: "Stanford Cart" },
            { id: 12, year: 1986, event: "Rétropropagation", detail: "Rumelhart - Apprentissage profond" },
            { id: 13, year: 1988, event: "Reconnaissance vocale", detail: "Dragon NaturallySpeaking" },
            { id: 14, year: 1997, event: "Deep Blue bat Kasparov", detail: "IBM - Échecs" },
            { id: 15, year: 2002, event: "Roomba", detail: "iRobot - Robot aspirateur" },
            { id: 16, year: 2005, event: "Stanley DARPA", detail: "Voiture autonome dans le désert" },
            { id: 17, year: 2011, event: "Watson gagne Jeopardy", detail: "IBM bat les champions" },
            { id: 18, year: 2011, event: "Siri", detail: "Apple - Assistant vocal" },
            { id: 19, year: 2012, event: "AlexNet", detail: "CNN révolutionne vision" },
            { id: 20, year: 2014, event: "Alexa", detail: "Amazon Echo" },
            { id: 21, year: 2016, event: "AlphaGo bat le champion", detail: "DeepMind - Jeu de Go" },
            { id: 22, year: 2017, event: "Transformers", detail: "Attention is All You Need" },
            { id: 23, year: 2018, event: "GPT-1", detail: "OpenAI - Génération de texte" },
            { id: 24, year: 2020, event: "GPT-3", detail: "175 milliards de paramètres" },
            { id: 25, year: 2022, event: "ChatGPT", detail: "IA conversationnelle grand public" },
            { id: 26, year: 2023, event: "GPT-4", detail: "IA multimodale" }
        ];

        var gameState = {
            timeline: [],
            playerHand: [],
            selectedCard: null,
            score: 0,
            totalAttempts: 0,
            gameStarted: false,
            allCards: []
        };

        function shuffleArray(array) {
            var newArray = array.slice();
            for (var i = newArray.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = newArray[i];
                newArray[i] = newArray[j];
                newArray[j] = temp;
            }
            return newArray;
        }

        function startGame() {
            var shuffledCards = shuffleArray(cards);
            
            gameState.timeline = [shuffledCards[0]];
            gameState.playerHand = shuffledCards.slice(1, 5);
            gameState.allCards = gameState.timeline.concat(gameState.playerHand);
            gameState.selectedCard = null;
            gameState.score = 0;
            gameState.totalAttempts = 0;
            gameState.gameStarted = true;
            
            document.getElementById('reveal-btn').disabled = false;
            updateDisplay();
            showMessage("Partie commencée ! Sélectionnez une carte et choisissez où la placer.", "info");
        }

        function createCardElement(card, showDate, isSelectable) {
            var cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.setAttribute('data-card-id', card.id);
            
            if (isSelectable) {
                cardEl.onclick = function() { selectCard(card); };
            }
            
            var dateClass = showDate ? '' : 'card-hidden-date';
            var dateText = showDate ? card.year : '????';
            
            cardEl.innerHTML = 
                '<div class="card-date ' + dateClass + '">' + dateText + '</div>' +
                '<div class="card-event">' + card.event + '</div>' +
                '<div class="card-detail">' + card.detail + '</div>';
            
            return cardEl;
        }

        function selectCard(card) {
            if (!gameState.gameStarted) return;
            
            gameState.selectedCard = card;
            updateHandDisplay();
            showPlacementButtons();
            showMessage("Carte sélectionnée ! Choisissez où la placer dans la timeline.", "info");
        }

        function showPlacementButtons() {
            var buttonsContainer = document.getElementById('placement-buttons');
            buttonsContainer.innerHTML = '';
            buttonsContainer.style.display = 'flex';
            
            var beforeBtn = document.createElement('button');
            beforeBtn.className = 'placement-btn';
            beforeBtn.textContent = 'Placer au début';
            beforeBtn.onclick = function() { placeCard(0); };
            buttonsContainer.appendChild(beforeBtn);
            
            for (var i = 0; i < gameState.timeline.length; i++) {
                var afterBtn = document.createElement('button');
                afterBtn.className = 'placement-btn';
                afterBtn.textContent = 'Placer après ' + gameState.timeline[i].year;
                afterBtn.onclick = (function(pos) {
                    return function() { placeCard(pos); };
                })(i + 1);
                buttonsContainer.appendChild(afterBtn);
            }
        }

        function createConfetti() {
            var colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7', '#dda0dd', '#98fb98'];
            var confettiCount = 50;
            
            for (var i = 0; i < confettiCount; i++) {
                var confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(confetti);
                
                setTimeout(function(conf) {
                    return function() {
                        if (conf.parentNode) {
                            conf.parentNode.removeChild(conf);
                        }
                    };
                }(confetti), 5000);
            }
        }

        function placeCard(position) {
            if (!gameState.selectedCard) return;
            
            var card = gameState.selectedCard;
            var correctPosition = findCorrectPosition(card);
            gameState.totalAttempts++;
            
            if (position === correctPosition) {
                gameState.timeline.splice(position, 0, card);
                gameState.playerHand = gameState.playerHand.filter(function(c) { return c.id !== card.id; });
                gameState.score++;
                
                setTimeout(function() {
                    var placedCard = document.querySelector('[data-card-id="' + card.id + '"]');
                    if (placedCard) {
                        placedCard.classList.add('correct-placement');
                    }
                    createConfetti();
                }, 100);
                
                showMessage("Excellent ! Carte bien placée ! 🎉", "success");
                
                if (gameState.playerHand.length === 0) {
                    var accuracy = Math.round((gameState.score / gameState.totalAttempts) * 100);
                    showMessage("🏆 Félicitations ! Vous avez terminé !\nScore: " + gameState.score + "/4\nPrécision: " + accuracy + "%", "success");
                    gameState.gameStarted = false;
                    document.getElementById('reveal-btn').disabled = true;
                    createConfetti();
                    setTimeout(function() { createConfetti(); }, 1000);
                    setTimeout(function() { createConfetti(); }, 2000);
                }
            } else {
                showMessage("❌ Incorrect ! Cette invention date de " + card.year + ".\nEssayez de la replacer !", "error-msg");
                
                var cardEl = document.querySelector('[data-card-id="' + card.id + '"]');
                if (cardEl) {
                    cardEl.classList.add('error');
                    setTimeout(function() { cardEl.classList.remove('error'); }, 500);
                }
            }
            
            gameState.selectedCard = null;
            document.getElementById('placement-buttons').style.display = 'none';
            updateDisplay();
        }

        function findCorrectPosition(card) {
            for (var i = 0; i <= gameState.timeline.length; i++) {
                if (i === 0 && card.year <= gameState.timeline[0].year) {
                    return 0;
                } else if (i === gameState.timeline.length && card.year >= gameState.timeline[i-1].year) {
                    return i;
                } else if (i > 0 && i < gameState.timeline.length && 
                          card.year >= gameState.timeline[i-1].year && 
                          card.year <= gameState.timeline[i].year) {
                    return i;
                }
            }
            return gameState.timeline.length;
        }

        function revealSolution() {
            if (!gameState.gameStarted || gameState.playerHand.length === 0) return;
            
            var allCardsSorted = gameState.allCards.slice().sort(function(a, b) { return a.year - b.year; });
            
            var solutionText = "🔍 SOLUTION COMPLÈTE :\n\n";
            for (var i = 0; i < allCardsSorted.length; i++) {
                var card = allCardsSorted[i];
                var isPlaced = gameState.timeline.some(function(c) { return c.id === card.id; });
                var isInHand = gameState.playerHand.some(function(c) { return c.id === card.id; });
                var status = isPlaced ? "✅" : (isInHand ? "🔄" : "");
                solutionText += (i + 1) + ". " + card.year + " - " + card.event + " " + status + "\n";
            }
            
            solutionText += "\n✅ = Déjà placé\n🔄 = Dans votre main";
            
            showMessage(solutionText, "info");
        }

        function updateDisplay() {
            updateTimelineDisplay();
            updateHandDisplay();
            updateGameInfo();
        }

        function updateTimelineDisplay() {
            var timeline = document.getElementById('timeline');
            timeline.innerHTML = '';
            
            if (gameState.timeline.length === 0) {
                timeline.innerHTML = '<p style="color: #666; text-align: center; width: 100%;">La timeline apparaîtra ici</p>';
                return;
            }
            
            for (var i = 0; i < gameState.timeline.length; i++) {
                var card = gameState.timeline[i];
                var cardEl = createCardElement(card, true, false);
                cardEl.classList.add('placed');
                timeline.appendChild(cardEl);
            }
        }

        function updateHandDisplay() {
            var handCards = document.getElementById('hand-cards');
            handCards.innerHTML = '';
            
            for (var i = 0; i < gameState.playerHand.length; i++) {
                var card = gameState.playerHand[i];
                var cardEl = createCardElement(card, false, true);
                if (gameState.selectedCard && gameState.selectedCard.id === card.id) {
                    cardEl.classList.add('selected');
                }
                handCards.appendChild(cardEl);
            }
        }

        function updateGameInfo() {
            document.getElementById('cards-remaining').textContent = gameState.playerHand.length;
            document.getElementById('score').textContent = gameState.score + "/4";
            var accuracy = gameState.totalAttempts > 0 ? Math.round((gameState.score / gameState.totalAttempts) * 100) : 0;
            document.getElementById('accuracy').textContent = accuracy + "%";
        }

        function showMessage(message, type) {
            var messageEl = document.getElementById('game-message');
            messageEl.textContent = message;
            messageEl.className = 'game-message ' + type;
            messageEl.style.display = 'block';
            
            var timeout = (type === 'info' && (message.indexOf('RÈGLES') !== -1 || message.indexOf('SOLUTION') !== -1)) ? 10000 : 4000;
            
            setTimeout(function() {
                messageEl.style.display = 'none';
            }, timeout);
        }

        function showRules() {
            var rulesText = "🎯 RÈGLES DU JEU TIMELINE IA\n\n" +
                "OBJECTIF : Placer vos 4 cartes dans l'ordre chronologique correct\n\n" +
                "DÉROULEMENT :\n" +
                "1. Une carte repère est placée au centre avec sa date visible\n" +
                "2. Vous avez 4 cartes en main (dates cachées)\n" +
                "3. Sélectionnez une carte et choisissez où la placer\n" +
                "4. Si c'est correct : confetti ! La carte reste placée\n" +
                "5. Si c'est incorrect : réessayez de placer la même carte\n\n" +
                "FONCTIONNALITÉS :\n" +
                "• Bouton \"Révéler Solution\" pour voir toutes les dates\n" +
                "• Animation confetti pour les bonnes réponses\n" +
                "• Score de précision calculé\n\n" +
                "VICTOIRE : Placez toutes vos cartes correctement !\n\n" +
                "💡 ASTUCE : Utilisez vos connaissances en histoire de l'IA !";
            
            showMessage(rulesText, "info");
        }

        // Event listeners
        document.getElementById('new-game-btn').addEventListener('click', startGame);
        document.getElementById('rules-btn').addEventListener('click', showRules);
        document.getElementById('reveal-btn').addEventListener('click', revealSolution);

        // Initialiser l'affichage
        updateDisplay();
    </script>
</body>
</html>
