<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Timeline IA - Mode Prof</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #7e90f4 0%, #c18af0 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 10px;
      text-shadow: 1px 1px 2px #000;
    }

    .instructions {
      text-align: center;
      margin-bottom: 20px;
      max-width: 700px;
    }

    .buttons, .timeline {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }

    .card {
      background: #fff;
      color: #333;
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      cursor: grab;
      width: 160px;
      text-align: center;
      font-size: 0.9rem;
      transition: transform 0.2s;
    }

    .card.dragging {
      opacity: 0.5;
      transform: scale(1.05);
    }

    .card.placed {
      background: #d0f5e6;
      color: #2b7a4b;
      cursor: default;
    }

    .card.error {
      background: #fbdcdc;
      color: #a33;
    }
  </style>
</head>
<body>
  <h1>Timeline IA - Mode Prof</h1>
  <div class="instructions">Glissez les étapes de l'évolution de l'IA dans l'ordre chronologique ci-dessous.</div>

  <div class="buttons" id="cards">
    <div class="card" draggable="true" data-year="1950">Test de Turing (1950)</div>
    <div class="card" draggable="true" data-year="2022">ChatGPT (2022)</div>
    <div class="card" draggable="true" data-year="2012">Réseaux neuronaux profonds (2012)</div>
    <div class="card" draggable="true" data-year="1997">Victoire de Deep Blue (1997)</div>
  </div>

  <div class="timeline" id="timeline">
    <!-- les cartes seront placées ici -->
  </div>

  <script>
    const cards = document.querySelectorAll('.card');
    const timeline = document.getElementById('timeline');

    cards.forEach(card => {
      card.addEventListener('dragstart', () => {
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
      });
    });

    timeline.addEventListener('dragover', e => {
      e.preventDefault();
      const dragging = document.querySelector('.dragging');
      if (dragging && !timeline.contains(dragging)) {
        timeline.appendChild(dragging);
        checkOrder();
      }
    });

    function checkOrder() {
      const placedCards = Array.from(timeline.children);
      let isCorrect = true;

      for (let i = 1; i < placedCards.length; i++) {
        const prevYear = parseInt(placedCards[i - 1].dataset.year);
        const currYear = parseInt(placedCards[i].dataset.year);
        if (prevYear > currYear) {
          isCorrect = false;
        }
      }

      placedCards.forEach(card => {
        card.classList.remove('error', 'placed');
        if (isCorrect) {
          card.classList.add('placed');
        } else {
          card.classList.add('error');
        }
      });
    }
  </script>
</body>
</html>
