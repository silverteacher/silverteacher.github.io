<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline IA - Jeu Numérique</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .title {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 15px 20px;
            border-radius: 15px;
            color: white;
        }
        
        .timeline {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            min-height: 120px;
            padding: 20px;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .card {
            width: 280px;
            height: 180px;
            background: white;
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        .card.selected {
            border-color: #ff6b6b;
            transform: scale(1.05);
        }
        
        .card.placed {
            border-color: #51cf66;
            cursor: default;
        }
        
        .card.error {
            border-color: #ff6b6b;
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .card-date {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .card-hidden-date {
            background: #ccc;
            color: transparent;
        }
        
        .card-event {
            font-size: 1.1em;
            color: #333;
            line-height: 1.3;
            font-weight: 600;
            text-align: center;
            margin: 10px 0;
        }
        
        .player-hand {
            margin-bottom: 30px;
        }
        
        .player-hand h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.3em;
        }
        
        .hand-cards {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .placement-buttons {
            display: none;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        
        .placement-btn {
            padding: 8px 16px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }
        
        .placement-btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }
        
        .game-message {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            display: none;
            white-space: pre-line;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error-msg {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .drop-zone {
            min-height: 20px;
            width: 20px;
            background: rgba(255, 107, 107, 0.3);
            border: 2px dashed #ff6b6b;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #ff6b6b;
            transition: all 0.3s ease;
        }
        
        .drop-zone.active {
            display: flex;
            background: rgba(255, 107, 107, 0.5);
        }
        
        @media (max-width: 768px) {
            .card {
                width: 260px;
                height: 160px;
                padding: 15px;
            }
            
            .title {
                font-size: 2em;
            }
            
            .game-info {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 class="title">Timeline IA</h1>
            <p class="subtitle">Histoire de l'Intelligence Artificielle</p>
        </div>
        
        <div class="game-info">
            <div>Joueur: <span id="current-player">1</span></div>
            <div>Cartes restantes: <span id="cards-remaining">3</span></div>
            <div>Score: <span id="score">0</span></div>
        </div>
        
        <div class="game-message" id="game-message"></div>
        
        <div class="timeline" id="timeline">
            <!-- La timeline sera remplie dynamiquement -->
        </div>
        
        <div class="placement-buttons" id="placement-buttons">
            <!-- Les boutons de placement seront ajoutés dynamiquement -->
        </div>
        
        <div class="player-hand">
            <h3>Vos cartes</h3>
            <div class="hand-cards" id="hand-cards">
                <!-- Les cartes du joueur seront ajoutées ici -->
            </div>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="startGame()">Nouvelle Partie</button>
            <button class="btn" onclick="showRules()">Règles</button>
        </div>
    </div>

    <script>
        const cards = [
            { id: 1, year: 1837, event: "Premier programme informatique", detail: "Ada Lovelace" },
            { id: 2, year: 1921, event: "Création du mot 'robot'", detail: "Karel Čapek" },
            { id: 3, year: 1939, event: "Machine de Turing", detail: "Concept d'algorithme" },
            { id: 4, year: 1945, event: "Premier ordinateur électronique", detail: "ENIAC" },
            { id: 5, year: 1950, event: "Test de Turing", detail: "Intelligence des machines" },
            { id: 6, year: 1953, event: "Premier réseau de neurones", detail: "Apprentissage artificiel" },
            { id: 7, year: 1955, event: "Terme 'Intelligence Artificielle'", detail: "Naissance officielle" },
            { id: 8, year: 1957, event: "Traduction automatique", detail: "Première démonstration" },
            { id: 9, year: 1964, event: "Chatbot ELIZA", detail: "Joseph Weizenbaum" },
            { id: 10, year: 1975, event: "1er hiver de l'IA", detail: "Ralentissement recherche" },
            { id: 11, year: 1987, event: "Chatbot psychothérapeute", detail: "IA conversationnelle" },
            { id: 12, year: 1988, event: "NetTalk", detail: "Ordinateur avec voix" },
            { id: 13, year: 1990, event: "2e hiver de l'IA", detail: "Nouvelle crise" },
            { id: 14, year: 1996, event: "Deep Blue vs Kasparov", detail: "IA bat champion échecs" },
            { id: 15, year: 2001, event: "Robot Roomba", detail: "Premier robot autonome" },
            { id: 16, year: 2002, event: "Robot Kismet", detail: "Émotions artificielles" },
            { id: 17, year: 2008, event: "Deep Learning", detail: "Reconnaissance d'images" },
            { id: 18, year: 2012, event: "Siri", detail: "Reconnaissance vocale" },
            { id: 19, year: 2017, event: "Robot Sophia", detail: "Première citoyenneté" },
            { id: 20, year: 2017, event: "Deepfakes", detail: "Vidéos IA réalistes" },
            { id: 21, year: 2024, event: "Voitures autonomes", detail: "Premières annonces" },
            { id: 22, year: 2024, event: "IA génératives", detail: "Accès grand public" },
            { id: 23, year: 2024, event: "IA multimodales", detail: "Image, son, texte, vidéo" }
        ];

        let gameState = {
            timeline: [],
            playerHand: [],
            selectedCard: null,
            score: 0,
            gameStarted: false
        };

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function startGame() {
            const shuffledCards = shuffleArray(cards);
            
            // Première carte repère
            gameState.timeline = [shuffledCards[0]];
            gameState.playerHand = shuffledCards.slice(1, 4);
            gameState.selectedCard = null;
            gameState.score = 0;
            gameState.gameStarted = true;
            
            updateDisplay();
            showMessage("Partie commencée ! Sélectionnez une carte et choisissez où la placer.", "info");
        }

        function createCardElement(card, showDate = true, isSelectable = true) {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.dataset.cardId = card.id;
            
            if (isSelectable) {
                cardEl.onclick = () => selectCard(card);
            }
            
            cardEl.innerHTML = `
                <div class="card-date ${!showDate ? 'card-hidden-date' : ''}">${showDate ? card.year : '????'}</div>
                <div class="card-event">${card.event}</div>
                <div style="font-size: 0.85em; color: #777; font-style: italic; text-align: center; margin-top: 8px;">${card.detail}</div>
            `;
            
            return cardEl;
        }

        function selectCard(card) {
            if (!gameState.gameStarted) return;
            
            gameState.selectedCard = card;
            updateHandDisplay();
            showPlacementButtons();
            showMessage("Carte sélectionnée ! Choisissez où la placer dans la timeline.", "info");
        }

        function showPlacementButtons() {
            const buttonsContainer = document.getElementById('placement-buttons');
            buttonsContainer.innerHTML = '';
            buttonsContainer.style.display = 'flex';
            
            // Bouton "Avant" pour placer avant le premier élément
            const beforeBtn = document.createElement('button');
            beforeBtn.className = 'placement-btn';
            beforeBtn.textContent = 'Placer au début';
            beforeBtn.onclick = () => placeCard(0);
            buttonsContainer.appendChild(beforeBtn);
            
            // Boutons pour placer entre les cartes
            for (let i = 0; i < gameState.timeline.length; i++) {
                const afterBtn = document.createElement('button');
                afterBtn.className = 'placement-btn';
                afterBtn.textContent = `Placer après ${gameState.timeline[i].year}`;
                afterBtn.onclick = () => placeCard(i + 1);
                buttonsContainer.appendChild(afterBtn);
            }
        }

        function placeCard(position) {
            if (!gameState.selectedCard) return;
            
            const card = gameState.selectedCard;
            const correctPosition = findCorrectPosition(card);
            
            if (position === correctPosition) {
                // Placement correct
                gameState.timeline.splice(position, 0, card);
                gameState.playerHand = gameState.playerHand.filter(c => c.id !== card.id);
                gameState.score++;
                
                showMessage("Excellent ! Carte bien placée !", "success");
                
                // Vérifier si le joueur a gagné
                if (gameState.playerHand.length === 0) {
                    showMessage(`Félicitations ! Vous avez terminé avec un score de ${gameState.score} !`, "success");
                    gameState.gameStarted = false;
                }
            } else {
                // Placement incorrect
                showMessage(`Incorrect ! Cette carte datait de ${card.year}. Nouvelle carte piochée.`, "error-msg");
                
                // Retirer la carte incorrecte et en donner une nouvelle
                gameState.playerHand = gameState.playerHand.filter(c => c.id !== card.id);
                const remainingCards = cards.filter(c => 
                    !gameState.timeline.some(tc => tc.id === c.id) && 
                    !gameState.playerHand.some(hc => hc.id === c.id)
                );
                
                if (remainingCards.length > 0) {
                    const newCard = remainingCards[Math.floor(Math.random() * remainingCards.length)];
                    gameState.playerHand.push(newCard);
                }
            }
            
            gameState.selectedCard = null;
            document.getElementById('placement-buttons').style.display = 'none';
            updateDisplay();
        }

        function findCorrectPosition(card) {
            for (let i = 0; i <= gameState.timeline.length; i++) {
                if (i === 0 && card.year <= gameState.timeline[0].year) {
                    return 0;
                } else if (i === gameState.timeline.length && card.year >= gameState.timeline[i-1].year) {
                    return i;
                } else if (i > 0 && i < gameState.timeline.length && 
                          card.year >= gameState.timeline[i-1].year && 
                          card.year <= gameState.timeline[i].year) {
                    return i;
                }
            }
            return gameState.timeline.length;
        }

        function updateDisplay() {
            updateTimelineDisplay();
            updateHandDisplay();
            updateGameInfo();
        }

        function updateTimelineDisplay() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';
            
            if (gameState.timeline.length === 0) {
                timeline.innerHTML = '<p style="color: #666; text-align: center; width: 100%;">La timeline apparaîtra ici</p>';
                return;
            }
            
            gameState.timeline.forEach(card => {
                const cardEl = createCardElement(card, true, false);
                cardEl.classList.add('placed');
                timeline.appendChild(cardEl);
            });
        }

        function updateHandDisplay() {
            const handCards = document.getElementById('hand-cards');
            handCards.innerHTML = '';
            
            gameState.playerHand.forEach(card => {
                const cardEl = createCardElement(card, false, true);
                if (gameState.selectedCard && gameState.selectedCard.id === card.id) {
                    cardEl.classList.add('selected');
                }
                handCards.appendChild(cardEl);
            });
        }

        function updateGameInfo() {
            document.getElementById('cards-remaining').textContent = gameState.playerHand.length;
            document.getElementById('score').textContent = gameState.score;
        }

        function showMessage(message, type) {
            const messageEl = document.getElementById('game-message');
            messageEl.textContent = message;
            messageEl.className = `game-message ${type}`;
            messageEl.style.display = 'block';
            
            // Pour les règles, on garde le message plus longtemps
            const timeout = type === 'info' && message.includes('RÈGLES') ? 15000 : 4000;
            
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, timeout);
        }

        function showRules() {
            const rulesText = `RÈGLES DU JEU TIMELINE IA

OBJECTIF : Placer toutes vos cartes dans l'ordre chronologique correct

DÉROULEMENT :
1. Une carte repère est placée au centre avec sa date visible
2. Vous avez 3 cartes en main (dates cachées)
3. Sélectionnez une carte et choisissez où la placer
4. Si c'est correct, la carte reste et vous marquez un point
5. Si c'est incorrect, vous piochez une nouvelle carte

VICTOIRE : Placez toutes vos cartes correctement !

ASTUCE : Utilisez vos connaissances en histoire de l'IA pour deviner les bonnes périodes.`;
            
            showMessage(rulesText, "info");
        }

        // Initialiser l'affichage
        updateDisplay();
    </script>
</body>
</html>
