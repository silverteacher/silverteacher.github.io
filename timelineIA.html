<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline de l'Intelligence Artificielle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
            position: relative;
        }

        .header::before {
            content: '🤖';
            font-size: 4em;
            position: absolute;
            top: 20px;
            right: 40px;
            opacity: 0.3;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .mode-toggle {
            display: flex;
            justify-content: center;
            padding: 30px;
            background: #f8f9fa;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 220px;
            height: 50px;
            background: #e0e0e0;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid #ddd;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 25px;
            transition: .4s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-weight: bold;
            font-size: 14px;
            color: #666;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 40px;
            width: 100px;
            left: 4px;
            bottom: 4px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 20px;
            transition: .4s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        input:checked + .slider {
            background: linear-gradient(45deg, #f093fb, #f5576c);
            color: white;
        }

        input:checked + .slider:before {
            transform: translateX(106px);
            background: linear-gradient(45deg, #f5576c, #f093fb);
        }

        .timeline {
            padding: 40px;
            position: relative;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, #667eea, #764ba2, #f093fb, #f5576c);
            transform: translateX(-50%);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 50px;
            width: 50%;
            opacity: 0;
            transform: translateY(50px);
            animation: fadeInUp 0.8s ease forwards;
        }

        .timeline-item:nth-child(odd) {
            left: 0;
            padding-right: 40px;
            text-align: right;
        }

        .timeline-item:nth-child(even) {
            left: 50%;
            padding-left: 40px;
            text-align: left;
        }

        .timeline-item:nth-child(1) { animation-delay: 0.1s; }
        .timeline-item:nth-child(2) { animation-delay: 0.2s; }
        .timeline-item:nth-child(3) { animation-delay: 0.3s; }
        .timeline-item:nth-child(4) { animation-delay: 0.4s; }
        .timeline-item:nth-child(5) { animation-delay: 0.5s; }
        .timeline-item:nth-child(6) { animation-delay: 0.6s; }
        .timeline-item:nth-child(7) { animation-delay: 0.7s; }
        .timeline-item:nth-child(8) { animation-delay: 0.8s; }

        .timeline-marker {
            position: absolute;
            top: 20px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: 4px solid white;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
            z-index: 10;
        }

        .timeline-item:nth-child(odd) .timeline-marker {
            right: -50px;
        }

        .timeline-item:nth-child(even) .timeline-marker {
            left: -50px;
        }

        .timeline-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .timeline-content:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .timeline-item:nth-child(even) .timeline-content {
            border-left: none;
            border-right: 5px solid #764ba2;
        }

        .year {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .year-icon {
            margin-left: 10px;
            font-size: 0.8em;
        }

        .timeline-item:nth-child(odd) .year {
            justify-content: flex-end;
        }

        .timeline-item:nth-child(odd) .year-icon {
            margin-left: 0;
            margin-right: 10px;
            order: -1;
        }

        .event-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .event-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .reveal-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .reveal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .reveal-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .details {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
            border-left: 4px solid #17a2b8;
            display: none;
            animation: slideDown 0.5s ease;
        }

        .details.show {
            display: block;
        }

        .details.prof-mode {
            background: #fff8e1;
            border-left-color: #ff9800;
        }

        .details h4 {
            color: #17a2b8;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            font-size: 1.1em;
        }

        .details.prof-mode h4 {
            color: #f57c00;
        }

        .details h4:before {
            content: "💡";
            margin-right: 8px;
            font-size: 1.2em;
        }

        .details.prof-mode h4:before {
            content: "👨‍🏫";
        }

        .impact-list {
            list-style: none;
            padding: 0;
        }

        .impact-list li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }

        .impact-list li:before {
            content: "→";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .timeline::before {
                left: 30px;
            }

            .timeline-item {
                width: 100%;
                left: 0 !important;
                padding-left: 70px !important;
                padding-right: 20px !important;
                text-align: left !important;
            }

            .timeline-marker {
                left: 20px !important;
                right: auto !important;
            }

            .timeline-content {
                border-left: 5px solid #667eea !important;
                border-right: none !important;
            }

            .year {
                justify-content: flex-start !important;
            }

            .year-icon {
                margin-left: 10px !important;
                margin-right: 0 !important;
                order: 0 !important;
            }

            .header h1 {
                font-size: 2.2em;
            }

            .toggle-switch {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Timeline de l'IA</h1>
            <p>L'évolution de l'Intelligence Artificielle à travers les âges</p>
        </div>

        <div class="mode-toggle">
            <label class="toggle-switch">
                <input type="checkbox" id="profMode">
                <span class="slider">
                    <span>🎓 Étudiant</span>
                    <span>👨‍🏫 Professeur</span>
                </span>
            </label>
        </div>

        <div class="timeline" id="timeline">
            <!-- Les événements seront générés ici -->
        </div>
    </div>

    <script>
        // Données de la timeline IA
        const aiEvents = [
            {
                year: "1943",
                icon: "⚡",
                title: "Neurones Artificiels",
                description: "McCulloch et Pitts créent le premier modèle mathématique de neurone artificiel.",
                studentDetails: "Ils ont montré qu'on pouvait simuler le fonctionnement d'un neurone avec des mathématiques simples. C'est le début de tout !",
                profDetails: "Warren McCulloch et Walter Pitts publient 'A Logical Calculus of Ideas Immanent in Nervous Activity', établissant les bases théoriques des réseaux de neurones artificiels avec leur modèle binaire du neurone.",
                impacts: [
                    "Première formalisation mathématique du neurone",
                    "Base théorique des réseaux de neurones modernes",
                    "Inspiration pour les futurs perceptrons"
                ]
            },
            {
                year: "1950",
                icon: "🧠",
                title: "Test de Turing",
                description: "Alan Turing propose son célèbre test pour mesurer l'intelligence d'une machine.",
                studentDetails: "Si vous ne pouvez pas faire la différence entre une conversation avec un humain et une machine, alors la machine est intelligente !",
                profDetails: "Dans 'Computing Machinery and Intelligence', Turing introduit le 'jeu de l'imitation' comme critère opérationnel de l'intelligence artificielle, révolutionnant notre approche de la cognition machine.",
                impacts: [
                    "Premier critère objectif d'intelligence artificielle",
                    "Influence majeure sur la philosophie de l'IA",
                    "Référence encore utilisée aujourd'hui"
                ]
            },
            {
                year: "1956",
                icon: "🏛️",
                title: "Conférence de Dartmouth",
                description: "Naissance officielle du terme 'Intelligence Artificielle' lors de cette conférence historique.",
                studentDetails: "Des scientifiques se réunissent et décident d'appeler ça 'Intelligence Artificielle'. Le nom est né !",
                profDetails: "John McCarthy organise la conférence de Dartmouth avec Marvin Minsky, Nathaniel Rochester et Claude Shannon, établissant l'IA comme discipline académique à part entière.",
                impacts: [
                    "Création du terme 'Intelligence Artificielle'",
                    "Établissement de l'IA comme discipline",
                    "Première communauté de recherche organisée"
                ]
            },
            {
                year: "1997",
                icon: "♟️",
                title: "Deep Blue bat Kasparov",
                description: "L'ordinateur Deep Blue d'IBM devient le premier à battre un champion du monde d'échecs.",
                studentDetails: "Un ordinateur a battu le meilleur joueur d'échecs du monde ! C'était incroyable à l'époque.",
                profDetails: "Deep Blue utilise la recherche arborescente avec élagage alpha-bêta et des fonctions d'évaluation sophistiquées, marquant une victoire symbolique de l'IA sur l'intelligence humaine dans un domaine complexe.",
                impacts: [
                    "Premier succès médiatique majeur de l'IA",
                    "Démonstration de la puissance du calcul",
                    "Changement de perception publique de l'IA"
                ]
            },
            {
                year: "2012",
                icon: "👁️",
                title: "AlexNet révolutionne la vision",
                description: "Le réseau AlexNet remporte le concours ImageNet, relançant l'intérêt pour le deep learning.",
                studentDetails: "Un réseau de neurones profond devient soudain super bon pour reconnaître les images. Le deep learning explose !",
                profDetails: "Alex Krizhevsky, Ilya Sutskever et Geoffrey Hinton développent AlexNet, un CNN à 8 couches qui réduit l'erreur top-5 de 26% à 15.3% sur ImageNet, déclenchant la révolution du deep learning.",
                impacts: [
                    "Renaissance du deep learning",
                    "Amélioration drastique de la vision par ordinateur",
                    "Adoption massive des GPUs pour l'IA"
                ]
            },
            {
                year: "2016",
                icon: "🎯",
                title: "AlphaGo bat Lee Sedol",
                description: "DeepMind's AlphaGo devient le premier programme à battre un champion de Go professionnel.",
                studentDetails: "Le Go est un jeu tellement complexe qu'on pensait qu'aucune machine ne pourrait battre un humain. AlphaGo l'a fait !",
                profDetails: "AlphaGo combine Monte Carlo Tree Search avec des réseaux de neurones profonds, maîtrisant un jeu avec 10^170 positions possibles, démontrant la puissance de l'apprentissage par renforcement.",
                impacts: [
                    "Maîtrise d'un jeu d'une complexité extrême",
                    "Avancée majeure en apprentissage par renforcement",
                    "Impact culturel énorme en Asie"
                ]
            },
            {
                year: "2017",
                icon: "🔄",
                title: "Architecture Transformer",
                description: "Google présente l'architecture Transformer qui révolutionnera le traitement du langage naturel.",
                studentDetails: "Une nouvelle façon de faire comprendre le langage aux machines. C'est la base de ChatGPT et de tous les grands modèles !",
                profDetails: "L'article 'Attention Is All You Need' introduit le mécanisme d'attention et l'architecture Transformer, remplaçant les RNN/LSTM et établissant les fondations des modèles de langage modernes.",
                impacts: [
                    "Révolution du traitement du langage naturel",
                    "Base de GPT, BERT et modèles modernes",
                    "Parallélisation efficace de l'entraînement"
                ]
            },
            {
                year: "2022",
                icon: "💬",
                title: "ChatGPT démocratise l'IA",
                description: "OpenAI lance ChatGPT, rendant l'IA conversationnelle accessible au grand public.",
                studentDetails: "Tout le monde peut maintenant parler avec une IA intelligente ! C'est devenu viral instantanément.",
                profDetails: "ChatGPT, basé sur GPT-3.5 avec fine-tuning RLHF, atteint 100 millions d'utilisateurs en 2 mois, démocratisant l'accès aux modèles de langage large et transformant la perception publique de l'IA.",
                impacts: [
                    "Démocratisation de l'IA générative",
                    "100M d'utilisateurs en 2 mois",
                    "Transformation de nombreux secteurs"
                ]
            }
        ];

        let isProfMode = false;
        let revealedEvents = {};

        // Initialisation
        function init() {
            const profModeToggle = document.getElementById('profMode');
            profModeToggle.addEventListener('change', toggleProfMode);
            
            generateTimeline();
        }

        // Générer la timeline
        function generateTimeline() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            aiEvents.forEach((event, index) => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                timelineItem.innerHTML = `
                    <div class="timeline-marker"></div>
                    <div class="timeline-content">
                        <div class="year">
                            ${event.year}
                            <span class="year-icon">${event.icon}</span>
                        </div>
                        <div class="event-title">${event.title}</div>
                        <div class="event-description">${event.description}</div>
                        <button class="reveal-btn" onclick="revealDetails(${index})" id="reveal-${index}">
                            <span>🔍</span> Révéler les détails
                        </button>
                        <div class="details" id="details-${index}">
                            <h4>Détails et Impact</h4>
                            <p id="details-text-${index}"></p>
                            <h4 style="margin-top: 20px;">Impact sur l'IA :</h4>
                            <ul class="impact-list" id="impact-${index}"></ul>
                        </div>
                    </div>
                `;
                timeline.appendChild(timelineItem);
            });
        }

        // Révéler les détails
        function revealDetails(eventIndex) {
            if (revealedEvents[eventIndex]) return;

            revealedEvents[eventIndex] = true;
            const event = aiEvents[eventIndex];
            
            const details = document.getElementById(`details-${eventIndex}`);
            const detailsText = document.getElementById(`details-text-${eventIndex}`);
            const impactList = document.getElementById(`impact-${eventIndex}`);
            
            // Choisir le bon niveau de détail
            const text = isProfMode ? event.profDetails : event.studentDetails;
            detailsText.textContent = text;
            
            // Ajouter la classe prof si nécessaire
            if (isProfMode) {
                details.classList.add('prof-mode');
            }
            
            // Ajouter les impacts
            impactList.innerHTML = event.impacts.map(impact => `<li>${impact}</li>`).join('');
            
            // Afficher les détails
            details.classList.add('show');

            // Désactiver le bouton
            const revealBtn = document.getElementById(`reveal-${eventIndex}`);
            revealBtn.disabled = true;
            revealBtn.innerHTML = '<span>✅</span> Détails révélés';
        }

        // Basculer le mode professeur
        function toggleProfMode() {
            isProfMode = !isProfMode;
            
            // Mettre à jour les détails déjà révélés
            Object.keys(revealedEvents).forEach(eventIndex => {
                const details = document.getElementById(`details-${eventIndex}`);
                const detailsText = document.getElementById(`details-text-${eventIndex}`);
                const event = aiEvents[eventIndex];
                
                const text = isProfMode ? event.profDetails : event.studentDetails;
                detailsText.textContent = text;
                
                if (isProfMode) {
                    details.classList.add('prof-mode');
                } else {
                    details.classList.remove('prof-mode');
                }
            });
        }

        // Démarrer l'application
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
