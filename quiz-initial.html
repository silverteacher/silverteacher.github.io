<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz IA pour Chefs d'Établissement et Inspecteurs</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
min-height: 100vh;
padding: 20px;
}
.quiz-container {
max-width: 900px;
margin: 0 auto;
background: rgba(255, 255, 255, 0.95);
border-radius: 20px;
box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
backdrop-filter: blur(10px);
overflow: hidden;
}
.quiz-header {
background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
color: white;
padding: 30px;
text-align: center;
position: relative;
}
.quiz-header::before {
content: '';
position: absolute;
top: 0;
left: 0;
right: 0;
bottom: 0;
background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="white" fill-opacity="0.1"/><circle cx="75" cy="75" r="1" fill="white" fill-opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
opacity: 0.3;
}
.quiz-title {
font-size: 2.2em;
font-weight: 700;
margin-bottom: 10px;
position: relative;
z-index: 1;
}
.quiz-subtitle {
font-size: 1.1em;
opacity: 0.9;
position: relative;
z-index: 1;
}
.progress-container {
background: rgba(255, 255, 255, 0.1);
height: 6px;
border-radius: 3px;
margin-top: 20px;
overflow: hidden;
position: relative;
z-index: 1;
}
.progress-bar {
height: 100%;
background: linear-gradient(90deg, #10b981, #34d399);
border-radius: 3px;
transition: width 0.5s ease;
width: 0%;
}
.quiz-content {
padding: 40px;
}
.question-card {
background: white;
border-radius: 15px;
padding: 30px;
margin-bottom: 20px;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
border: 1px solid rgba(79, 70, 229, 0.1);
display: none;
animation: slideIn 0.5s ease-out;
}
.question-card.active {
display: block;
}
@keyframes slideIn {
from {
opacity: 0;
transform: translateY(20px);
}
to {
opacity: 1;
transform: translateY(0);
}
}
@keyframes pulse {
0% { transform: scale(1); }
50% { transform: scale(1.05); }
100% { transform: scale(1); }
}
.question-number {
display: inline-block;
background: linear-gradient(135deg, #4f46e5, #7c3aed);
color: white;
padding: 8px 16px;
border-radius: 20px;
font-size: 0.9em;
font-weight: 600;
margin-bottom: 20px;
}
.question-text {
font-size: 1.3em;
font-weight: 600;
color: #1f2937;
margin-bottom: 25px;
line-height: 1.4;
}
.answers-container {
display: flex;
flex-direction: column;
gap: 12px;
}
.answer-option {
background: #f8fafc;
border: 2px solid #e2e8f0;
border-radius: 12px;
padding: 18px 20px;
cursor: pointer;
transition: all 0.3s ease;
position: relative;
overflow: hidden;
}
.answer-option:hover {
background: #f1f5f9;
border-color: #4f46e5;
transform: translateY(-2px);
box-shadow: 0 5px 15px rgba(79, 70, 229, 0.15);
}
.answer-option.selected {
background: #eef2ff;
border-color: #4f46e5;
color: #4f46e5;
font-weight: 600;
animation: pulse 0.3s ease-out;
}
.answer-option.correct {
background: #ecfdf5;
border-color: #10b981;
color: #065f46;
animation: pulse 0.5s ease-out;
}
.answer-option.incorrect {
background: #fef2f2;
border-color: #ef4444;
color: #991b1b;
}
.answer-option::before {
content: '';
position: absolute;
left: 0;
top: 0;
bottom: 0;
width: 4px;
background: transparent;
transition: background 0.3s ease;
}
.answer-option:hover::before {
background: #4f46e5;
}
.answer-option.selected::before {
background: #4f46e5;
}
.answer-option.correct::before {
background: #10b981;
}
.answer-option.incorrect::before {
background: #ef4444;
}
.feedback-container {
background: #f8fafc;
border-radius: 12px;
padding: 20px;
margin-top: 20px;
border-left: 4px solid #4f46e5;
display: none;
animation: slideIn 0.5s ease-out;
}
.feedback-container.show {
display: block;
}
.feedback-title {
font-size: 1.1em;
font-weight: 600;
color: #1f2937;
margin-bottom: 10px;
display: flex;
align-items: center;
gap: 8px;
}
.feedback-icon {
width: 20px;
height: 20px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 12px;
font-weight: bold;
}
.feedback-icon.correct {
background: #10b981;
color: white;
}
.feedback-icon.incorrect {
background: #ef4444;
color: white;
}
.feedback-text {
color: #6b7280;
line-height: 1.5;
}
.controls {
display: flex;
justify-content: space-between;
align-items: center;
margin-top: 30px;
padding-top: 20px;
border-top: 1px solid #e5e7eb;
}
.btn {
padding: 12px 24px;
border: none;
border-radius: 10px;
font-size: 1em;
font-weight: 600;
cursor: pointer;
transition: all 0.3s ease;
text-transform: uppercase;
letter-spacing: 0.5px;
}
.btn-primary {
background: linear-gradient(135deg, #4f46e5, #7c3aed);
color: white;
}
.btn-primary:hover:not(:disabled) {
transform: translateY(-2px);
box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
}
.btn-secondary {
background: #f3f4f6;
color: #6b7280;
}
.btn-secondary:hover:not(:disabled) {
background: #e5e7eb;
color: #374151;
}
.btn:disabled {
opacity: 0.5;
cursor: not-allowed;
transform: none !important;
box-shadow: none !important;
}
.score-display {
text-align: center;
font-size: 1.1em;
color: #6b7280;
background: #f8fafc;
padding: 8px 16px;
border-radius: 8px;
}
.results-card {
text-align: center;
padding: 40px;
display: none;
}
.results-card.show {
display: block;
animation: slideIn 0.5s ease-out;
}
.score-circle {
width: 120px;
height: 120px;
border-radius: 50%;
margin: 0 auto 20px;
display: flex;
align-items: center;
justify-content: center;
font-size: 2em;
font-weight: 700;
color: white;
position: relative;
animation: pulse 1s ease-out;
}
.score-debutant {
background: linear-gradient(135deg, #ef4444, #f87171);
}
.score-base {
background: linear-gradient(135deg, #f59e0b, #fbbf24);
}
.score-alaise {
background: linear-gradient(135deg, #3b82f6, #60a5fa);
}
.score-avance {
background: linear-gradient(135deg, #10b981, #34d399);
}
.score-expert {
background: linear-gradient(135deg, #8b5cf6, #a78bfa);
}
.results-title {
font-size: 2em;
font-weight: 700;
margin-bottom: 15px;
color: #1f2937;
}
.results-subtitle {
font-size: 1.2em;
color: #6b7280;
margin-bottom: 30px;
line-height: 1.5;
}
.recommendation-box {
background: linear-gradient(135deg, #eef2ff, #f3f4f6);
border-radius: 15px;
padding: 25px;
margin: 20px 0;
border-left: 4px solid #4f46e5;
}
.recommendation-title {
font-size: 1.3em;
font-weight: 600;
color: #1f2937;
margin-bottom: 10px;
}
.recommendation-text {
color: #4b5563;
line-height: 1.6;
}
@media (max-width: 768px) {
.quiz-container {
margin: 10px;
border-radius: 15px;
}
.quiz-content {
padding: 20px;
}
.question-card {
padding: 20px;
}
.quiz-title {
font-size: 1.8em;
}
.question-text {
font-size: 1.1em;
}
.controls {
flex-direction: column;
gap: 15px;
}
.btn {
width: 100%;
}
}
</style>
</head>
<body>
<div class="quiz-container">
<div class="quiz-header">
<h1 class="quiz-title">Quiz IA</h1>
<p class="quiz-subtitle">Pour Chefs d'Établissement et Inspecteurs</p>
<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>
</div>
<div class="quiz-content">
<div id="questionsContainer"></div>
<div class="results-card" id="resultsCard">
<div class="score-circle" id="scoreCircle">
<span id="finalScore">0/12</span>
</div>
<h2 class="results-title" id="resultsTitle">Félicitations !</h2>
<p class="results-subtitle" id="resultsSubtitle">Vous avez terminé le quiz</p>
<div class="recommendation-box" id="recommendationBox">
<div class="recommendation-title" id="recommendationTitle">Recommandation</div>
<div class="recommendation-text" id="recommendationText"></div>
</div>
<button class="btn btn-primary" onclick="restartQuiz()">Recommencer</button>
</div>
</div>
</div>

<script>
const questions = [
{
question: "Quel est l'objectif principal du diagnostic de maturité numérique dans le pilotage de l'IA ?",
answers: [
"Identifier les ressources financières nécessaires",
"Connaître le niveau de compétence en IA des enseignants",
"Déterminer le point de départ pour élaborer une stratégie",
"Mesurer l'impact des formations IA sur les élèves"
],
correct: 2,
feedback: {
correct: "Excellent ! Le diagnostic de maturité numérique permet effectivement d'établir un état des lieux précis pour définir une stratégie d'intégration de l'IA adaptée aux besoins spécifiques de l'établissement.",
incorrect: "Le diagnostic de maturité numérique va au-delà des aspects financiers ou de mesure d'impact. Son objectif principal est de dresser un état des lieux complet pour définir une stratégie d'intégration personnalisée."
}
},
{
question: "Pourquoi est-il essentiel d'accompagner les équipes dans l'intégration de l'IA ?",
answers: [
"Pour imposer des pratiques uniformes",
"Pour former les équipes et réduire les résistances",
"Pour limiter les expérimentations individuelles",
"Pour assurer un contrôle direct des usages"
],
correct: 1,
feedback: {
correct: "Parfait ! L'accompagnement des équipes est crucial pour développer leurs compétences et créer un climat de confiance, réduisant ainsi les appréhensions naturelles face aux nouvelles technologies.",
incorrect: "L'accompagnement ne vise pas le contrôle ou l'uniformisation, mais plutôt la formation et la réduction des résistances naturelles au changement technologique."
}
},
{
question: "Quelle est l'approche recommandée pour gérer les résistances au changement lors de l'intégration de l'IA ?",
answers: [
"Forcer l'adoption immédiate",
"Identifier les freins et les transformer en opportunités",
"Ignorer les résistances pour ne pas ralentir le processus",
"Sanctionner les personnes réticentes"
],
correct: 1,
feedback: {
correct: "Très bien ! Transformer les freins en opportunités est une approche constructive qui permet de comprendre les inquiétudes légitimes et d'y apporter des réponses adaptées.",
incorrect: "Une approche coercitive ou d'évitement des résistances est contre-productive. Il est plus efficace d'analyser les freins pour les transformer en leviers d'amélioration."
}
},
{
question: "Quel est le rôle des indicateurs de suivi dans le pilotage de l'IA ?",
answers: [
"Vérifier la conformité aux normes européennes",
"Piloter par les données pour ajuster les actions",
"Evaluer uniquement les résultats des élèves",
"Classer les établissements par performance"
],
correct: 1,
feedback: {
correct: "Excellent ! Les indicateurs de suivi permettent un pilotage data-driven, essentiel pour adapter continuellement la stratégie en fonction des résultats observés.",
incorrect: "Les indicateurs de suivi ont une fonction plus large que la simple conformité ou évaluation. Ils permettent un pilotage dynamique et adaptatif des actions menées."
}
},
{
question: "Que permet la cartographie des positionnements dans le cadre de l'accompagnement IA ?",
answers: [
"Identifier les réticences pour les éliminer",
"Repérer les leaders et les soutenir en priorité",
"Comprendre la diversité des attitudes face à l'IA",
"Définir un cadre uniforme de compétences"
],
correct: 2,
feedback: {
correct: "Parfait ! La cartographie des positionnements révèle la richesse des perspectives et permet d'adapter l'accompagnement aux différents profils d'utilisateurs.",
incorrect: "La cartographie ne vise pas l'uniformisation ou l'élimination des différences, mais plutôt la compréhension de la diversité des attitudes pour mieux personnaliser l'accompagnement."
}
},
{
question: "Quelle compétence est essentielle pour un cadre éducatif face à l'IA ?",
answers: [
"Maitriser les algorithmes de machine learning",
"Développer un esprit critique face aux outils d'IA",
"Former les élèves à la programmation",
"Utiliser exclusivement les outils validés par le ministère"
],
correct: 1,
feedback: {
correct: "Très bien ! L'esprit critique est fondamental pour évaluer la pertinence et les limites des outils d'IA, garantissant un usage éclairé et responsable.",
incorrect: "Un cadre éducatif n'a pas besoin de maîtriser les aspects techniques de l'IA, mais plutôt de développer un regard critique et éthique sur ces technologies."
}
},
{
question: "Quel est l'un des principes fondamentaux de la posture du cadre face à l'IA ?",
answers: [
"L'innovation à tout prix",
"L'exemplarité dans les usages personnels et professionnels",
"La standardisation des pratiques numériques",
"La réduction du nombre d'outils numériques"
],
correct: 1,
feedback: {
correct: "Excellent ! L'exemplarité est cruciale car elle inspire confiance et crédibilité auprès des équipes et des élèves dans l'adoption de ces nouvelles technologies.",
incorrect: "La posture du cadre doit être équilibrée et exemplaire, ni dans l'innovation aveugle ni dans la restriction excessive, mais dans la démonstration de bonnes pratiques."
}
},
{
question: "Quelle compétence est importante pour contextualiser les enjeux liés à l'IA ?",
answers: [
"La littératie numérique avancée",
"La gestion de crise",
"L'analyse statistique",
"La rédaction de protocoles disciplinaires"
],
correct: 0,
feedback: {
correct: "Parfait ! La littératie numérique avancée permet de comprendre les enjeux sociétaux, éthiques et pédagogiques de l'IA dans le contexte éducatif.",
incorrect: "Pour contextualiser les enjeux de l'IA, il faut une compréhension approfondie du numérique et de ses implications, ce que procure la littératie numérique avancée."
}
},
{
question: "Quel est le rôle du devoir de veille pour un cadre éducatif ?",
answers: [
"Garantir la maintenance des outils numériques",
"Informer sur les évolutions réglementaires et éthiques",
"Sanctionner les usages abusifs de l'IA",
"Elaborer des cours d'intelligence artificielle"
],
correct: 1,
feedback: {
correct: "Très bien ! Le devoir de veille permet de rester informé des évolutions rapides du domaine, essentielles pour guider les équipes dans un environnement en constante mutation.",
incorrect: "Le devoir de veille du cadre éducatif concerne l'information et l'anticipation des évolutions plutôt que les aspects techniques ou disciplinaires."
}
},
{
question: "Quelle méthode est conseillée pour une adoption progressive de l'IA ?",
answers: [
"Une mise en place rapide et uniforme",
"Un parcours progressif par étapes",
"Un seul module de formation obligatoire",
"Un accompagnement individualisé uniquement"
],
correct: 1,
feedback: {
correct: "Excellent ! Un parcours progressif par étapes permet une appropriation en douceur, respectant les rythmes d'apprentissage et réduisant les résistances.",
incorrect: "L'adoption de l'IA nécessite une approche progressive et structurée, ni trop rapide ni trop rigide, pour permettre une appropriation durable."
}
},
{
question: "Parmi les étapes suivantes du pilotage du changement lié à l'IA, quelle est la séquence correcte ?",
answers: [
"2 - 1 - 3 - 4 - 5",
"1 - 2 - 3 - 5 - 4",
"3 - 2 - 1 - 5 - 4",
"2 - 3 - 1 - 4 - 5"
],
correct: 0,
feedback: {
correct: "Parfait ! Cette séquence respecte la logique du changement : diagnostic, planification, mise en œuvre, suivi et ajustement.",
incorrect: "Le pilotage du changement suit une logique précise : il faut d'abord diagnostiquer, puis planifier, mettre en œuvre, suivre et ajuster."
}
},
{
question: "Quelle est la meilleure pratique pour encourager l'appropriation des outils d'IA par les équipes éducatives ?",
answers: [
"Imposer une formation obligatoire unique pour tous les personnels",
"Proposer un accompagnement différencié et progressif en fonction des besoins",
"Mettre en place un contrôle strict des usages dès le début",
"Limiter les expérimentations individuelles pour éviter les erreurs"
],
correct: 1,
feedback: {
correct: "Excellent ! Un accompagnement différencié respecte la diversité des profils et favorise une appropriation authentique et durable des outils d'IA.",
incorrect: "L'appropriation des outils d'IA ne peut être forcée. Elle nécessite un accompagnement personnalisé qui respecte les besoins et rythmes de chacun."
}
}
];

let currentQuestion = 0;
let score = 0;
let selectedAnswers = [];
let showingFeedback = false;

function initQuiz() {
displayQuestion();
updateProgress();
}

function displayQuestion() {
const container = document.getElementById('questionsContainer');
if (currentQuestion >= questions.length) {
showResults();
return;
}

const q = questions[currentQuestion];
container.innerHTML = `
<div class="question-card active">
<div class="question-number">Question ${currentQuestion + 1} sur ${questions.length}</div>
<div class="question-text">${q.question}</div>
<div class="answers-container">
${q.answers.map((answer, index) => `
<div class="answer-option" onclick="selectAnswer(${index})" data-index="${index}">
${answer}
</div>
`).join('')}
</div>
<div class="feedback-container" id="feedbackContainer">
<div class="feedback-title" id="feedbackTitle"></div>
<div class="feedback-text" id="feedbackText"></div>
</div>
<div class="controls">
<button class="btn btn-secondary" onclick="previousQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>
Précédent
</button>
<div class="score-display">
Score: ${score}/${currentQuestion}
</div>
<button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>
${currentQuestion === questions.length - 1 ? 'Terminer' : 'Suivant'}
</button>
</div>
</div>
`;
showingFeedback = false;
}

function selectAnswer(answerIndex) {
if (showingFeedback) return;

const options = document.querySelectorAll('.answer-option');
options.forEach(option => option.classList.remove('selected'));
const selectedOption = document.querySelector(`[data-index="${answerIndex}"]`);
selectedOption.classList.add('selected');
selectedAnswers[currentQuestion] = answerIndex;
document.getElementById('nextBtn').disabled = false;
}

function nextQuestion() {
if (!showingFeedback && selectedAnswers[currentQuestion] !== undefined) {
// Première fois : afficher le feedback
showFeedback();
} else if (showingFeedback) {
// Deuxième fois : passer à la question suivante
currentQuestion++;
displayQuestion();
updateProgress();
}
}

function showFeedback() {
const correct = questions[currentQuestion].correct;
const selected = selectedAnswers[currentQuestion];
const options = document.querySelectorAll('.answer-option');
const feedbackContainer = document.getElementById('feedbackContainer');
const feedbackTitle = document.getElementById('feedbackTitle');
const feedbackText = document.getElementById('feedbackText');
const nextBtn = document.getElementById('nextBtn');

// Marquer les réponses
options[correct].classList.add('correct');
if (selected !== correct) {
options[selected].classList.add('incorrect');
}

// Mettre à jour le score
if (selected === correct) {
score++;
}

// Afficher le feedback
const isCorrect = selected === correct;
const feedback = questions[currentQuestion].feedback;

feedbackTitle.innerHTML = `
<div class="feedback-icon ${isCorrect ? 'correct' : 'incorrect'}">
${isCorrect ? '✓' : '✗'}
</div>
${isCorrect ? 'Bonne réponse !' : 'Réponse incorrecte'}
`;

feedbackText.textContent = isCorrect ? feedback.correct : feedback.incorrect;
feedbackContainer.classList.add('show');

// Changer le texte du bouton
nextBtn.textContent = currentQuestion === questions.length - 1 ? 'Voir les résultats' : 'Question suivante';

showingFeedback = true;

// Désactiver la sélection des réponses
options.forEach(option => {
option.style.pointerEvents = 'none';
});
}

function previousQuestion() {
if (currentQuestion > 0) {
currentQuestion--;
displayQuestion();
updateProgress();
}
}

function updateProgress() {
const progress = ((currentQuestion) / questions.length) * 100;
document.getElementById('progressBar').style.width = progress + '%';
}

function showResults() {
document.getElementById('questionsContainer').style.display = 'none';
const resultsCard = document.getElementById('resultsCard');
const scoreCircle = document.getElementById('scoreCircle');
const finalScore = document.getElementById('finalScore');
const resultsTitle = document.getElementById('resultsTitle');
const resultsSubtitle = document.getElementById('resultsSubtitle');
const recommendationTitle = document.getElementById('recommendationTitle');
const recommendationText = document.getElementById('recommendationText');

finalScore.textContent = `${score}/${questions.length}`;
const percentage = (score / questions.length) * 100;

// Système d'évaluation à 4 échelles
if (percentage <= 20) {
scoreCircle.className = 'score-circle score-debutant';
resultsTitle.textContent = 'Débutant';
resultsSubtitle.textContent = 'Il est temps de vous former sur l\'IA en éducation.';
recommendationTitle.textContent = 'Votre parcours recommandé';
recommendationText.textContent = 'Vous gagneriez à suivre un maximum de modules dans ce parcours pour développer une compréhension solide de l\'IA en éducation.';
} else if (percentage <= 30) {
scoreCircle.className = 'score-circle score-base';
resultsTitle.textContent = 'Bonnes bases';
resultsSubtitle.textContent = 'Vous avez quelques notions, continuez à vous former.';
recommendationTitle.textContent = 'Votre parcours recommandé';
recommendationText.textContent = 'Vous avez de bonnes bases, choisissez au moins 5 modules dans ce parcours pour approfondir vos connaissances.';
} else if (percentage <= 50) {
scoreCircle.className = 'score-circle score-alaise';
resultsTitle.textContent = 'Plutôt à l\'aise';
resultsSubtitle.textContent = 'Vous maîtrisez les bases, perfectionnez-vous.';
recommendationTitle.textContent = 'Votre parcours recommandé';
recommendationText.textContent = 'Vous êtes plutôt à l\'aise, choisissez au moins 4 modules de votre choix pour vous perfectionner.';
} else if (percentage <= 80) {
scoreCircle.className = 'score-circle score-avance';
resultsTitle.textContent = 'Très bien !';
resultsSubtitle.textContent = 'Vous êtes à l\'aise sur le sujet de l\'IA.';
recommendationTitle.textContent = 'Votre parcours recommandé';
recommendationText.textContent = 'Vous êtes à l\'aise sur le sujet de l\'IA, choisissez deux modules pour aller plus loin.';
} else {
scoreCircle.className = 'score-circle score-expert';
resultsTitle.textContent = 'Excellent !';
resultsSubtitle.textContent = 'Vous maîtrisez parfaitement les enjeux de l\'IA.';
recommendationTitle.textContent = 'Votre parcours recommandé';
recommendationText.textContent = 'Vous êtes très à l\'aise sur le sujet de l\'IA. Choisissez les modules que vous voulez selon vos intérêts spécifiques.';
}

resultsCard.classList.add('show');
document.getElementById('progressBar').style.width = '100%';
}

function restartQuiz() {
currentQuestion = 0;
score = 0;
selectedAnswers = [];
showingFeedback = false;
document.getElementById('questionsContainer').style.display = 'block';
document.getElementById('resultsCard').classList.remove('show');
initQuiz();
}

// Initialiser le quiz
initQuiz();
</script>
